# C 端接口契约 —— 路由前缀 /api/v1/app/**
#
# 消费方：C 端（桌面 Web）。公共组件（统一响应 / 错误码 / 分页）见 common.yaml。
#
# 状态：**账号与宠物档案（#94）、打卡与评分（#97）、提醒与消息（#99）、文件（#95）已定义**。
# 其余业务接口待地图上未裁决的决策：订单交易 #77（且卡在支付语义澄清）、券池 #53、
# 核销 #55、裂变 #54、标准目录 #75、服务者入驻 #78、AI 对话与分诊见 docs/design/ai-service.md。
#
# 契约先于代码（ADR-0005）：**前端类型由契约生成**（pnpm --filter @pet-health/shared gen:api），
# **后端 DTO 手写**但必须与契约对齐。改了这里就要重跑生成，CI 会检查生成物是否同步。

openapi: 3.1.0

info:
  title: 宠物 AI 健康管理平台 · C 端接口
  version: 0.2.0
  description: |
    路由前缀 `/api/v1/app/**`。公共组件见 `common.yaml`。

    两条贯穿全部接口的约定：

    - **鉴权**：除 `/auth/**` 外都要求 `Authorization: Bearer <access_token>`，
      Token 的登录域必须是 `app`（ADR-0012）。C 端 Token 调服务者后台接口一律 40100。
    - **越权**：所有资源按归属校验（交付文档 6.3）。**别人的资源一律按不存在处理**（40400），
      不返回 40300——40300 会泄露「这个 id 存在」这一事实。

servers:
  - url: /api/v1/app

tags:
  - name: auth
    description: 注册 / 登录 / 刷新 / 退出
  - name: user
    description: 当前用户资料与当前宠物
  - name: pet
    description: 宠物档案（多宠、软删除与恢复）
  - name: checkin
    description: 打卡（六项健康任务，规则见 ADR-0018）
  - name: score
    description: 健康评分（五维，算法见 ADR-0018）
  - name: record
    description: 档案记录（本期只做防疫：疫苗 / 驱虫日期）
  - name: message
    description: 消息中心（健康提醒 + 业务通知，决策见 ADR-0019）
  - name: file
    description: 文件元数据与上传凭证（切片 #95，决策见 ADR-0020；**字节不经这里**）
  - name: ai
    description: AI 健康咨询（切片 #98；分级标准与红线见 ADR-0021，模型调用在独立服务里，见 ADR-0009）

security:
  - bearerAuth: []

paths:
  /auth/register:
    post:
      tags: [auth]
      summary: 手机号 + 密码注册
      description: |
        注册成功直接返回令牌（不要求再登录一次）。
        手机号在库中加密存储（ADR-0013），响应里一律脱敏。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "200":
          description: 注册成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/TokenPair" }
        "400":
          description: 参数错误（40001）
        "409":
          description: 手机号已被注册（40900）

  /auth/login:
    post:
      tags: [auth]
      summary: 手机号 + 密码登录
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/TokenPair" }
        "401":
          description: 手机号或密码不正确（40100）
        "403":
          description: 账号已被禁用（40300）
        "429":
          description: 尝试过于频繁（42900）

  /auth/refresh:
    post:
      tags: [auth]
      summary: 用 Refresh Token 换新令牌
      description: |
        Refresh 一次性使用：换发新的一对令牌，旧 Refresh 立即作废（ADR-0012）。
        过期或已作废的 Refresh 返回 40101，前端跳登录。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: 换发成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/TokenPair" }
        "401":
          description: Refresh Token 无效或已过期（40101）

  /auth/logout:
    post:
      tags: [auth]
      summary: 退出登录
      description: |
        作废当前 Refresh Token。**已签发的 Access Token 在剩余有效期（≤2 小时）内仍有效**——
        这是不引入 jti 黑名单的必然代价，见 ADR-0012。重复调用同样返回成功（幂等）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
      responses:
        "200":
          description: 已退出
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/ApiResponse"

  /users/me:
    get:
      tags: [user]
      summary: 当前用户资料
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/UserProfile" }
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
    put:
      tags: [user]
      summary: 更新当前用户资料
      description: 只传要改的字段；不传或传 `null` 表示不改。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: 更新后的资料
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/UserProfile" }
        "400":
          description: 参数错误（40001）

  /users/me/active-pet:
    put:
      tags: [user]
      summary: 切换当前宠物
      description: |
        多宠家庭在这个账号上记住「当前在看谁」，跨浏览器一致。
        切到不属于自己的宠物、或已被删除的宠物，返回 40400。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivatePetRequest"
      responses:
        "200":
          description: 切换后的资料
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/UserProfile" }
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"

  /pets:
    get:
      tags: [pet]
      summary: 我的宠物列表
      description: |
        默认只返回未删除的宠物。`deleted=true` 时返回**回收站**——软删除且仍在 30 天恢复期内的。
        宠物按账号维度数量很小，不分页。

        **当前选中哪只不在这里**：那是账号上的偏好（`UserProfile.active_pet_id`），
        前端打开应用时读一次 `/users/me` 即可，不必让每个宠物都带一个 `is_active` 标记。
      parameters:
        - name: deleted
          in: query
          description: 是否查询回收站
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Pet" }
    post:
      tags: [pet]
      summary: 添加宠物
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PetCreateRequest"
      responses:
        "200":
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Pet" }
        "400":
          description: 参数错误（40001）

  /pets/{pet_id}:
    parameters:
      - $ref: "#/components/parameters/PetId"
    get:
      tags: [pet]
      summary: 宠物详情
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Pet" }
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
    put:
      tags: [pet]
      summary: 编辑宠物
      description: 只传要改的字段；不传或传 `null` 表示不改。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PetUpdateRequest"
      responses:
        "200":
          description: 更新后的宠物
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Pet" }
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
    delete:
      tags: [pet]
      summary: 删除宠物（软删除）
      description: |
        软删除，30 天内可恢复（`POST /pets/{pet_id}/restore`）。
        按 `docs/conventions.md`「物理删除仅限账号注销场景」，过期后记录仍保留，只是不再可恢复。
      responses:
        "200":
          description: 已删除
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/ApiResponse"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"

  /pets/{pet_id}/restore:
    post:
      tags: [pet]
      summary: 恢复被删除的宠物
      description: 超过 30 天恢复期后返回 40400（前端提示「已超过恢复期」，与「不存在」同一处理）。
      parameters:
        - $ref: "#/components/parameters/PetId"
      responses:
        "200":
          description: 恢复后的宠物
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Pet" }
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"

  # ---------- 打卡（切片 #97，规则见 ADR-0018）----------
  /pets/{pet_id}/check-ins:
    parameters:
      - $ref: "#/components/parameters/PetId"
    get:
      tags: [checkin]
      summary: 某一天的打卡状态
      description: |
        返回六项打卡各自的状态；不传 `date` 时按服务器当天（Asia/Shanghai）。

        **任一项有记录即算当日已打卡**；不必凑齐六项（ADR-0018：桌面 Web 上强制六项会让人放弃）。
      parameters:
        - name: date
          in: query
          description: 业务日期 `YYYY-MM-DD`；只能查过去 7 天到今天，更早的返回 40001
          schema: { type: string, example: "2026-09-27" }
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/CheckInDay" }
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
    post:
      tags: [checkin]
      summary: 提交打卡（幂等）
      description: |
        重复提交同「宠物 + 日期 + 分项」是**更新**而不是新增——用户改主意（饮食从「正常」改成「食欲差」）
        就是改这一条。可以一次提交多项（「全部正常」按钮即六项一起提交）。

        补录：`date` 传过去 7 天内的日期即可，记录上会标 `backfilled=true`，不冒充当场录入。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckInSubmitRequest" }
      responses:
        "200":
          description: 提交后的当日状态
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/CheckInDay" }
        "400":
          description: 参数错误（40001），含日期超出可补录窗口
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"

  /pets/{pet_id}/check-ins/item:
    parameters:
      - $ref: "#/components/parameters/PetId"
    delete:
      tags: [checkin]
      summary: 撤销某一项打卡
      description: 填错了可以撤掉（幂等：本来就没有也返回成功）。只允许撤销可补录窗口内的记录。
      parameters:
        - name: date
          in: query
          required: true
          schema: { type: string, example: "2026-09-27" }
        - name: category
          in: query
          required: true
          description: 分项编号 1体重2饮食3排泄4行为5情绪6卫生
          schema: { type: integer, minimum: 1, maximum: 6 }
      responses:
        "200":
          description: 撤销后的当日状态
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/CheckInDay" }
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"

  /pets/{pet_id}/check-ins/streak:
    parameters:
      - $ref: "#/components/parameters/PetId"
    get:
      tags: [checkin]
      summary: 连续打卡天数
      description: |
        按「有记录的连续自然日」计算，**补录计入**（ADR-0018）；今天还没打卡不算断签
        （昨天有就算连续，今天补上即可）。
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/CheckInStreak" }
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"

  # ---------- 防疫记录（切片 #99 顺带：疫苗/驱虫日期，疫苗提醒的数据源，也让评分「防疫」维度可计分）----------
  /pets/{pet_id}/epidemic-records:
    parameters:
      - $ref: "#/components/parameters/PetId"
    get:
      tags: [record]
      summary: 疫苗 / 驱虫记录列表
      description: 按应接种日期倒序返回。数据落在档案记录表的防疫分项（category=7）上。
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/EpidemicRecord" }
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
    post:
      tags: [record]
      summary: 录入一条疫苗 / 驱虫记录
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EpidemicRecordInput" }
      responses:
        "200":
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/EpidemicRecord" }
        "400":
          description: 参数错误（40001）
  /pets/{pet_id}/epidemic-records/{record_id}:
    parameters:
      - $ref: "#/components/parameters/PetId"
      - name: record_id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    delete:
      tags: [record]
      summary: 删除一条防疫记录（软删除，幂等）
      responses:
        "200":
          description: 已删除
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/ApiResponse"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"

  # ---------- 消息中心（切片 #99，决策见 ADR-0019）----------
  /messages:
    get:
      tags: [message]
      summary: 消息列表（分页）
      description: |
        消息中心的内容：**健康提醒**（kind=reminder，系统主动生成）与**业务通知**（kind=notification，事件驱动）
        共用一张表与一套已读逻辑。

        读取时会**惰性补算一次提醒**（与每日批算共用同一个幂等生成函数）——所以用户打开时看到的一定是最新的
        （ADR-0019 的实现说明）。
      parameters:
        - name: kind
          in: query
          description: 只看某一类；不传则两类都返回
          schema: { type: integer, enum: [1, 2] }
        - name: unread_only
          in: query
          schema: { type: boolean, default: false }
        - $ref: "./common.yaml#/components/parameters/Page"
        - $ref: "./common.yaml#/components/parameters/PageSize"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "./common.yaml#/components/schemas/PageResult"
                          - type: object
                            properties:
                              list:
                                type: array
                                items: { $ref: "#/components/schemas/MessageView" }

  /messages/highlights:
    get:
      tags: [message]
      summary: 首页「需要你关注」的强提醒流
      description: |
        按风险等级与指向时间排序的**未读**提醒，默认 6 条（交付文档 4.16.2 画的就是 6 张卡）。
        只返回健康提醒，业务通知不进这一区。

        这一处与消息列表一样会**惰性补算**提醒；未读数接口（`/messages/unread-count`）不会——
        角标每次切页都会拉，不该让它写库。
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 10, default: 6 }
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/MessageView" }

  /messages/unread-count:
    get:
      tags: [message]
      summary: 未读数（顶栏角标）
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          unread: { type: integer }
                          unread_reminders: { type: integer, description: 其中健康提醒的未读数 }

  /messages/read-all:
    put:
      tags: [message]
      summary: 全部标记已读
      description: 幂等：没有未读时也返回成功。返回最新的未读数。
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          unread: { type: integer }

  /messages/{message_id}:
    delete:
      tags: [message]
      summary: 删除单条消息（软删除，幂等）
      description: |
        删除不等于关闭该类型：用户删掉这一条，不代表以后不想收这类提醒。
        要停止某一类请用 `/messages/settings`。
      parameters:
        - name: message_id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: 已删除
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/ApiResponse"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"

  /messages/{message_id}/read:
    put:
      tags: [message]
      summary: 标记单条已读
      parameters:
        - name: message_id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: 成功（幂等）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/MessageView" }
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"

  /messages/settings:
    get:
      tags: [message]
      summary: 我的提醒开关
      description: 返回五类（疫苗/驱虫/日常/异常/趋势）与专项（慢病老年）的开关状态——它们是**提醒**的类型，不是业务通知的。
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/ReminderSetting" }
    put:
      tags: [message]
      summary: 修改某类提醒的开关
      description: |
        **红色等级的提醒不可关闭**（ADR-0019：用户安全 > 体验）。平台级已关掉的类型也不能由用户打开。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReminderSettingInput" }
      responses:
        "200":
          description: 修改后的全部开关
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/ReminderSetting" }
        "400":
          description: 参数错误（40001），含「该类型不可关闭」

  # ---------- 健康评分（切片 #97，算法见 ADR-0018）----------
  /pets/{pet_id}/health-score:
    parameters:
      - $ref: "#/components/parameters/PetId"
    get:
      tags: [score]
      summary: 当日健康评分与近 7 天趋势
      description: |
        五维 = 生理 / 行为 / 卫生 / 防疫 / 老年。**评分口径是「被观察到的健康」，不是医学评估**：

        - 每维 = 70 × 近 7 天记录完整度 + 30 × (1 − 0.1 × 异常项数)；
        - 总分 = 已计入维度的等权平均；
        - **防疫**在没有疫苗/驱虫记录时不计入（`score: null`，前端显示「待录入」）；
        - **老年**专项未开启（年龄 < 7 岁且无慢病）时不计入（显示「未开启」）；
        - 一条记录都没有时 `total_score` 为 null，前端显示「还没有评分」而不是 0 分。
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/HealthScore" }
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"

  /files/presign:
    post:
      tags: [file]
      summary: 申请上传凭证（一次可多张）
      description: |
        返回每个文件的**直传地址**（带签名与有效期）——浏览器把字节直接 PUT 到那里，不经业务接口。

        声明的 `mime` 与 `size_bytes` 只用于提前拦截；**落库以魔数判定与实际字节数为准**（ADR-0020）。

        一次最多 9 张；上传完成后用 `file_id` 关联业务（打卡 / 防疫 / 证件 / 咨询 / 护理）。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FilePresignRequest" }
      responses:
        "200":
          description: 每个文件一条凭证
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/FilePresignView" }

  /files:
    get:
      tags: [file]
      summary: 我的文件列表
      description: 只返回已落定的原图（缩略图是其派生物，不单独出现在列表里）。`url` 是签名读地址，有有效期。
      parameters:
        - name: pet_id
          in: query
          schema: { type: integer, format: int64 }
        - name: biz_type
          in: query
          description: 按用途过滤：checkin / epidemic / profile / ai_consult / care
          schema: { type: string }
      responses:
        "200":
          description: 文件列表（按 id 倒序，即最近上传在前）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/FileView" }

  /files/{file_id}:
    get:
      tags: [file]
      summary: 单个文件
      responses:
        "200":
          description: 文件元数据（含签名读地址）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/FileView" }
    delete:
      tags: [file]
      summary: 删除文件（软删，连同缩略图）
      description: 字节一并从存储里删掉。**别人的文件按不存在处理**（40400）。
      responses:
        "200":
          description: 已删除
          content:
            application/json:
              schema: { $ref: "./common.yaml#/components/schemas/ApiResponse" }

  /pets/{pet_id}/ai-consults:
    post:
      tags: [ai]
      summary: 发起一次 AI 健康咨询
      description: |
        返回**就医紧迫程度**（1 绿 / 2 黄 / 3 红），不是诊断。

        三条行为上的约定：

        - `question` **必填**：纯图片分诊不可用（61 号调研实测皮肤病零样本只有 33%），
          补上症状文本才到 72–94%，所以缺文字描述直接 40001；
        - 命中硬红线时**不经模型**，直接判红并在 `red_flag_hits` 里给出规则编号（ADR-0021）；
        - AI 服务超时或不可用时**不报错**：返回 `degraded=true` 的保守答复，HTTP 仍是 200
          （交付文档 2.4）。
      parameters:
        - name: pet_id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiConsultRequest" }
      responses:
        "200":
          description: 咨询结果（可能是降级答复）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AiConsultView" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    PetId:
      name: pet_id
      in: path
      required: true
      schema: { type: integer, format: int64 }

  schemas:
    RegisterRequest:
      type: object
      required: [phone, password]
      properties:
        phone:
          type: string
          description: 中国大陆手机号
          pattern: "^1[3-9]\\d{9}$"
          example: "13800138000"
        password:
          type: string
          description: 8–32 位，至少含一个字母与一个数字
          minLength: 8
          maxLength: 32
        nickname:
          type: string
          description: 可选；不传时按「宠物主人」生成
          maxLength: 64

    LoginRequest:
      type: object
      required: [phone, password]
      description: |
        **登录不做口令格式校验**（不设 minLength 之类）：格式规则只属于注册，
        登录只有「匹配 / 不匹配」两种结果，不匹配一律 40100。
      properties:
        phone: { type: string, example: "13800138000" }
        password: { type: string, example: "pet12345" }

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string }

    LogoutRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string }

    TokenPair:
      type: object
      required: [access_token, refresh_token, expires_in, user]
      properties:
        access_token:
          type: string
          description: "JWT；请求时放 Authorization: Bearer 请求头"
        refresh_token:
          type: string
          description: 不透明随机串，一次性使用（ADR-0012）
        expires_in:
          type: integer
          description: Access Token 剩余秒数（7200）
        user: { $ref: "#/components/schemas/UserProfile" }

    UserProfile:
      type: object
      required: [id, phone, nickname, gender]
      properties:
        id: { type: integer, format: int64 }
        phone:
          type: string
          description: 脱敏手机号，形如 `138****8000`
          example: "138****8000"
        nickname: { type: string }
        avatar:
          type: string
          description: 头像 URL；未设置为 null
        gender:
          type: integer
          description: "0 未知 / 1 男 / 2 女"
          enum: [0, 1, 2]
        active_pet_id:
          type: integer
          format: int64
          description: |
            最近一次显式切换到的宠物。没切换过、或那只宠物已被删除时为 null——
            这时前端取宠物列表的第一只作为默认。
        created_at: { type: string, example: "2026-09-27 10:00:00" }

    UpdateProfileRequest:
      type: object
      description: |
        「不改」与「清空」是两件事：字段不传或传 `null` = 不改；`avatar` 传空串 = 清空头像。
        `nickname` 是必填性字段（库里 NOT NULL），传空串返回 40001。
      properties:
        nickname: { type: string, maxLength: 64 }
        avatar: { type: string, maxLength: 512, description: 传空串表示清空 }
        gender: { type: integer, enum: [0, 1, 2] }

    ActivatePetRequest:
      type: object
      required: [pet_id]
      properties:
        pet_id: { type: integer, format: int64 }

    Pet:
      type: object
      required: [id, name, species, gender]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, example: "豆豆" }
        species:
          type: integer
          description: "1 犬 / 2 猫"
          enum: [1, 2]
        breed:
          type: string
          description: 品种；未填为 null
          example: "柯基"
        gender:
          type: integer
          description: "0 未知 / 1 公 / 2 母"
          enum: [0, 1, 2]
        birthday:
          type: string
          description: 生日 `YYYY-MM-DD`；未填为 null
          example: "2023-05-01"
        weight:
          type: string
          description: 体重 kg，两位小数。**字符串**——浮点在 JS 里会丢精度（ADR-0011）
          example: "12.50"
        avatar: { type: string }
        is_sterilized:
          type: boolean
          description: 是否绝育
        is_chronic:
          type: boolean
          description: 是否有慢病（触发专项照护，见 #92）
        chronic_desc:
          type: string
          description: 慢病描述；`is_chronic=false` 时为 null
        restorable_until:
          type: string
          description: 仅回收站里有值——可恢复的截止时间（删除后 30 天）
          example: "2026-10-27 10:00:00"
        created_at: { type: string, example: "2026-09-27 10:00:00" }
        updated_at: { type: string, example: "2026-09-27 10:00:00" }

    PetCreateRequest:
      type: object
      required: [name, species]
      properties:
        name: { type: string, maxLength: 64, example: "豆豆" }
        species: { type: integer, enum: [1, 2] }
        breed: { type: string, maxLength: 64 }
        gender: { type: integer, enum: [0, 1, 2], default: 0 }
        birthday:
          type: string
          description: "生日格式 YYYY-MM-DD，不得晚于今天"
          example: "2023-05-01"
        weight:
          type: string
          description: 体重 kg，两位小数；范围 0.01–999.99
          example: "12.50"
        avatar: { type: string, maxLength: 512 }
        is_sterilized: { type: boolean, default: false }
        is_chronic: { type: boolean, default: false }
        chronic_desc:
          type: string
          maxLength: 512
          description: 慢病描述；`is_chronic=true` 时必填

    PetUpdateRequest:
      type: object
      description: |
        「不改」与「清空」是两件事：字段不传或传 `null` = 不改；
        `breed` / `avatar` 传空串 = 清空。
        `chronic_desc` 传空串同样表示清空，但**只在 `is_chronic=false` 时成立**——
        标记为慢病时它是必填项，传空会返回 40001。
        `name` 传空串返回 40001；`weight` / `birthday` 不接受空串（要改就得给合法值）。
      properties:
        name: { type: string, maxLength: 64 }
        species: { type: integer, enum: [1, 2] }
        breed: { type: string, maxLength: 64 }
        gender: { type: integer, enum: [0, 1, 2] }
        birthday: { type: string, example: "2023-05-01" }
        weight: { type: string, example: "12.50" }
        avatar: { type: string, maxLength: 512 }
        is_sterilized: { type: boolean }
        is_chronic: { type: boolean }
        chronic_desc: { type: string, maxLength: 512 }

    # ---------- 打卡（切片 #97）----------

    CheckInSubmitRequest:
      type: object
      required: [date, items]
      properties:
        date:
          type: string
          description: 业务日期 `YYYY-MM-DD`。传今天=当场录入；传过去 7 天内=补录（记录标 `backfilled`）
          example: "2026-09-27"
        items:
          type: array
          minItems: 1
          maxItems: 6
          description: 本次提交的分项；同一个日期可以分多次提交（例如先记体重，晚上再补其他的）
          items: { $ref: "#/components/schemas/CheckInItemInput" }

    CheckInItemInput:
      type: object
      required: [category]
      properties:
        category:
          type: integer
          description: "1 体重 / 2 饮食 / 3 排泄 / 4 行为 / 5 情绪 / 6 卫生"
          enum: [1, 2, 3, 4, 5, 6]
        abnormal:
          type: boolean
          default: false
          description: 用户是否标注为异常。**评分按它扣分**，所以是打卡里最有信息量的一个字段
        value:
          type: string
          description: 结构化取值：体重是数字字符串（kg），其余是选项值（如 normal / low / high）
          example: "12.50"
        note:
          type: string
          maxLength: 200
          description: 补充说明（异常时建议填写）

    CheckInItem:
      type: object
      required: [category, name, abnormal]
      properties:
        category: { type: integer, enum: [1, 2, 3, 4, 5, 6] }
        name: { type: string, example: "体重" }
        filled: { type: boolean, description: 该分项当天是否已有记录 }
        abnormal: { type: boolean }
        value: { type: string }
        note: { type: string }
        backfilled: { type: boolean, description: 该条是否为补录 }

    CheckInDay:
      type: object
      required: [date, items, completed_count, total_count, done]
      properties:
        date: { type: string, example: "2026-09-27" }
        items:
          type: array
          items: { $ref: "#/components/schemas/CheckInItem" }
        completed_count:
          type: integer
          description: 已填分项数（进度 n/6）
        total_count: { type: integer, example: 6 }
        done:
          type: boolean
          description: 当日是否已打卡——**任一项有记录即为 true**（ADR-0018），不要求凑齐六项
        backfilled: { type: boolean, description: 本次查询的日期是否为补录（今天之前的日期） }

    CheckInStreak:
      type: object
      required: [streak_days, checked_today]
      properties:
        streak_days:
          type: integer
          description: 连续打卡天数（有记录的连续自然日；补录计入；断签归零）
        checked_today:
          type: boolean
          description: 今天是否已经有记录。今天未打卡不算断签——昨天有记录就仍算连续
        longest_streak_days:
          type: integer
          description: |
            最长连续段，**按现有记录计算**（不是历史峰值）：删掉某天的记录，那段也就不存在了。
            权益若要按连续天数发奖（#113），需要单独存历史峰值。

    # ---------- 健康评分（切片 #97）----------

    HealthScoreDimension:
      type: object
      required: [key, name, included]
      properties:
        key: { type: string, enum: [physiology, behavior, hygiene, epidemic, elderly] }
        name: { type: string, example: "生理" }
        score:
          type: integer
          description: 该维得分；为 null 表示未计入（见 `excluded_reason`）
        included: { type: boolean, description: 是否计入了总分 }
        excluded_reason:
          type: string
          description: 未计入的原因，前端直接展示：「待录入」（防疫无数据）/「未开启」（老年专项）/「暂无记录」
        detail:
          type: string
          description: 一句话说明分数怎么来的，例如「近 7 天记录 4 天，异常 1 次」——评分必须可解释

    HealthScore:
      type: object
      required: [grade, dimensions]
      properties:
        total_score:
          type: integer
          description: 总分；一条记录都没有时为 null（前端显示「还没有评分」，不要显示 0 分）
        grade:
          type: string
          description: 中性档位文案：良好 / 尚可 / 需关注 / 暂无数据
        dimensions:
          type: array
          items: { $ref: "#/components/schemas/HealthScoreDimension" }
        trend:
          type: array
          description: 近 7 天总分序列（缺失的日期不出现），供首页趋势展示
          items:
            type: object
            properties:
              date: { type: string, example: "2026-09-27" }
              total_score: { type: integer }
        calc_date: { type: string, example: "2026-09-27" }
        disclaimer:
          type: string
          description: 口径声明，前端必须展示：评分是「被观察到的健康」，不是医学评估

    # ---------- 防疫记录（切片 #99）----------

    EpidemicRecordInput:
      type: object
      required: [kind, name, given_on]
      properties:
        kind:
          type: integer
          description: "1 疫苗 / 2 驱虫"
          enum: [1, 2]
        name:
          type: string
          maxLength: 64
          description: 名称，如「狂犬疫苗」「体内驱虫」
          example: "狂犬疫苗"
        given_on:
          type: string
          description: 接种 / 执行日期 `YYYY-MM-DD`，不能晚于今天
          example: "2026-09-01"
        next_due_on:
          type: string
          description: |
            下次应接种日期 `YYYY-MM-DD`。**它是疫苗/驱虫提醒的唯一依据**——
            不填就没有提醒（宁可少提醒，也不要替用户猜周期）。
          example: "2027-09-01"

    EpidemicRecord:
      type: object
      required: [id, kind, name, given_on]
      properties:
        id: { type: integer, format: int64 }
        kind: { type: integer, enum: [1, 2] }
        name: { type: string }
        given_on: { type: string, example: "2026-09-01" }
        next_due_on:
          type: string
          description: 未填为 null
          example: "2027-09-01"
        days_until_due:
          type: integer
          description: 距下次应接种还有几天；负数表示已过期。未填 next_due_on 时为 null

    # ---------- 消息中心（切片 #99）----------

    MessageView:
      type: object
      required: [id, kind, type, title, remind_at, read]
      properties:
        id: { type: integer, format: int64 }
        kind:
          type: integer
          description: "1 健康提醒 / 2 业务通知"
          enum: [1, 2]
        type:
          type: integer
          description: 1疫苗2驱虫3日常4异常5趋势6慢病老年7订单8券9邀请10系统
        title: { type: string, example: "狂犬疫苗还有 5 天到期" }
        content: { type: string }
        risk_level:
          type: integer
          description: "0 无 / 1 绿 / 2 黄 / 3 红。**红色提醒不可关闭**（ADR-0019）"
          enum: [0, 1, 2, 3]
        remind_at: { type: string, example: "2026-10-02 00:00:00" }
        read: { type: boolean }
        read_at: { type: string, description: 未读时为 null }
        action_hint:
          type: string
          description: 按钮文案，如「去打卡」；无按钮时为 null
        action_target:
          type: string
          description: 按钮跳转的前端路由；无按钮时为 null
        pet_id: { type: integer, format: int64, description: 相关宠物；业务通知可能为空 }
        created_at: { type: string, example: "2026-09-27 08:00:00" }

    ReminderSetting:
      type: object
      required: [type, name, enabled]
      description: |
        **可关闭性按类型判定**（ADR-0019：「红色等级的健康提醒不可关闭」在类型粒度的落地）：
        承载红色风险的异常类 `closable=false`，其余为 true。前端把不可关闭的开关置灰并写明原因。
      properties:
        type: { type: integer }
        name: { type: string, example: "疫苗到期" }
        enabled:
          type: boolean
          description: 用户开关（未设置过时按默认开启返回）
        platform_enabled:
          type: boolean
          description: 平台级总开关（运营可关掉整类；关掉时用户也开不起来）
        closable:
          type: boolean
          description: 是否允许用户关闭。**红色等级的提醒为 false**，前端要把开关置灰并说明原因

    ReminderSettingInput:
      type: object
      required: [type, enabled]
      properties:
        type: { type: integer }
        enabled: { type: boolean }

    FilePresignRequest:
      type: object
      required: [biz_type, items]
      properties:
        biz_type:
          type: string
          description: 业务用途。收窄取值是为了让「照片挂在哪」可查
          enum: [checkin, epidemic, profile, ai_consult, care]
        pet_id:
          type: integer
          format: int64
          description: 关联宠物；证件类可以不挂
        items:
          type: array
          minItems: 1
          maxItems: 9
          items:
            type: object
            required: [mime]
            properties:
              mime:
                type: string
                description: 客户端声明的类型，**只用于提前拦截**；落库以魔数判定为准
                enum: [image/jpeg, image/png]
              size_bytes:
                type: integer
                format: int64
                description: 客户端声明的体积，同上
              role:
                type: string
                description: original 原图 / closeup 局部特写（视觉模型要看清局部时另传一张）
                enum: [original, closeup]
                default: original

    FilePresignView:
      type: object
      required: [file_id, upload_url, expires_at, max_bytes]
      properties:
        file_id: { type: integer, format: int64 }
        upload_url:
          type: string
          description: 直传地址（相对地址，含签名与有效期）。PUT 到这个地址送字节
          example: "/api/v1/open/files/12/content?token=up.1790600000.9f2c..."
        expires_at: { type: string, example: "2026-09-28 21:30:00" }
        max_bytes: { type: integer, format: int64, description: 单文件上限（字节）。前端可在选择阶段先拦一道 }
        role: { type: string }

    FileView:
      type: object
      required: [id, biz_type, role, mime, size_bytes]
      properties:
        id: { type: integer, format: int64 }
        pet_id: { type: integer, format: int64, nullable: true }
        biz_type: { type: string }
        role: { type: string, enum: [original, closeup, thumb] }
        mime: { type: string, enum: [image/jpeg, image/png] }
        size_bytes: { type: integer, format: int64 }
        width: { type: integer, nullable: true }
        height: { type: integer, nullable: true }
        url:
          type: string
          description: 原图的签名读地址（相对地址，有有效期）。文件私有，**前端不要缓存这个地址**
        thumb_url:
          type: string
          description: 缩略图签名读地址；缩略图生成失败时回落到原图地址

    AiConsultRequest:
      type: object
      required: [question]
      properties:
        question:
          type: string
          minLength: 2
          maxLength: 500
          description: 症状描述。**必填**——纯图片分诊不可用（61 号调研）
          example: "今天吐了两次，精神不太好"
        file_ids:
          type: array
          maxItems: 4
          description: 参与判断的图片（先经 /files 上传拿到的 file_id）
          items: { type: integer, format: int64 }

    AiConsultView:
      type: object
      required: [id, risk_level, need_hospital, degraded, disclaimer]
      properties:
        id: { type: integer, format: int64 }
        risk_level:
          type: integer
          description: 就医紧迫程度，**不是诊断**：1 绿（居家观察）/ 2 黄（尽快就医）/ 3 红（立即急诊）
          enum: [1, 2, 3]
        possible_causes: { type: array, items: { type: string } }
        action_suggestion: { type: string }
        need_hospital: { type: boolean }
        care_tips: { type: array, items: { type: string } }
        red_flag_hits:
          type: array
          description: 命中的红线规则编号。**非空表示这次没有经过模型**（ADR-0021）
          items: { type: string }
          example: ["RF-007"]
        degraded:
          type: boolean
          description: true 表示这是降级答复（AI 服务超时或不可用），不是模型结论
        degrade_reason: { type: string, nullable: true }
        model_version: { type: string }
        prompt_version: { type: string, description: 归因分级漂移要看它（ADR-0021） }
        latency_ms: { type: integer }
        disclaimer:
          type: string
          description: 免责声明。由后端给：医疗文案散落到前端各处时改起来一定会漏
        created_at: { type: string, example: "2026-09-28 21:30:00" }
        quota_per_day:
          type: integer
          description: 每日免费次数（交付文档 F006 的 3 次）。**本期只提示不拦截**（ADR-0024）
        remaining_today:
          type: integer
          description: |
            今日剩余次数。到 0 之后接口**照常返回结果**——解锁路径在 #112 权益引擎里，
            现在拦截会把用户挡在一扇没有出口的门后面

