[project]
name = "pet-health-ai"
version = "0.1.0"
description = "宠物 AI 健康管理平台 · AI 服务（分级 / 检索 / 提示词编排）"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "redis>=5.2",
    "pymysql>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
# 两个「要真模型」的标记，默认都不跑（需要 key 与网络）：
#   pytest -m live   —— 单次调用的端到端（有没有工具调用这一层）
#   pytest -m eval   —— 发布门槛：跑评测集算准确率与红色召回率，落报告（ADR-0021）
markers = [
    "live: 需要真实模型与网络的端到端测试",
    "eval: 发布门槛——真打模型跑评测集（准确率 ≥70%、红色召回 100%）",
]
addopts = "-m 'not live and not eval' -q"
