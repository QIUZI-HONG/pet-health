    put:
      tags: [points]
      summary: 修改行为分值
      description: |
        **只能改分值、频次与启停，不能新增行为**：行为码在代码里要有人发分、
        要有人触发，加一行数据只会产生一个永远不会发生的动作（ADR-0046 的决定）。
        新增行为是代码变更，不是配置变更。
      parameters:
        - $ref: "#/components/parameters/BehaviorCode"
