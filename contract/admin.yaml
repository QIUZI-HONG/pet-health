  # ---------------------------------------------------------------- AI 运营（切片 #103）

  /ai/prompts:
    get:
      tags: [ai]
      summary: 提示词版本列表（按版本号倒序）
      description: |
        正文一起给：运营要能看到自己改了什么。**改动要新增版本号，不要原地改**——
        留痕是靠 `prompt_version` 归因分级漂移的，同号覆盖会让归因失去对照物（ADR-0010）。

        `review_status` 是**人工复核**的产物（`pending_review` / `vetted`），
        这一层读得到但改不了：代码里给它开个后门等于假造复核状态（ADR-0040 第二节）。
      parameters:
        - name: code
          in: query
          description: 用途代码（如 triage）；省略则全部
          schema: { type: string, maxLength: 32 }
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/PromptTemplateView" }
    post:
      tags: [ai]
      summary: 新建一个提示词版本
      description: |
        **新建而不是覆盖**：同 (code, version) 已存在时 40900。`gray_ratio` 就是灰度开关，
        新版本先把比例设为 0 再逐步放量；出问题时改回 0 即是回滚，**不必发版**（ADR-0010）。

        新建的版本一律 `pending_review`、`enabled=true`（启用与否之后由 PUT 调）。
      parameters:
        - $ref: "./common.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PromptTemplateRequest" }
      responses:
        "200":
          description: 建好的版本
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/PromptTemplateView" }
        "400":
          description: 参数错误（40001）
        "409":
          description: 该 (code, version) 已存在（40900）

  /ai/prompts/{prompt_id}:
    put:
      tags: [ai]
      summary: 调整灰度比例与启停（回滚动作）
      description: |
        只改 `gray_ratio` / `enabled` / `remark`：**正文不能在这里改**，正文改动必须换版本号，
        理由同新建。这就是「一键回滚」的落点——把比例改回 0，不发版（ADR-0010）。
      parameters:
        - $ref: "#/components/parameters/PromptId"
        - $ref: "./common.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PromptTemplateUpdateRequest" }
      responses:
        "200":
          description: 更新后的版本
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/PromptTemplateView" }
        "400":
          description: 参数错误（40001）
        "404":
          description: 提示词版本不存在（40400）

  /ai/red-flags:
    get:
      tags: [ai]
      summary: 红线词分页列表
      description: |
        硬红线是安全网，运营要能一眼看全（#103）。命中红线的咨询**不经过模型**（ADR-0021）。

        `enabled` 与 `review_status` 是两件事：**「内容有没有被兽医复核」与「管线要不要用它」**
        ——词表首版全部 `pending_review` 但 `enabled`（ADR-0021）。

        分页口径：`total` 是**满足条件的总数**（不是这一页的条数），`has_more = page * page_size < total`。
        翻过最后一页时给空 `list` + 真实的 `total`——分页器靠它算总页数。
      parameters:
        - name: enabled
          in: query
          description: 启用状态过滤（true 启用 / false 停用）；省略则全部
          schema: { type: boolean }
        - $ref: "./common.yaml#/components/parameters/Page"
        - $ref: "./common.yaml#/components/parameters/PageSize"
      responses:
        "200":
          description: 成功（按规则编号升序）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "./common.yaml#/components/schemas/PageResult"
                          - type: object
                            properties:
                              list:
                                type: array
                                items: { $ref: "#/components/schemas/RedFlagView" }
    post:
      tags: [ai]
      summary: 新增一条红线
      description: 编号重复直接 40900——留痕引用编号，重复会让两次命中分不开。
      parameters:
        - $ref: "./common.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RedFlagRequest" }
      responses:
        "200":
          description: 新增的红线
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/RedFlagView" }
        "400":
          description: 参数错误（40001）
        "409":
          description: 规则编号已存在（40900）

  /ai/red-flags/{red_flag_id}:
    put:
      tags: [ai]
      summary: 修改一条红线
      parameters:
        - $ref: "#/components/parameters/RedFlagId"
        - $ref: "./common.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RedFlagRequest" }
      responses:
        "200":
          description: 修改后的红线
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/RedFlagView" }
        "400":
          description: 参数错误（40001）
        "404":
          description: 红线规则不存在（40400）
    delete:
      tags: [ai]
      summary: 停用（软删）一条红线
      description: |
        **不是物理删除**：留痕里引用过它的咨询仍要能查到当时的规则。
        删不存在的编号一律 40400（与「已经停用过了」对外是同一件事）。
      parameters:
        - $ref: "#/components/parameters/RedFlagId"
        - $ref: "./common.yaml#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: 已停用
        "404":
          description: 红线规则不存在（40400）

