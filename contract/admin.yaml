  /points/ladder-tiers:
    get:
      tags: [points]
      summary: 月度阶梯档位（F018）
      description: |
        **先落骨架**（ADR-0038 第四节）：每月 1 日的定时任务算上月累计积分 → 按档位发券。
        **年度大奖留白**（没有规则依据，不编）。

        种子里**一个档位都没有**：门槛值与奖励没有依据，不编造。档位为空时批算照跑、
        不发任何券（骨架是通的），运营配好档位后即生效。
      responses:
        "200":
