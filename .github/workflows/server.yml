name: Server

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "contract/**"
      - ".github/workflows/server.yml"
  pull_request:
    paths:
      - "server/**"
      - "contract/**"
      - ".github/workflows/server.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build
        working-directory: server
        run: ./mvnw -B -ntp verify
