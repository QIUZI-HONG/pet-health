        coupon_count: { type: integer, minimum: 1, maximum: 10 }
        sort_order: { type: integer }
        status: { type: integer, description: 1 启用 / 0 停用 }

    # ---------- AI 运营配置（切片 #103，决策见 ADR-0010 / ADR-0021 / ADR-0033 / ADR-0040）----------
    # 这四张表落在 `knowledge_*` 下，由 Python 侧带 TTL 缓存直读（ADR-0033 第三节）：
    # 所以这里写完**不需要重启任何进程**，代价是最多滞后一个 TTL（技术参数，默认 60 秒）。
    # 贯穿这一组的四条口径：
    #   - **版本号只能新增，不能原地改**：留痕按版本号归因分级漂移（ADR-0010）；
    #   - **`enabled` 与 `review_status` 分开**：内容有没有被兽医复核与管线要不要用它，是两件事；
    #   - **没有改 `review_status` 的接口**：复核是人工流程，代码里开个后门等于假造复核状态
    #     （ADR-0040 第二节）；
    #   - **`enabled` 读写都是 JSON boolean**（请求体、过滤参数、响应三处同一形状）：库里的列是
    #     tinyint（迁移与 Python 直读不动），转换在 Java 侧做；写 0/1 整数会被拒成 40001。
    #     `tool_schema` 是唯一的**只读**下发项：工具定义归代码常量那一层（ADR-0010）。

    PromptTemplateView:
      type: object
      description: 一个提示词版本（正文一起给：运营要能看到自己改了什么）
      properties:
        id: { type: integer, format: int64 }
        code: { type: string, description: 用途代码（当前只有 triage 一处） }
        version: { type: string, description: 版本号。**留痕按它归因分级漂移**（ADR-0010），改正文必须换号 }
        system_prompt: { type: string, description: 提示词正文 }
        tool_schema:
          type: string
          description: |
            工具定义（`report_triage` 的完整 JSON），与提示词同源——缺了模型不会按格式上报。
            **只读**：工具定义由代码约束（ADR-0010 的代码常量那一层），改动走发版；
            这里下发是为了让「当前生效的正文 + 它的工具定义」能一起被看见。库里的列 NOT NULL。
        gray_ratio:
          type: integer
          minimum: 0
          maximum: 100
          description: 灰度比例（0–100）。出问题把它改回 0 即是回滚，**不必发版**
        enabled: { type: boolean, description: 管线当前是否用它 }
        review_status:
          type: string
          description: 人工复核状态：pending_review / vetted。**接口不给改**（ADR-0040 第二节）
          enum: [pending_review, vetted]
        remark: { type: string, nullable: true }
        updated_by: { type: integer, format: int64, nullable: true, description: 最后一次改动的 operator_id（ADR-0011） }
        updated_at: { type: string }

    PromptTemplateRequest:
      type: object
      required: [code, version, system_prompt, tool_schema, gray_ratio]
      properties:
        code: { type: string, maxLength: 32, description: "用途代码（当前只有 triage 一处）。**必填**：留空报 40001" }
        version: { type: string, maxLength: 32, description: "**必须是新版本号**：同 (code, version) 已存在时 40900" }
        system_prompt: { type: string, description: 提示词正文 }
        tool_schema: { type: string, description: 工具定义。**与提示词同源**：缺了模型不会按格式上报 }
        gray_ratio: { type: integer, minimum: 0, maximum: 100, description: 灰度比例；新版本先设 0 再逐步放量 }
        remark: { type: string, maxLength: 256, nullable: true }

    PromptTemplateUpdateRequest:
      type: object
      required: [gray_ratio, enabled]
      properties:
        gray_ratio: { type: integer, minimum: 0, maximum: 100 }
        enabled: { type: boolean, description: true 启用 / false 停用；**读写同形状**（库里的列仍是 tinyint） }
        remark: { type: string, maxLength: 256, nullable: true, description: 传了才覆盖，不传保持原值 }

    RedFlagView:
      type: object
      description: 一条硬红线规则（命中即短路，不经过模型，ADR-0021）
      properties:
        id: { type: integer, format: int64 }
        code: { type: string, description: 规则编号（如 RF-007）。留痕引用它，所以不许重复 }
        pattern: { type: string, description: 主词 }
        variants:
          type: array
          description: 变体（同义说法）最多 20 条；可为空数组
          items: { type: string }
        species_scope: { type: string, description: 适用物种：dog / cat / all }
        age_stage_scope: { type: string, description: 适用年龄段：all / puppy_kitten / adult / senior }
        level:
          type: integer
          description: 命中后的风险等级（不低于 2）
          enum: [2, 3]
        action_hint: { type: string, description: 命中后的第一句话（它是用户看到的动作） }
        enabled: { type: boolean, description: 管线当前是否用它 }
        review_status:
          type: string
          description: 人工复核状态：pending_review / vetted。**接口不给改**（ADR-0040 第二节）
          enum: [pending_review, vetted]
        remark: { type: string, nullable: true }
        updated_at: { type: string }

    RedFlagRequest:
      type: object
      required: [code, pattern, level, action_hint, enabled]
      properties:
        code: { type: string, maxLength: 32, description: 规则编号；重复 40900 }
        pattern: { type: string, maxLength: 64, description: 主词 }
        variants:
          type: array
          nullable: true
          description: 变体（单条最长 64）最多 20 条
          items: { type: string }
        species_scope: { type: string, enum: [dog, cat, all], description: 省略按 all }
        age_stage_scope: { type: string, enum: [all, puppy_kitten, adult, senior], description: 省略按 all }
        level: { type: integer, minimum: 2, maximum: 3, description: 红线的等级不低于 2 }
        action_hint: { type: string, maxLength: 256, description: 命中后的第一句话，会直接给用户看 }
        enabled: { type: boolean, description: true 启用 / false 停用；**读写同形状**（库里的列仍是 tinyint） }
        remark: { type: string, maxLength: 256, nullable: true }

    GradingRuleView:
      type: object
      description: 一条分级规则（命中词 → 风险下限，**只抬不降**，ADR-0021）
      properties:
        id: { type: integer, format: int64 }
        code: { type: string, description: 规则编号；留痕引用它，所以不许重复 }
        name: { type: string }
        match_terms:
          type: array
          description: 命中词，1–20 条
          items: { type: string }
        min_level:
          type: integer
          description: 风险下限 1–3
          enum: [1, 2, 3]
        species_scope: { type: string, description: 适用物种：dog / cat / all }
        age_stage_scope: { type: string, description: 适用年龄段：all / puppy_kitten / adult / senior }
        advice: { type: string, nullable: true, description: 建议（会进用户的照护要点，**不许写药名与剂量**） }
        enabled: { type: boolean, description: 管线当前是否用它 }
        review_status:
          type: string
          description: 人工复核状态：pending_review / vetted。**接口不给改**（ADR-0040 第二节）
          enum: [pending_review, vetted]
        remark: { type: string, nullable: true }
        updated_at: { type: string }

    GradingRuleRequest:
      type: object
      required: [code, name, match_terms, min_level, enabled]
      properties:
        code: { type: string, maxLength: 32, description: 规则编号；重复 40900 }
        name: { type: string, maxLength: 64 }
        match_terms:
          type: array
          description: 命中词 1–20 条（单条最长 32）
          items: { type: string }
        min_level: { type: integer, minimum: 1, maximum: 3, description: 风险下限 }
        species_scope: { type: string, enum: [dog, cat, all], description: 省略按 all }
        age_stage_scope: { type: string, enum: [all, puppy_kitten, adult, senior], description: 省略按 all }
        advice: { type: string, maxLength: 256, nullable: true, description: 建议文案，**不许写药名与剂量** }
        enabled: { type: boolean, description: true 启用 / false 停用；**读写同形状**（库里的列仍是 tinyint） }
        remark: { type: string, maxLength: 256, nullable: true }

    GuardTermView:
      type: object
      description: 一个护栏词（输出侧过滤依据）
      properties:
        id: { type: integer, format: int64 }
        kind: { type: string, description: drug 药名 / phrase 越界表述（诊断、剂量、处方）, enum: [drug, phrase] }
        term: { type: string, description: 词条 }
        note: { type: string, nullable: true, description: 说明（为什么加它） }
        enabled: { type: boolean, description: 管线当前是否用它 }
        review_status:
          type: string
          description: 人工复核状态：pending_review / vetted。**接口不给改**（ADR-0040 第二节）
          enum: [pending_review, vetted]
        updated_at: { type: string }

    GuardTermRequest:
      type: object
      required: [kind, term, enabled]
      properties:
        kind: { type: string, enum: [drug, phrase], description: drug（药名）/ phrase（越界表述） }
        term: { type: string, maxLength: 64, description: 词条；同类同词重复 40900 }
        note: { type: string, maxLength: 256, nullable: true }
        enabled: { type: boolean, description: true 启用 / false 停用；**读写同形状**（库里的列仍是 tinyint） }

    SwitchView:
      type: object
      description: 一个运行时开关（**语义在代码里**，库里只存当前状态，ADR-0010）
      properties:
        id: { type: integer, format: int64 }
        code: { type: string, description: 开关编码（代码里的常量，如 force_rule_only） }
        enabled: { type: boolean }
        remark: { type: string, nullable: true, description: 这个开关是什么意思（给运营看的说明） }
        updated_at: { type: string }

    SwitchUpdateRequest:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean, description: true 打开 / false 关闭；**读写同形状**（库里的列仍是 tinyint） }

    ConsultAuditView:
      type: object
      description: |
        一次咨询的抽检视图（ADR-0033 第四节记的那些留痕列）。
        **不含问题原文**：`ai_consult.question_enc` 是字段级加密的病历口径（ADR-0013），
        解密给运营看属权限与合规问题、还没定（ADR-0033 的待澄清）——先把结构化事实给出来，
        够做「按 prompt_version 抽样看分级分布」这件事。
      properties:
        id: { type: integer, format: int64 }
        pet_id: { type: integer, format: int64 }
        risk_level: { type: integer, description: 就医紧迫程度：1 绿 / 2 黄 / 3 红, enum: [1, 2, 3] }
        degraded: { type: boolean, description: true 表示这次是降级答复（模型超时 / 不可用 / 输出不可用） }
        degrade_reason: { type: string, nullable: true, description: 机器可读的降级原因码与上游明细（只在留痕里，不下发给用户） }
        red_flag_hits:
          type: array
          description: 命中的红线规则编号；**非空表示这次没有经过模型**（ADR-0021）
          items: { type: string }
        guard_hits:
          type: array
          description: |
            输出护栏与配置读取的留痕标记。三类前缀各自可读：
            `dose` / `phrase:xxx` / `drug:xxx`（模型输出或运营文案越界，ADR-0021 第四条）、
            `kb:flag:<条目>:<原因>`（检索到的条目被安全门剔除或被护栏清洗）、
            `citation:<编号>`（编造 / 无效引用被剔除）。

            **`switch:<开关码>:unreadable` 是 ADR-0050 §三 的落点**：运营配置里某个运行时开关
            **读不到**（库不可达）时由 AI 服务写入这个标记——「开关读不到」与「开关确实为关」
            是两件事，前者是故障、要有人告警，后者是运营的意图。开关确实为关时**不带这个标记**。
          items: { type: string }
        citations:
          type: array
          description: 真被引用的知识条目编号。**只含 vetted**——召回集 ≠ 引用集（ADR-0033 第四节）
          items: { type: string }
        unvetted_hits:
          type: array
          description: 用到的**未复核**条目编号。抽检时最该看的就是这些（它们没有兽医背书）
          items: { type: string }
        retrieval_check: { type: string, nullable: true, description: 检索自检结果（ok / empty / skipped / unavailable / disabled…）；`empty` 是召回缺口的观测口，`unavailable` 与 `disabled` 是故障与人为关闭之分（ADR-0033 第二节 / ADR-0050 第三节） }
        ops_config_check: { type: string, nullable: true, description: "运营可调项这一批（提示词 / 分级规则 / 护栏词表 / 运行时开关）读到了没有：ok / unavailable。**它是可观测的事实，不是降级**——unavailable 时那一项回落到代码基线、咨询照常（ADR-0050 第三节 / ADR-0010 的分层）。**（需要协调：AI 服务侧已产出该字段，Java 侧的落库与映射尚未接线，见 ADR-0052 的「需要协调」）**" }
        model_name: { type: string, nullable: true }
        model_version: { type: string, nullable: true }
        prompt_version: { type: string, nullable: true, description: 按它归因分级漂移（ADR-0010） }
        latency_ms: { type: integer }
        created_at: { type: string }

    ConsultStats:
      type: object
      description: |
        AI 咨询的**只读统计**（`AiConsultStatsApi.ConsultStats`）——**不是 HTTP 响应体**：
        健康报告（#115）经这个 ph-api 接口取两个数，而不去 join ph-ai 的表（ADR-0006；
        「开第二个例外」只有 ADR-0009 那一条）。它是**跨模块接口的形状**，
        在这里立条目是为了让「schema 名 ↔ DTO 类名」保持一一对应。
      properties:
        total: { type: integer, description: 窗口内的咨询次数（含红线短路与降级——那也花掉了一次用户动作） }
        red_count: { type: integer, description: 其中判为红色的次数（risk_level=3，含红线规则判的红） }

    # ------------------------------------------------------------------ 内容审核（切片 #84 / F020）

    ContentReviewItemView:
      type: object
      description: |
        审核队列里的一行。三种社区内容（卡片 / 提问 / 回答）共用这个形状——
        审核要的是「谁、什么时候、发了什么、现在什么状态」，三种内容在这四件事上同构，
        各写一张视图只会让运营切换三个页面看同一件事。

        `title` 只有卡片与提问有，回答为空；`content` 一律给**全文**（不是摘要）：
        审核必须看到完整原文，截断的审核等于没审。
      properties:
        content_type: { type: integer, description: 1 经验卡片 / 2 提问 / 3 回答 }
        content_type_name: { type: string, description: 内容类型中文名（经验卡片 / 提问 / 回答） }
        content_id: { type: integer, format: int64 }
        author_id: { type: integer, format: int64, description: 作者 id（**只在这一端出现**：审核是运营的动作，要能追溯；C 端的卡片视图恒匿名） }
        title: { type: string, nullable: true, description: 标题；回答没有标题，为空 }
        content: { type: string, description: 正文全文 }
        question_id: { type: integer, format: int64, nullable: true, description: 回答所属的提问 id；卡片与提问为空 }
        status: { type: integer, description: 0 待审 / 1 已发布 / 2 已驳回或已下架 }
        status_name: { type: string }
        reject_reason: { type: string, nullable: true, description: 被驳回 / 下架的理由（运营填的原文）；没被驳回时为空 }
        machine_hits: { type: string, nullable: true, description: 机审命中的敏感词（逗号分隔）；未命中或人工处置时为空 }
        created_at: { type: string }

    SensitiveWordView:
      type: object
      description: 机审词表里的一条。命中判定是**包含匹配**（不做正则、不做分词），运营要能肉眼预测拦截结果。
      properties:
        id: { type: integer, format: int64 }
        word: { type: string }
        category: { type: string, nullable: true, description: 分类标签（给运营自己看的：广告 / 引流 / 违规…），不参与判定 }
        enabled: { type: boolean, description: 是否参与机审；停用不删——留着它才能解释「昨天为什么拦了那条内容」 }
        remark: { type: string, nullable: true, description: 为什么拦这个词 }
        updated_at: { type: string }

    SensitiveWordRequest:
      type: object
      required: [word]
      properties:
        word: { type: string, minLength: 1, maxLength: 64, description: 词条（当前平台的词都是中文短语，按**包含**匹配；大小写不敏感） }
        category: { type: string, maxLength: 32, nullable: true, description: 分类标签（不参与判定） }
        enabled: { type: boolean, nullable: true, description: 是否启用；不传按启用处理 }
        remark: { type: string, maxLength: 255, nullable: true, description: 给运营看的说明：为什么拦这个词 }

    # ------------------------------------------------------------------ 服务者月度考核（F022）
    #
    # AssessmentSummaryView / AssessmentItemView / AssessmentOverrideView / AssessmentView 四张
    # 与 provider.yaml 的同名 schema **共用同一份后端 DTO**
    # （`com.pethealth.api.provider.AssessmentDtos`）：同一个对象在两端只是可见范围不同。
    # 契约文件之间不互相 $ref（只有 common.yaml 是共享的），所以这里各写一遍、字段逐项一致。

    AssessmentSummaryView:
      type: object
      description: 一个账期的考核结果（列表行）。明细见 `AssessmentView`
      properties:
        id: { type: integer, format: int64 }
        provider_id: { type: integer, format: int64, description: 服务者 id；**只在运营侧有值**（服务者看自己的列表不需要它） }
        provider_name: { type: string, nullable: true, description: 门店名称；**只在运营侧有值** }
        period: { type: string, description: 考核账期（yyyy-MM）；每月 1 日算上月（ADR-0039 第三节） }
        total_score: { type: string, description: 总分（0.00–100.00 的两位小数字符串）。**分数是字符串不是浮点**（ADR-0011 的精度纪律） }
        level: { type: integer, description: 1 基础 / 2 优选 / 3 战略合作（分档阈值在本后台配置） }
        level_name: { type: string, description: 等级中文名（基础 / 优选 / 战略合作），由服务端给出 }
        recommend_priority: { type: integer, description: "AI 推荐优先级：1 最高 / 2 较高 / 3 普通。**只存映射结果，不改推荐逻辑**（那属别的切片）" }
        participated_weight: { type: integer, description: 参与计分的权重合计（100 = 三项全参与；缺项按 ADR-0050 第四节重算后会小于 100） }
        overridden: { type: boolean, description: 本期是否有单项分被超级管理员覆盖（留痕在明细的 `overrides` 里） }
        calculated_at: { type: string, description: 计算时间（yyyy-MM-dd HH:mm:ss，东八区） }

    AssessmentItemView:
      type: object
      description: |
        一项考核明细。**三项主项**的 `item_code` 是 INVITE（拉新）/ COUPON（券）/ PROCESS（过程）；
        过程分的五个子项挂在 PROCESS 下（`parent_code` = PROCESS）：
        PROCESS_RESPONSE（接单响应）/ PROCESS_REDEEM_RATE（核销率）/ PROCESS_REPORT_RATE（报工完整率）/
        PROCESS_REVIEW（评价分）/ PROCESS_CANCEL_RATE（服务者取消率）。

        **未参与（`participated=false`）的项照样下发**：它们是「这个分为什么是这么算出来的」的答案，
        藏起来就只剩一个说不清的总分（ADR-0050 第四节点名要「明细里注明未参与」）。
      properties:
        item_code: { type: string, description: 项目编码（见上面的枚举） }
        item_name: { type: string, description: 中文名，由服务端给出 }
        parent_code: { type: string, nullable: true, description: 父项：过程子项为 PROCESS；三项主项为空 }
        weight: { type: integer, description: 该项在主项层级的权重（百分比）；过程子项为空（子项之间等权，ADR-0039 第二节） }
        participated: { type: boolean, description: 是否参与计分。false = 平台侧无该维度要求（ADR-0050 第四节），权重按参与项重算 }
        score: { type: string, nullable: true, description: 当前生效得分（0.00–100.00 的两位小数字符串）；未参与时为空 }
        calculated_score: { type: string, nullable: true, description: 算法算出来的原始得分；没被覆盖时与 `score` 相同（被覆盖后仍保留在它上面） }
        raw_value: { type: string, nullable: true, description: 原始指标值（人话，如「有效邀请 3 人」「完成率 0.60 × 核销 8 张」）；未参与时为空 }
        target_value: { type: string, nullable: true, description: 该项当时的达标线快照（规则改了不影响已算出的历史） }
        data_source: { type: string, description: 数据来源（如「ph-order 订单统计」）；未参与时这里写清是哪条事实缺了 }
        note: { type: string, nullable: true, description: 说明：未参与的原因 / 覆盖说明 / 已实现的降级说明 }
        overridden: { type: boolean, description: 该项是否被超级管理员覆盖过 }

    AssessmentOverrideView:
      type: object
      description: 单项分覆盖的留痕（append-only）。**谁、何时、改成多少、为什么都留**
      properties:
        id: { type: integer, format: int64 }
        item_code: { type: string }
        item_name: { type: string }
        before_score: { type: string, nullable: true, description: 覆盖前的生效值（两位小数字符串；覆盖前未参与时为空） }
        after_score: { type: string, description: 覆盖后的生效值 }
        reason: { type: string, description: 覆盖理由（必填，服务者可见——否则算法是黑箱、无法申诉） }
        operator_id: { type: integer, format: int64, description: 操作者（超级管理员）的账号 id }
        created_at: { type: string }

    AssessmentView:
      type: object
      description: |
        一个账期的考核全貌。服务者侧看自己的，运营侧看全平台的（`provider_id` / `provider_name`
        **只在运营侧有值**——与 `CouponContributionView.provider_name` 同一口径）。
      properties:
        id: { type: integer, format: int64 }
        provider_id: { type: integer, format: int64 }
        provider_name: { type: string, nullable: true }
        period: { type: string }
        total_score: { type: string }
        level: { type: integer }
        level_name: { type: string }
        recommend_priority: { type: integer }
        participated_weight: { type: integer }
        overridden: { type: boolean }
        calculated_at: { type: string }
        items:
          type: array
          description: 三项主项 + 过程子项（未参与的也在）
          items: { $ref: "#/components/schemas/AssessmentItemView" }
        overrides:
          type: array
          description: 覆盖留痕（按时间正序）；没被覆盖过时为空数组
          items: { $ref: "#/components/schemas/AssessmentOverrideView" }

    AssessmentLevelRuleView:
      type: object
      description: 一个等级的档位（基础 / 优选 / 战略合作）。**阈值与优先级可改，等级本身不可增删**
      properties:
        level: { type: integer, description: 1 基础 / 2 优选 / 3 战略合作 }
        level_name: { type: string, description: 等级中文名，由服务端给出 }
        min_score: { type: string, description: 进入这一档的最低总分（两位小数字符串，闭区间） }
        recommend_priority: { type: integer, description: "AI 推荐优先级：1 最高 / 2 较高 / 3 普通。**只有映射结果会被写进考核记录与 `provider.level`，推荐逻辑本身不在本切片**" }
        updated_at: { type: string }

    AssessmentRuleView:
      type: object
      description: 考核规则（权重 + 三项达标线 + 三档阈值）
      properties:
        invite_weight: { type: integer, description: 拉新项权重（默认 40） }
        coupon_weight: { type: integer, description: 券项权重（默认 40） }
        process_weight: { type: integer, description: 过程项权重（默认 20） }
        invite_target: { type: integer, description: 拉新达标线（有效邀请数）；**0 = 未配置 → 该项不参与**（ADR-0050 第四节） }
        coupon_target: { type: string, description: 券达标线（完成率 × 核销数，ADR-0039 第三节的口径）；"0.00" = 未配置 → 该项不参与 }
        response_minutes_target: { type: integer, description: 接单响应时长的达标线（分钟）：不超过它记满分，超过按比例扣 }
        levels:
          type: array
          description: 三个档位（基础 / 优选 / 战略合作），按 level 升序
          items: { $ref: "#/components/schemas/AssessmentLevelRuleView" }
        updated_at: { type: string }

    AssessmentLevelRuleRequest:
      type: object
      required: [level, min_score, recommend_priority]
      properties:
        level: { type: integer, description: 1 基础 / 2 优选 / 3 战略合作 }
        min_score: { type: string, description: 进入这一档的最低总分（两位小数字符串） }
        recommend_priority: { type: integer, description: 1 最高 / 2 较高 / 3 普通 }

    AssessmentRuleRequest:
      type: object
      description: |
        整体覆盖考核规则。**改了只影响之后算出的账期**——历史账期存的是当时的快照。
      required: [invite_weight, coupon_weight, process_weight, invite_target, coupon_target,
                 response_minutes_target, levels]
      properties:
        invite_weight: { type: integer, description: 拉新项权重（百分比） }
        coupon_weight: { type: integer, description: 券项权重（百分比） }
        process_weight: { type: integer, description: 过程项权重（百分比）；**三项之和必须为 100**（否则 40001） }
        invite_target: { type: integer, description: 拉新达标线（有效邀请数）；0 = 未配置 → 该项不参与 }
        coupon_target: { type: string, description: 券达标线（完成率 × 核销数）；"0.00" = 未配置 → 该项不参与 }
        response_minutes_target: { type: integer, description: 接单响应时长的达标线（分钟，正整数） }
        levels:
          type: array
          description: 三个档位，必须**恰好三档**（1/2/3 各一条）且 `min_score` 严格递增、基础档为 0.00
          items: { $ref: "#/components/schemas/AssessmentLevelRuleRequest" }

    AssessmentOverrideRequest:
      type: object
      description: |
        覆盖单项分。**只能覆盖三项主项**（INVITE / COUPON / PROCESS）——过程子项是过程分的构成
        而不是考核的单项，覆盖它们等于绕过算法。理由必填且会随明细下发给服务者。
      required: [item_code, score, reason]
      properties:
        item_code: { type: string, description: 三项主项之一：INVITE / COUPON / PROCESS }
        score: { type: string, description: 覆盖后的得分（0.00–100.00 的两位小数字符串） }
        reason: { type: string, minLength: 1, maxLength: 255, description: 覆盖理由（必填，服务者可见） }
