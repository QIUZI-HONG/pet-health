# 运营后台接口契约 —— 路由前缀 /api/v1/admin/**
#
# 消费方：运营后台（桌面 Web，独立登录域）。公共组件见 common.yaml。
#
# 状态：**标准目录维护（#104）、服务者入驻审核（#78 / #104）、服务上架审核（#105）、
# 目录外服务提案审核（F012）、券池与平台补贴券（#110）、权益码表与授予（#112）、
# 邀请与积分运营配置（#111 / #113）、AI 运营配置（#103）、内容审核（#84 / F020）、
# 服务者月度考核（F022）已定义**。
# 仍未定义：全平台看板（#118）、订单干预（#77）。
#
# 四条贯穿全篇的约定：
#   - **鉴权**：Token 的登录域必须是 admin（ADR-0012）。服务者后台的接口在 provider.yaml。
#   - **资源不存在一律 40400**，不返回 40300（免得用 id 探测存在性）。
#   - **权限细分尚未落地**：交付文档 2.2 把「审核商家/服务」给平台运营（文档用词），ADR-0037 把「清退」
#     与「目录项删除」给超级管理员，但运营与超管在 token 里还没有区分（后台账号与角色体系未实现）。
#     本切片对所有 admin 域身份一视同仁，待办与取舍写在 ADR-0035 的「需要协调」。
#     **券池的模板与平台补贴券、权益码表、积分规则在 ADR-0037 里也是运营/超管的日常动作**，
#     同样等角色体系落地后收紧。
#     **考核规则配置与单项分覆盖是例外**：ADR-0037 把这两件事明确划给超级管理员，所以它们
#     多一道超管门禁（`app.assessment.super-admin-user-ids` 名单，未配置时**谁都不能改**）——
#     这是角色体系落地前唯一能钉住这条口径的做法，取舍与收紧计划见 ADR-0052 的「需要协调」。
#   - **禁止资金**：券与积分都不产生任何资金流 / 结算 / 打款（ADR-0036）。
#     券的「成本归属」只回答抵扣算谁头上，进核销统计与考核。
#
# 与 provider.yaml 同名的 schema（ServiceCategoryView / ServiceItemView / ProviderProfileView /
# OnboardingApplicationSummary / OnboardingApplicationView / ReviewLogView / ProviderServiceView /
# ReviewApproveRequest / ReviewRejectRequest 等）**共用同一份后端 DTO**：
# 这里是各端契约生成物的固有重复，不是两处定义。

openapi: 3.1.0

info:
  title: 宠物 AI 健康管理平台 · 运营后台接口
  version: 0.2.0
  description: |
    路由前缀 `/api/v1/admin/**`。公共组件见 `common.yaml`。

    与本端相对的另一个登录域是服务者后台（`provider.yaml`）：同一个 Token 在两边都不通用。

servers:
  - url: /api/v1/admin

tags:
  - name: catalog
    description: 标准目录维护（分类 / 项目 / 价格区间）与目录外服务提案审核
  - name: provider-review
    description: 服务者入驻审核与服务者经营状态处置
  - name: service-review
    description: 服务上架审核
  - name: coupon
    description: 券池：券模板维护、券池总览、平台补贴券的发放（切片 #110，决策见 ADR-0037 / ADR-0044）
  - name: rights
    description: 权益码表与授予记录（切片 #112，决策见 ADR-0038 第三节 / ADR-0045）
  - name: invite
    description: 邀请关系、阶梯档位与反作弊记录（切片 #111，决策见 ADR-0039 第一节 / ADR-0046）
  - name: points
    description: 积分规则、任务清单、兑换档位与月度阶梯档位（切片 #113，决策见 ADR-0038 第四节 / ADR-0046）
  - name: ai
    description: |
      AI 运营：提示词版本与灰度、红线词、分级规则、护栏词表、降级开关、调用留痕抽检
      （切片 #103）。改完**不重启任何进程**：Python 侧带 TTL 缓存直读这几张表（ADR-0010）。
  - name: content-review
    description: |
      内容审核：社区内容队列（通过 / 驳回 / 下架）与敏感词表（切片 #84 / F020）。
      **内容审核归运营**（ADR-0037 第一节的权限矩阵），社区内容一律先进待审（ADR-0041 第一节）。

      这里的「护栏词」与 AI 侧的 `knowledge_guard_term` **不是一回事**：那张表管的是模型**输出**
      里的药名与越界表述（ADR-0021），这张表管的是**用户发进来的内容**。两者只是恰好都叫「词表」
      （CONTEXT.md 的硬红线条目已注明：敏感词属内容审核域，与红线词无关）。
  - name: assessment
    description: |
      服务者月度考核（F022）：考核规则（权重与分档阈值）、全平台考核列表与明细、单项分覆盖。
      算法见 ADR-0039 第三节（总分 = 拉新 40% + 券 40% + 过程 20%，每月 1 日算上月）与
      ADR-0050 第四节（缺项两种口径），本切片的实现决策见 ADR-0052。

      **规则配置与覆盖只归超级管理员**（ADR-0037 第一节的矩阵）：角色体系尚未落地，
      本切片用「登录域 + 超管名单」把这一条钉住（未配置名单时 fail-closed），
      收紧计划写在 ADR-0052 的「需要协调」。

security:
  - bearerAuth: []

paths:
  # ---- 登录（ADR-0012 的三个登录域；账号是同一批，准入按域判）----
  # 这三条**不需要登录**（登录当然不能在登录之后）：JwtAuthenticationFilter 的 PUBLIC_PATHS 里。
  # 请求/响应的形状复用 app.yaml 的 LoginRequest / RefreshRequest / LogoutRequest / TokenPair——
  # 后台与 C 端用的是同一批账号（ADR-0035 决定 4：「绑定现有账号 id」），凭据形状是同一个东西，
  # 再定义一份只会让两侧漂移。
  /auth/login:
    post:
      tags: [auth]
      summary: 运营后台登录
      description: |
        手机号 + 密码，与 C 端同一批账号。**准入另判**：账号必须在运营账号名单里
        （`app.console.admin-user-ids`，**fail-closed**——名单为空则谁都进不去），否则 40300。
        名单为空时谁都进不去，而不是谁都能进：运营后台看得到全平台数据，
        默认开放等于把门禁的钥匙挂在门上（与考核超管名单 ADR-0052 同一条取舍）。

        40300 而不是 40100 是刻意的：回 40100 会让用户以为密码错了反复重试，
        而登录限流会因此把账号锁住。40300 只发生在**口令校验通过之后**，不泄露未认证信息。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "./app.yaml#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: 登录成功；`data` 里的令牌登录域是 admin
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "./app.yaml#/components/schemas/TokenPair" }
        "401": { description: 手机号或口令不正确（40100） }
        "403": { description: 账号被禁用、或该账号不是运营后台账号（40300） }
        "429": { description: 尝试过于频繁（42900） }

  /auth/refresh:
    post:
      tags: [auth]
      summary: 换发令牌（admin 域）
      description: |
        与 C 端同一条规则：Refresh 一次性使用，旧的在换发时作废（ADR-0012）。
        **旧 Refresh 的登录域必须也是 admin**——拿 C 端或服务者后台的 Refresh 打这里换不到
        admin 域令牌，否则「三个登录域互不通用」就只剩一句话。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "./app.yaml#/components/schemas/RefreshRequest" }
      responses:
        "200":
          description: 新的一对令牌
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "./app.yaml#/components/schemas/TokenPair" }
        "401": { description: Refresh 过期、已作废、或登录域不匹配（40101 / 40100） }

  /auth/logout:
    post:
      tags: [auth]
      summary: 退出（吊销 Refresh）
      description: 已签发的 Access 在剩余有效期（≤2 小时）内仍有效，这是不引黑名单的必然代价（ADR-0012）。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "./app.yaml#/components/schemas/LogoutRequest" }
      responses:
        "200": { description: 已退出（重复调用同样返回成功） }

  /catalog/categories:
    get:
      tags: [catalog]
      summary: 分类列表
      description: 运营要能看见自己停用过的分类，所以**默认连停用的一起给**。
      parameters:
        - name: include_disabled
          in: query
          description: 是否包含停用分类，默认 true
          schema: { type: boolean, default: true }
      responses:
        "200":
          description: 成功（按 sort_order 升序）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/ServiceCategoryView" }
    post:
      tags: [catalog]
      summary: 新建分类
      description: |
        `item_code_prefix` 是该项目编码的前两位（HE / GR / TR / BD / SP / IN）：
        项目编码一旦发布不可改、不可复用，所以前缀与分类绑定，建分类时一次给对。
      parameters:
        - $ref: "./common.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServiceCategoryRequest" }
      responses:
        "200":
          description: 建好的分类
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ServiceCategoryView" }
        "400":
          description: 参数错误（40001）
        "409":
          description: 分类编码或编码前缀已被占用（40900）

  /catalog/categories/{category_id}:
    put:
      tags: [catalog]
      summary: 修改分类（改名 / 排序 / 说明）
      description: |
        分类编码与编码前缀**不可变更**（已有项目与将来的券适用范围都引用它们），
        传了别的值一律 40001——不是静默忽略。
      parameters:
        - $ref: "#/components/parameters/CategoryId"
        - $ref: "./common.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServiceCategoryRequest" }
      responses:
        "200":
          description: 更新后的分类
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ServiceCategoryView" }
        "400":
          description: 试图改编码或前缀（40001）
        "404":
          description: 分类不存在（40400）

  /catalog/items:
    get:
      tags: [catalog]
      summary: 目录项分页（含停用项）
      parameters:
        - name: category_code
          in: query
          schema: { type: string, maxLength: 32 }
        - name: keyword
          in: query
          description: 按项目名称模糊匹配，最长 64 字符
          schema: { type: string, maxLength: 64 }
        - name: status
          in: query
          description: 1 启用 / 0 停用；不传表示全部
          schema: { type: integer, minimum: 0, maximum: 1 }
        - $ref: "./common.yaml#/components/parameters/Page"
        - $ref: "./common.yaml#/components/parameters/PageSize"
      responses:
        "200":
          description: 成功（按 sort_order 升序）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "./common.yaml#/components/schemas/PageResult"
                          - type: object
                            properties:
                              list:
                                type: array
                                items: { $ref: "#/components/schemas/ServiceItemView" }
    post:
      tags: [catalog]
      summary: 新建目录项（含价格区间）
      description: |
        区间是服务平台侧的数据：**非负、最多两位小数、下限 ≤ 上限**，写反了在入口就被拦住
        （否则会在某个服务者定价时以「越界」的形式暴露，那时已分不清是区间错还是价格错）。
      parameters:
        - $ref: "./common.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServiceItemRequest" }
      responses:
        "200":
          description: 建好的目录项
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ServiceItemView" }
        "400":
          description: 区间非法 / 分类不存在或已停用（40001）
        "409":
          description: 目录项编码已存在（40900，编码不可复用）

  /catalog/items/{item_id}:
    put:
      tags: [catalog]
      summary: 修改目录项
      description: |
        编码与所属分类**不可变更**（编码的前两位就是分类前缀，换分类必然要换码，而编码不可改）。

        **收窄区间不会自动下架**服务者已上架的服务项——自动下架会打断已预约的订单，
        而本项目没有推送通道去通知用户；存量服务项会在下一次改价或重审时按新区间收敛
        （ADR-0034 的代价一节）。
      parameters:
        - $ref: "#/components/parameters/ItemId"
        - $ref: "./common.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServiceItemRequest" }
      responses:
        "200":
          description: 更新后的目录项
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ServiceItemView" }
        "400":
          description: 试图改编码或分类 / 区间非法（40001）
        "404":
          description: 目录项不存在（40400）

  /catalog/items/{item_id}/status:
    put:
      tags: [catalog]
      summary: 启用 / 停用目录项
      description: |
        停用（0）**只挡住新的选品**：已上架的服务项保持原状、照常对外，不自动下架（理由同上）。
        目录项不做物理删除——编码不可复用，删行会让历史订单项失去定义。

        ADR-0037 把「目录项删除」划给超级管理员；本接口是状态变更（下架语义），
        角色细分待后台账号体系落地（见 ADR-0035「需要协调」）。
      parameters:
        - $ref: "#/components/parameters/ItemId"
        - $ref: "./common.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServiceItemStatusRequest" }
      responses:
        "200":
          description: 更新后的目录项
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ServiceItemView" }
        "404":
          description: 目录项不存在（40400）

  /ai/human-consults:
    get:
      tags: [ai]
      summary: 转人工工单队列（待处理优先，同状态按提交时间升序）
      description: |
        运营的待办：谁在等回复、等了多久。`status` 不传表示全部；默认按 `status` 升序
        （0 待处理在前）再按提交时间升序——**先到先处理**，免得早提交的用户一直排在后面。

        `user_id` / `pet_id` 给的是 id，不含手机号等身份信息：需要联系用户时按 id 到用户管理里查
        （那一条链路有它自己的脱敏与审计口径，不在这一页复制一份）。
      parameters:
        - name: status
          in: query
          description: 0 待处理 / 1 已回复 / 2 已关闭；不传表示全部
          schema: { type: integer, minimum: 0, maximum: 2 }
        - $ref: "./common.yaml#/components/parameters/Page"
        - $ref: "./common.yaml#/components/parameters/PageSize"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "./common.yaml#/components/schemas/PageResult"
                          - type: object
                            properties:
                              list:
                                type: array
                                items: { $ref: "#/components/schemas/HumanConsultAdminView" }

  /ai/human-consults/{ticket_id}:
    parameters:
      - name: ticket_id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    put:
      tags: [ai]
      summary: 处置一条工单（回复 / 关闭）
      description: |
        `status=1`（已回复）时 `reply_note` **必填**：那句话会作为一条站内消息发给用户
        （工单本身不存回复正文——同一条回复有两个副本迟早会不一致）。
        回复后用户收到「人工回复」消息，文案就是 `reply_note`。

        `status=2`（已关闭）用于「问清了、不需要回复」的情形（例如用户已到店），不必写回复。

        已经是终态（1 或 2）的工单不能再改：处理结果是一次性的，重开要新建。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HumanConsultStatusRequest" }
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/HumanConsultAdminView" }
        "400":
          description: 状态非法，或已回复时未填回复内容（40001）
        "404":
          description: 工单不存在（40400）
        "409":
          description: 已处置过（40900）

  /catalog/symptom-rules:
    parameters:
      - $ref: "./common.yaml#/components/parameters/Page"
      - $ref: "./common.yaml#/components/parameters/PageSize"
    get:
      tags: [catalog]
      summary: 症状映射列表（F011 规则版的推荐依据）
      description: |
        「症状 → 推荐目录项」的映射（`catalog_symptom_rule`）：C 端 F011 的推荐就用它。
        **症状词必须是知识侧的规范名**（呕吐 / 腹泻 / 食欲下降 / …）——用户口语（「拉稀」）
        由 AI 侧的受控词典先归一再到这里，所以这一层不认口语词，也不维护第二份口语表。

        列表按症状名与 `sort_order` 升序：同一症状下 `sort_order` 越小越先展示（首条是主推）。
      parameters:
        - name: symptom_keyword
          in: query
          description: 按症状规范名精确筛选；不传表示全部
          schema: { type: string, maxLength: 64 }
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "./common.yaml#/components/schemas/PageResult"
                          - type: object
                            properties:
                              list:
                                type: array
                                items: { $ref: "#/components/schemas/SymptomRuleView" }
    post:
      tags: [catalog]
      summary: 新增一条症状映射
      description: |
        `symptom_keyword` 用**规范名**（与 `knowledge_node.name` 同一套词），`item_code` 必须是
        存在且启用中的目录项——指向不存在/停用的项目会在推荐时被跳过（日志里能看到），
        所以这里直接拒绝比让它躺着更有用。

        同一（症状，项目）只允许一条（唯一键），重复提交回 40900。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SymptomRuleRequest" }
      responses:
        "200":
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/SymptomRuleView" }
        "400":
          description: 参数错误（40001）：症状名为空、项目编码不存在或已停用
        "409":
          description: 该（症状，项目）的映射已存在（40900）

  /catalog/symptom-rules/{rule_id}:
    parameters:
      - name: rule_id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    put:
      tags: [catalog]
      summary: 改一条症状映射（顺序 / 项目 / 启停）
      description: |
        改的是**映射本身**，不动知识侧的词表：症状名要与知识库一致，改名等于换一个症状。
        想停止推荐用 `enabled=0`（停用），不要删——删了就看不出「这条以前配过」。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SymptomRuleRequest" }
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/SymptomRuleView" }
        "404":
          description: 映射不存在（40400）
  /catalog/item-requests:
    get:
      tags: [catalog]
      summary: 目录外服务提案队列（默认只给待审核）
      parameters:
        - name: status
          in: query
          description: 0 待审核 / 1 通过 / 2 驳回，默认 0
          schema: { type: integer, minimum: 0, maximum: 2, default: 0 }
        - $ref: "./common.yaml#/components/parameters/Page"
        - $ref: "./common.yaml#/components/parameters/PageSize"
      responses:
        "200":
          description: 成功（先到先审）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "./common.yaml#/components/schemas/PageResult"
                          - type: object
                            properties:
                              list:
                                type: array
                                items: { $ref: "#/components/schemas/CatalogItemProposalSummary" }

  /catalog/item-requests/{request_id}:
    get:
      tags: [catalog]
      summary: 提案详情（含审核流水）
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/CatalogItemProposalView" }
        "404":
          description: 提案不存在（40400）

  /catalog/item-requests/{request_id}/approve:
    post:
      tags: [catalog]
      summary: 通过提案（平台上新项目）
      description: |
        **最终区间必填**，不默认采纳服务者的建议值：区间是平台的规则（F010），
        让申请方定义规则等于让区间校验自己批自己。运营可以把建议值抄过来，
        但那是他的显式动作。

        `code` 可以不传（按分类前缀排下一个序号，如 `HE-014`）；传了就必须与分类前缀一致
        且未被占用——编码不可复用，重号只能报错。

        通过后平台上多了一个正式目录项，服务者随后就能在自己店里勾选并定价。
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "./common.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CatalogItemProposalApproveRequest" }
      responses:
        "200":
          description: 提案状态与生成的编码
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/CatalogItemProposalView" }
        "400":
          description: 最终区间非法 / 编码与分类前缀不符（40001）
        "404":
          description: 提案不存在（40400）
        "409":
          description: 提案不在待审核状态 / 编码已被占用（40900）

  /catalog/item-requests/{request_id}/reject:
    post:
      tags: [catalog]
      summary: 驳回提案
      description: 驳回原因必填，原样展示给服务者。
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "./common.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewRejectRequest" }
      responses:
        "200":
          description: 提案状态
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/CatalogItemProposalView" }
        "404":
          description: 提案不存在（40400）
        "409":
          description: 提案不在待审核状态（40900）

  /provider-applications:
    get:
      tags: [provider-review]
      summary: 入驻审核队列（默认只给待审核）
      description: 先到先审（按提交时间升序）。**单人审核**——本切片不做初审 + 复审双人流程。
      parameters:
        - name: status
          in: query
          description: 0 待审核 / 1 通过 / 2 驳回，默认 0
          schema: { type: integer, minimum: 0, maximum: 2, default: 0 }
        - $ref: "./common.yaml#/components/parameters/Page"
        - $ref: "./common.yaml#/components/parameters/PageSize"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "./common.yaml#/components/schemas/PageResult"
                          - type: object
                            properties:
                              list:
                                type: array
                                items: { $ref: "#/components/schemas/OnboardingApplicationSummary" }

  /provider-applications/{application_id}:
    get:
      tags: [provider-review]
      summary: 申请详情（含资质材料与审核流水）
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/OnboardingApplicationView" }
        "404":
          description: 申请不存在（40400）

  /provider-applications/{application_id}/approve:
    post:
      tags: [provider-review]
      summary: 审核通过
      description: |
        通过时一并做三件事：服务者转为「正常」、资质材料转为「通过」、
        **申请人绑定为该服务者的管理员**（技师是管理员的权限子集，兼任时共用一条绑定记录）。
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
        - $ref: "./common.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewApproveRequest" }
      responses:
        "200":
          description: 申请状态
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/OnboardingApplicationView" }
        "404":
          description: 申请不存在（40400）
        "409":
          description: 申请不在待审核状态（40900）

  /provider-applications/{application_id}/reject:
    post:
      tags: [provider-review]
      summary: 审核驳回
      description: 原因必填，会原样展示给服务者（用户故事 62：他要能「知道卡在哪」）。
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
        - $ref: "./common.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewRejectRequest" }
      responses:
        "200":
          description: 申请状态
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/OnboardingApplicationView" }
        "404":
          description: 申请不存在（40400）
        "409":
          description: 申请不在待审核状态（40900）

  /providers:
    get:
      tags: [provider-review]
      summary: 服务者列表
      description: |
        **关键字只搜名称**：联系电话是密文（ADR-0013），模糊搜索在字段级加密下做不到，
        要按电话找人得先有服务者 id。这不是偷懒，是密文没有保序性的必然结果。
      parameters:
        - name: status
          in: query
          description: 0 待审核 / 1 正常 / 2 驳回 / 3 冻结
          schema: { type: integer, minimum: 0, maximum: 3 }
        - name: type
          in: query
          description: 1 医院 / 2 洗护 / 3 训犬 / 4 寄养上门 / 5 食品用品 / 6 间接服务
          schema: { type: integer, minimum: 1, maximum: 6 }
        - name: keyword
          in: query
          schema: { type: string, maxLength: 64 }
        - $ref: "./common.yaml#/components/parameters/Page"
        - $ref: "./common.yaml#/components/parameters/PageSize"
      responses:
        "200":
          description: 成功（按创建时间倒序）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "./common.yaml#/components/schemas/PageResult"
                          - type: object
                            properties:
                              list:
                                type: array
                                items: { $ref: "#/components/schemas/ProviderProfileView" }

  /providers/{provider_id}:
    get:
      tags: [provider-review]
      summary: 服务者详情
      parameters:
        - $ref: "#/components/parameters/ProviderId"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ProviderProfileView" }
        "404":
          description: 服务者不存在（40400）

  /providers/{provider_id}/status:
    put:
      tags: [provider-review]
      summary: 冻结 / 解冻服务者
      description: |
        **冻结就是清退的落点**：清退 = 冻结接单（禁止新订单与新上架）+ 保留历史订单与档案
        + 已预约订单转「取消」（不是退款——平台不经手资金，ADR-0036 已定，退款退化为线下动作）。

        本接口只覆盖「禁止新上架」这一半：已上架的服务项不自动下架（冻结与下架是两个动作，
        焊死会让解冻时也恢复不了原状），C 端浏览与下单必须按服务者状态过滤——那属于订单侧，
        接口留白见 ADR-0035。「已预约订单转取消」也归订单模块（#77）。

        被驳回（2）的服务者**不能从这里恢复为正常**：那条路必须重新提交申请并审核通过，
        否则一次驳回就等于白拒（「被驳回的记录不占唯一性名额」这条规则也建立在它之上）。

        权限口径：ADR-0037 把清退划给超级管理员，而角色尚未落地，见 ADR-0035「需要协调」。
      parameters:
        - $ref: "#/components/parameters/ProviderId"
        - $ref: "./common.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProviderStatusRequest" }
      responses:
        "200":
          description: 服务者状态
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ProviderProfileView" }
        "400":
          description: 状态不是 1 或 3（40001）
        "404":
          description: 服务者不存在（40400）
        "409":
          description: 已冻结 / 不在冻结状态 / 被驳回的服务者不能这样恢复（40900）

  /service-listings:
    get:
      tags: [service-review]
      summary: 服务上架审核队列（默认只给待审核）
      description: |
        每一行都带着**目录侧的名称与当前区间**（现取，不是快照）——
        「这个价是不是还在区间内」不需要打开另一个页面去对。
      parameters:
        - name: status
          in: query
          description: 0 待审核 / 1 已上架 / 2 已下架 / 3 已驳回，默认 0
          schema: { type: integer, minimum: 0, maximum: 3, default: 0 }
        - name: provider_id
          in: query
          description: 只看某个服务者的（按服务者处置时用）
          schema: { type: integer, format: int64 }
        - $ref: "./common.yaml#/components/parameters/Page"
        - $ref: "./common.yaml#/components/parameters/PageSize"
      responses:
        "200":
          description: 成功（先到先审）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "./common.yaml#/components/schemas/PageResult"
                          - type: object
                            properties:
                              list:
                                type: array
                                items: { $ref: "#/components/schemas/ProviderServiceView" }

  /service-listings/{service_id}/approve:
    post:
      tags: [service-review]
      summary: 上架审核通过
      description: |
        **通过即上架**：服务者提交审核的意图就是上架（交付文档 7.2 的 `merchant_service.status` 是文档用词，本项目叫 `provider_service.status`
        默认值也是「上架」）。之后服务者可以自己下架、再上架（价格没变就不需要重审）。
      parameters:
        - $ref: "#/components/parameters/ServiceId"
        - $ref: "./common.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewApproveRequest" }
      responses:
        "200":
          description: 服务项状态
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ProviderServiceView" }
        "404":
          description: 服务项不存在（40400）
        "409":
          description: 服务项不在待审核状态（40900）

  /service-listings/{service_id}/reject:
    post:
      tags: [service-review]
      summary: 上架审核驳回
      description: 原因必填，会展示给服务者；改价后可重新提交审核。
      parameters:
        - $ref: "#/components/parameters/ServiceId"
        - $ref: "./common.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewRejectRequest" }
      responses:
        "200":
          description: 服务项状态
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ProviderServiceView" }
        "404":
          description: 服务项不存在（40400）
        "409":
          description: 服务项不在待审核状态（40900）

  /coupon-templates:
    get:
      tags: [coupon]
      summary: 券模板分页（含停用）
      description: |
        运营要能看见自己停用过的模板，所以**默认连停用的一起给**。
        `cost_bearer = 2`（平台补贴）的模板就是「平台补贴券」的定义——它的配置少了
        服务者贡献那一段额度账，但多了发放上限（`issue_limit`）。
      parameters:
        - name: status
          in: query
          description: 1 启用 / 0 停用；不传表示全部
          schema: { type: integer, minimum: 0, maximum: 1 }
        - name: cost_bearer
          in: query
          description: 1 服务者成本 / 2 平台补贴；不传表示全部
          schema: { type: integer, minimum: 1, maximum: 2 }
        - name: keyword
          in: query
          description: 按券名模糊匹配，最长 64 字符
          schema: { type: string, maxLength: 64 }
        - $ref: "./common.yaml#/components/parameters/Page"
        - $ref: "./common.yaml#/components/parameters/PageSize"
      responses:
        "200":
          description: 成功（按更新时间倒序）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "./common.yaml#/components/schemas/PageResult"
                          - type: object
                            properties:
                              list:
                                type: array
                                items: { $ref: "#/components/schemas/CouponTemplateView" }
    post:
      tags: [coupon]
      summary: 新建券模板
      description: |
        **券模板只能由平台创建**（ADR-0037 第三节）：统一券池是这个机制的核心卖点，
        放开自建等于没有券池。服务者侧只能「选券并承诺额度」。

        三条写入口就拦住的事：
        - `scope_type = 1 / 2` 时 `scope_codes` 必须能在**标准目录**里找到（分类编码或目录项编码），
          找不到 → 40001。券的适用范围与标准目录编码挂钩，写错了要到核销时才会暴露；
        - `scope_type = 0` 时不允许带 `scope_codes`；
        - `issue_limit` 只对平台补贴券有意义，服务者成本券传了会被忽略（**不报错**：
          额度由服务者的贡献决定，两套额度混在一起会让「还能发多少」有两个答案）。
      parameters:
        - $ref: "./common.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CouponTemplateRequest" }
      responses:
        "200":
          description: 建好的模板
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/CouponTemplateView" }
        "400":
          description: 参数错误 / 适用范围在标准目录里不存在（40001）
        "409":
          description: 模板编码已存在（40900，编码不可复用）

  /coupon-templates/{template_id}:
    put:
      tags: [coupon]
      summary: 修改券模板
      description: |
        编码与成本归属**不可变更**：编码挂在已有的券实例与适用范围上；成本归属一旦有人
        按它贡献过额度，改了就改了考核的归属（直接 40001，不静默忽略）。

        改面额 / 门槛 / 有效期**只影响之后新发的券**：已经发到用户手里的券是平台对用户的
        承诺，模板改动不能改写它（券实例存的是发放时的快照）。
      parameters:
        - $ref: "#/components/parameters/TemplateId"
        - $ref: "./common.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CouponTemplateRequest" }
      responses:
        "200":
          description: 更新后的模板
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/CouponTemplateView" }
        "400":
          description: 试图改编码或成本归属 / 适用范围不合法（40001）
        "404":
          description: 模板不存在（40400）

  /coupon-templates/{template_id}/status:
    put:
      tags: [coupon]
      summary: 上架 / 下架券模板
      description: |
        停用（0）**只挡住新的发放与新的贡献**：已发出的券照常可核销（用户手上的券不是
        运营可撤销的承诺），服务者已承诺的额度账也留着——存量清干净了再停，是运营的事。

        模板不做物理删除：券实例引用着它，删行会让历史券失去定义。
      parameters:
        - $ref: "#/components/parameters/TemplateId"
        - $ref: "./common.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CouponTemplateStatusRequest" }
      responses:
        "200":
          description: 更新后的模板
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/CouponTemplateView" }
        "404":
          description: 模板不存在（40400）

  /coupon-pool/overview:
    get:
      tags: [coupon]
      summary: 券池总览（含对账口径）
      description: |
        券池的一句话账：模板几个、服务者承诺了多少额度、发出去多少张、核销了多少、还剩多少在
        用户手里、多少已过期作废。

        `reconciliation` 是 ADR-0037 第三节的对账口径：
        **实例数 = 已发放 = 已核销 + 未过期未核销 + 已过期未核销**，`balanced` 为 false 即不平。
        本项目没有资金可对（ADR-0036），这张表就是「券的对账」。

        `by_source` 按券的来源（邀请 / 打卡 / 积分兑换 / 平台补贴 / 月度阶梯）拆开——
        「补贴花了多少」与「任务发出去多少」是两笔不同的账。
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/CouponPoolOverviewView" }

  /coupons:
    get:
      tags: [coupon]
      summary: 券实例分页（运营查询与排查）
      parameters:
        - name: template_id
          in: query
          schema: { type: integer, format: int64 }
        - name: source
          in: query
          description: 1 邀请 / 2 打卡任务 / 3 积分兑换 / 4 平台补贴 / 5 月度阶梯
          schema: { type: integer, minimum: 1, maximum: 5 }
        - name: status
          in: query
          description: 1 待使用 / 2 已锁定 / 3 已核销 / 4 已过期
          schema: { type: integer, minimum: 1, maximum: 4 }
        - name: user_id
          in: query
          schema: { type: integer, format: int64 }
        - name: provider_id
          in: query
          description: 只看某个服务者的贡献券
          schema: { type: integer, format: int64 }
        - $ref: "./common.yaml#/components/parameters/Page"
        - $ref: "./common.yaml#/components/parameters/PageSize"
      responses:
        "200":
          description: 成功（按发放时间倒序）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "./common.yaml#/components/schemas/PageResult"
                          - type: object
                            properties:
                              list:
                                type: array
                                items: { $ref: "#/components/schemas/CouponView" }
    post:
      tags: [coupon]
      summary: 定向发放平台补贴券
      description: |
        **只发平台补贴券**（`cost_bearer = 2`）：服务者成本的券走的是服务者的贡献额度，
        平台不能替服务者放券（那样等于平台替服务者承诺）。传了服务者成本券 → 40900。

        这是「平台补贴」这一来源的真实产出路径（另有积分兑换、邀请、打卡任务三条，
        它们由各自的动作触发）。**不做抢券**：发放全部定向（ADR-0037 第三节）。

        模板停用、平台补贴券的发放在 `issue_limit` 之上、模板有效期为空等情况一律拒绝；
        同一用户对同一模板是否限领一张**尚未定**（见 ADR-0044 的待澄清），本期不限领——
        重复发放是运营看得见的动作，不做隐式去重。
      parameters:
        - $ref: "./common.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IssueCouponRequest" }
      responses:
        "200":
          description: 已发放
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/CouponView" }
        "404":
          description: 模板不存在或已停用（40400）
        "409":
          description: |
            不是平台补贴券 / 已超过发放上限 / 缺少发放额度（40900）。
            服务者成本券的额度耗尽也走这个码，message 里说明还剩多少

  /rights/codes:
    get:
      tags: [rights]
      summary: 权益码表（含停用）
      description: |
        交付文档里权益是「无限 AI 问答 / 完整报告 / 社区发帖 / 额外额度」四项，
        ADR-0038 把它们的载体定成**权益码**（`ai.unlimited` / `report.full` /
        `community.post` / `quota.ai.bonus`），运营可以加码。

        **`care.mode` 不是权益码**：专项照护模式按医学事实自动开启（ADR-0032），
        挂成权益会出现「够条件但权益不足，于是看不到专项入口」的自相矛盾（ADR-0038 第三节）。
      responses:
        "200":
          description: 成功（按 sort_order 升序）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/RightsCodeView" }
    post:
      tags: [rights]
      summary: 新增权益码（运营可扩）
      description: |
        新码只定义「有这么一项能力」，**判定逻辑仍要在代码里实现**：
        码表能扩，能力不能凭空长出来——所以新增的码在判定侧默认不生效，
        直到有模块按它写判定。这条落在 ADR-0045 的决定里，别指望加一行数据就多一项能力。
      parameters:
        - $ref: "./common.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RightsCodeRequest" }
      responses:
        "200":
          description: 建好的权益码
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/RightsCodeView" }
        "400":
          description: 编码格式不对（小写字母、点、数字，如 ai.unlimited）（40001）
        "409":
          description: 该权益码已存在（40900）

  /rights/codes/{code}:
    put:
      tags: [rights]
      summary: 修改权益码（改名 / 说明 / 排序 / 启停）
      description: 编码本身不可改（授予记录与各模块的判定都引用它）。停用只是不再允许**新授予**，
        已有的授予记录照常生效——停用一个码不该让用户手里的权益消失。
      parameters:
        - $ref: "#/components/parameters/RightsCode"
        - $ref: "./common.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RightsCodeRequest" }
      responses:
        "200":
          description: 更新后的权益码
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/RightsCodeView" }
        "404":
          description: 权益码不存在（40400）

  /rights/grants:
    get:
      tags: [rights]
      summary: 授予记录分页
      parameters:
        - name: user_id
          in: query
          schema: { type: integer, format: int64 }
        - name: code
          in: query
          schema: { type: string }
        - name: status
          in: query
          description: 1 生效 / 2 已回收（过期回收到此状态）
          schema: { type: integer, minimum: 1, maximum: 2 }
        - $ref: "./common.yaml#/components/parameters/Page"
        - $ref: "./common.yaml#/components/parameters/PageSize"
      responses:
        "200":
          description: 成功（按授予时间倒序）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "./common.yaml#/components/schemas/PageResult"
                          - type: object
                            properties:
                              list:
                                type: array
                                items: { $ref: "#/components/schemas/RightsGrantView" }
    post:
      tags: [rights]
      summary: 手动授予一条权益
      description: |
        **每条来源各写一条授予**（ADR-0038 第三节）：一个用户同时有「邀请得的永久」与
        「订阅得的月度」时是两条记录，不合并、不覆盖——合并之后「订阅到期要不要回收」
        就分不清是哪一条了。

        来源（`source`）：1 订阅 / 2 邀请 / 3 打卡 / 4 运营补偿。手动授予的典型用途正是
        **订阅**（ADR-0036 之后订阅没有支付载体，只能线下签约 + 后台标记）；
        运营补偿是第四个口子，用于客诉处理，理由必填并进备注。

        `expire_at` 为空表示**永久**（邀请得的权益就是这样）；打卡来源在授予时由系统按
        「当月有效」算出到期日，手动授予时请显式给 `expire_at`。
      parameters:
        - $ref: "./common.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RightsGrantRequest" }
      responses:
        "200":
          description: 已授予
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/RightsGrantView" }
        "400":
          description: 参数错误 / 到期时间早于当前（40001）
        "404":
          description: 权益码不存在（40400）
        "409":
          description: 同一来源的同一引用已授予过（40900，幂等键是来源 + 来源引用 + 码）

  /rights/grants/{grant_id}:
    delete:
      tags: [rights]
      summary: 回收一条授予
      description: |
        **只回收这一条**：订阅到期不触碰邀请得的永久权益（ADR-0038 第三节）。
        回收后该用户在这个码上回落到次高优先级的来源；一条都没有时该码即不生效。

        顶层资源，**重复回收 / 删别人的一律 40400**（docs/conventions.md 的删除口径）——
        这条记录不存在就是不存在，与「已经回收过了」对外是同一件事。
      parameters:
        - $ref: "#/components/parameters/GrantId"
        - $ref: "./common.yaml#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: 已回收
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/RightsGrantView" }
        "404":
          description: 授予记录不存在或已被回收（40400）

  /rights/users/{user_id}:
    get:
      tags: [rights]
      summary: 某用户的权益判定（每个码：是否生效 + 来源 + 到期）
      description: |
        这是权益引擎**唯一的口径出口**（ADR-0038 第三节）：`rights(userId) → {码: {生效, 来源, 到期}}`。
        C 端展示、AI 额度判定、社区发帖判定都读这一份，不各自查表拼规则。

        判定是**实时**的（不缓存）：来源优先级 订阅 > 邀请永久 > 打卡当月，
        取生效的授予里优先级最高的那一条；**不按到期时间比较**——
        「邀请得永久 + 订阅得月度」这种情况下按到期比会把语义算错。

        `effective = false` 的码也会列出来（带 `name`），
        否则运营看到的是「这个用户什么都没有」，而真相是「有码但当前不生效」。
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/RightsEvaluationView" }

  /invites/overview:
    get:
      tags: [invite]
      summary: 邀请总览（含阶梯达成）
      description: |
        **归因时点是注册那一刻**（ADR-0039 第一节）：链接带 `?invite=CODE` 只做预填，
        以用户填的码为准，**不做事后补填**（补填是刷券的入口）。

        `valid_rate` 是**有效邀请转化率**（有效 ÷ 注册），它替换了交付文档的「K 因子 > 1」——
        三个端改成 Web 之后没有小程序的社交转发链，K 因子这个指标不成立（ADR-0039）。
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/InviteOverviewView" }

  /invites/relations:
    get:
      tags: [invite]
      summary: 邀请关系分页
      parameters:
        - name: inviter_user_id
          in: query
          schema: { type: integer, format: int64 }
        - name: invitee_user_id
          in: query
          schema: { type: integer, format: int64 }
        - name: status
          in: query
          description: 1 待生效 / 2 有效 / 3 无效
          schema: { type: integer, minimum: 1, maximum: 3 }
        - $ref: "./common.yaml#/components/parameters/Page"
        - $ref: "./common.yaml#/components/parameters/PageSize"
      responses:
        "200":
          description: 成功（按注册时间倒序）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "./common.yaml#/components/schemas/PageResult"
                          - type: object
                            properties:
                              list:
                                type: array
                                items: { $ref: "#/components/schemas/InviteRelationView" }

  /invites/ladder-tiers:
    get:
      tags: [invite]
      summary: 邀请阶梯档位（1 / 3 / 5 / 10 / 15）
      description: |
        档位门槛是 ADR-0039 定的固定五档，运营能改的是**每档发什么**：
        `reward_type = 1` 发券（指定券模板）、`= 2` 授予权益（指定权益码，永久）。
        奖励物未配置的档位**照样记录达成**，只是不发东西——「谁在哪一档」是数据，
        「发什么」是配置，两件事分开才不至于改配置时丢历史。
      responses:
        "200":
          description: 成功（按门槛升序）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/InviteLadderTierView" }

  /invites/ladder-tiers/{threshold}:
    put:
      tags: [invite]
      summary: 配置某一档的奖励
      description: |
        门槛不可改（改门槛等于重新定义阶梯），只改奖励物与启停。
        `reward_type = 1` 时必须给 `coupon_template_id`（券模板须启用）；`= 2` 时必须给
        `rights_code`（权益码须存在）。奖励**只在达成时发一次**（达成记录唯一），
        改配置不会补发历史档位——补发是一次显式的运营动作，不该藏在配置里。
      parameters:
        - $ref: "#/components/parameters/Threshold"
        - $ref: "./common.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InviteLadderTierRequest" }
      responses:
        "200":
          description: 更新后的档位
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/InviteLadderTierView" }
        "400":
          description: 参数错误（奖励物缺失 / 模板或权益码不可用）（40001）
        "404":
          description: 该档位不存在（40400）

  /invites/risk-records:
    get:
      tags: [invite]
      summary: 反作弊拦截记录
      description: |
        三层判据（ADR-0039 第一节）命中即记一条，被拦下的邀请关系状态为「无效」且**不计数、不发奖**：
        `SELF_INVITE`（自邀自）、`SAME_DEVICE`（同设备）、`SAME_IP_SEGMENT`（同 IP + 同号段）、
        `NO_ACTIVITY_24H`（被邀请人 24 小时内无行为）。
        前三条在归因与结算时判，最后一条由结算批算判——**判据是数据，不是日志**，
        运营要能按判据查出「是哪一类刷量」。
      parameters:
        - name: rule
          in: query
          description: SELF_INVITE / SAME_DEVICE / SAME_IP_SEGMENT / NO_ACTIVITY_24H
          schema: { type: string, maxLength: 32 }
        - $ref: "./common.yaml#/components/parameters/Page"
        - $ref: "./common.yaml#/components/parameters/PageSize"
      responses:
        "200":
          description: 成功（按记录时间倒序）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "./common.yaml#/components/schemas/PageResult"
                          - type: object
                            properties:
                              list:
                                type: array
                                items: { $ref: "#/components/schemas/InviteRiskRecordView" }

  /points/overview:
    get:
      tags: [points]
      summary: 积分总览
      description: |
        积分是**另一套账**（与权益并列，ADR-0038 第四节）：这里只有分值与余额，
        没有现金、不能提现、不能兑换钱（CONTEXT.md 的积分条目）。

        `today_earned` / `today_awarded_users` 用来盯**每日上限 20 分**的实际命中情况——
        上限是被刷的重点，运营要看得见今天发了多少。
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/PointsOverviewView" }

  /points/records:
    get:
      tags: [points]
      summary: 积分流水（含变动后余额）
      description: |
        每条流水都带 `balance_after`（变动后余额）：只记变动数的话，
        事后永远无法从流水重建当时的余额，客诉时对不上账。
      parameters:
        - name: user_id
          in: query
          schema: { type: integer, format: int64 }
        - name: behavior_code
          in: query
          description: SIGN_IN / CHECK_IN / INVITE / REVIEW / PROFILE_COMPLETE / AI_ADVICE / SHARE
          schema: { type: string, maxLength: 32 }
        - $ref: "./common.yaml#/components/parameters/Page"
        - $ref: "./common.yaml#/components/parameters/PageSize"
      responses:
        "200":
          description: 成功（按时间倒序）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "./common.yaml#/components/schemas/PageResult"
                          - type: object
                            properties:
                              list:
                                type: array
                                items: { $ref: "#/components/schemas/PointRecordView" }

  /points/settings:
    get:
      tags: [points]
      summary: 积分规则设置（每日获取上限）
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/PointsSettingsView" }
    put:
      tags: [points]
      summary: 修改积分规则设置
      description: |
        每日获取上限（默认 20 分）是业务可调项，进库 + 运营后台（ADR-0010 的三层配置）。
        **邀请与一次性项不占这个上限**（ADR-0038 第四节：否则 20 分的邀请奖励会被日上限吃掉），
        它们由行为自身的 `counts_toward_daily_cap` 决定。
      parameters:
        - $ref: "./common.yaml#/components/parameters/IdempotencyKey"
      requestBody:
