            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/SwitchView" }

  /ai/switches/{switch_code}:
    put:
      tags: [ai]
      summary: 切一个开关（一键降级）
      description: |
        **只允许改已存在的 code**：新增一个没有人读的开关会让运营以为它生效了，
        那是比没有开关更糟的状态——闸门这种东西，必须由代码先认它（ADR-0010）。
      parameters:
        - $ref: "#/components/parameters/SwitchCode"
        - $ref: "./common.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SwitchUpdateRequest" }
      responses:
        "200":
          description: 切换后的开关
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/SwitchView" }
        "400":
          description: 参数错误（40001）
        "404":
          description: 开关不存在，或这个 code 代码里没人读（40400）

  /ai/consults:
    get:
      tags: [ai]
      summary: 调用留痕抽检（按 prompt_version 归因分级漂移）
      description: |
        典型用法是「改了提示词之后，按新版本抽 20 条看分级分布有没有漂」——
        所以过滤条件就是 `prompt_version`（可再按风险等级 / 是否降级收窄）。

        **不下发问题原文**：`ai_consult.question_enc` 是字段级加密的病历口径（ADR-0013），
        解密给运营看属于权限与合规问题，还没定（ADR-0033 的待澄清）。
        留痕里的结构化事实足够回答「分级有没有漂、有没有降级、用了未复核条目没有」。
      parameters:
        - name: prompt_version
          in: query
          description: 按提示词版本归因（改完提示词抽新版本）
          schema: { type: string, maxLength: 32 }
        - name: risk_level
          in: query
          description: 就医紧迫程度过滤（1 绿 / 2 黄 / 3 红）
          schema: { type: integer, minimum: 1, maximum: 3 }
        - name: degraded
          in: query
          description: 是否只看降级答复
          schema: { type: boolean }
        - $ref: "./common.yaml#/components/parameters/Page"
        - $ref: "./common.yaml#/components/parameters/PageSize"
      responses:
        "200":
          description: 成功（按咨询时间倒序）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "./common.yaml#/components/schemas/PageResult"
                          - type: object
                            properties:
                              list:
                                type: array
                                items: { $ref: "#/components/schemas/ConsultAuditView" }

  # ---------- 内容审核（切片 #84 / F020；决策见 ADR-0037 第一节 / ADR-0041 第一节）----------
  /community/contents:
    get:
      tags: [content-review]
      summary: 内容审核队列（**按类型分别看**，默认只给待审）
      description: |
        三种内容共用一个形状、但**按类型分别查**（`content_type` 必填）：经验卡片 / 提问 / 回答
        各住一张表，合并成一条跨表的 UNION 只会把「总条数」变成三次 COUNT 的和、
        把排序变成跨表归并，换来的只是省一次点击——而运营的界面本来就是按类型分页签的。

        社区内容一律先进待审，只有运营通过（`status=1`）之后才对其他用户可见；
        机审命中敏感词的内容会直接落在**已驳回**（`status=2`），运营可以改判为通过——
        词表误伤是常态，而「误伤了一个真实用户的内容且没人能改」比漏放一条更伤。

        队列带 `author_id`：审核是**运营**的动作，要能追溯是谁发的（ADR-0037 第一节）。
        这一条只在这一端成立：C 端的卡片视图恒匿名，审核后台不是「匿名」的例外，
        而是另一个域（运营有处置权，也就必须看得见对象）。

        `mine` 之类的相对字段这里没有——审核队列不关心「谁在看」。
      parameters:
        - name: content_type
          in: query
          required: true
          description: 内容类型：1 卡片 / 2 提问 / 3 回答
          schema: { type: integer, minimum: 1, maximum: 3 }
        - name: status
          in: query
          description: 0 待审 / 1 已发布 / 2 已驳回（含已下架）；默认 0
          schema: { type: integer, minimum: 0, maximum: 2, default: 0 }
        - name: author_id
          in: query
          description: 只看某个用户发的（处置一个刷屏账号时用）
          schema: { type: integer, format: int64 }
        - $ref: "./common.yaml#/components/parameters/Page"
        - $ref: "./common.yaml#/components/parameters/PageSize"
      responses:
        "200":
          description: 成功（先到先审）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "./common.yaml#/components/schemas/PageResult"
                          - type: object
                            properties:
                              list:
                                type: array
                                items: { $ref: "#/components/schemas/ContentReviewItemView" }

  /community/contents/{content_type}/{content_id}/approve:
    parameters:
      - $ref: "#/components/parameters/ContentType"
      - $ref: "#/components/parameters/ContentId"
    post:
      tags: [content-review]
      summary: 审核通过（待审 / 被机审驳回 → 已发布）
      description: |
        通过之后内容立刻对其他用户可见（`status=1`）。**没有请求体**：通过时没有要对作者说的话
        （内容只是出现了），硬塞一个「备注」字段而无处可存，就是让调用方以为它会被记录。
        谁通过的、什么时候通过的在 `reviewed_by` / `reviewed_at` 与审计日志里；
        被改判的机审命中词留在 `machine_hits` 里，那是这次改判的依据，不随改判清空。

        运营的处置是**放行 / 拦住 / 下架**，不是替用户改内容（改内容等于平台替用户表态），
        所以没有「编辑内容」的接口。
      parameters:
        - $ref: "./common.yaml#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: 通过后的内容
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ContentReviewItemView" }
        "404":
          description: 内容不存在（40400）
        "409":
          description: 内容已经是已发布状态（40900，非法迁移不是参数错误）

  /community/contents/{content_type}/{content_id}/reject:
    parameters:
      - $ref: "#/components/parameters/ContentType"
      - $ref: "#/components/parameters/ContentId"
    post:
      tags: [content-review]
      summary: 驳回 / 下架（理由必填）
      description: |
        两个动作合一个入口，因为它们是**同一个状态迁移**（→ `status=2`）：待审内容被驳回、
        已发布内容被下架，对用户的效果一样——都不再出现。

        理由**必填**且会原样出现在**作者自己的**那份内容里（C 端 `mine=true` 的 `reject_reason`）：
        只说「违规」而不说违什么，作者只会换个说法再发一遍。

        已经是驳回状态的再驳回 → **40900**（非法迁移，ADR-0038 第一节的口径），
        不是静默成功：这样「谁的处置生效了」才看得见。回答被从已发布打到驳回时，
        所属提问的 `answer_count` 会跟着减——它数的是已过审的回答。
      parameters:
        - $ref: "./common.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewRejectRequest" }
      responses:
        "200":
          description: 驳回 / 下架后的内容
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ContentReviewItemView" }
        "400":
          description: 参数错误（40001）：理由缺失
        "404":
          description: 内容不存在（40400）
        "409":
          description: 内容已经是驳回状态（40900，非法迁移不是参数错误）

  /community/sensitive-words:
    get:
      tags: [content-review]
      summary: 敏感词表（含停用）
      description: |
        机审词表，**在库里维护**（ADR-0010 的业务可调项分层：词表是可运营调整的，不写死在代码里；
        改完即时生效，不用重启）。运营要能看见自己停用过的词，所以默认连停用的一起给。
      parameters:
        - name: enabled
          in: query
          description: 只看启用 / 停用；不传表示全部
          schema: { type: boolean }
        - name: keyword
          in: query
          description: 按词模糊匹配，最长 64 字符
          schema: { type: string, maxLength: 64 }
        - $ref: "./common.yaml#/components/parameters/Page"
        - $ref: "./common.yaml#/components/parameters/PageSize"
      responses:
        "200":
          description: 成功（按 id 倒序：新加的词在最上面）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "./common.yaml#/components/schemas/PageResult"
                          - type: object
                            properties:
                              list:
                                type: array
                                items: { $ref: "#/components/schemas/SensitiveWordView" }
    post:
      tags: [content-review]
      summary: 新增敏感词
      description: |
        词表同样**归运营**（ADR-0037 第一节的「内容审核」）。同一句词重复添加 → 40900
        （唯一键也是这个口径）。命中的判定是**包含匹配**（不做正则、不做分词）：
        运营能用肉眼预测「这句话为什么被拦」，是词表能不能被信任的前提。
      parameters:
        - $ref: "./common.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SensitiveWordRequest" }
      responses:
        "200":
          description: 新增的词条
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/SensitiveWordView" }
        "400":
          description: 参数错误（40001）
        "409":
          description: 该词已在表里（40900）

  /community/sensitive-words/{word_id}:
    put:
      tags: [content-review]
      summary: 修改敏感词（改词 / 启停 / 说明）
      description: |
        停用（`enabled=false`）是**常规操作**：误伤的词停掉即可，不必删——留着它才能解释
        「昨天为什么拦了那条内容」。所以这个接口只做**软删除口径的停用**，没有删除动作。
      parameters:
        - $ref: "#/components/parameters/WordId"
        - $ref: "./common.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SensitiveWordRequest" }
      responses:
        "200":
          description: 修改后的词条
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/SensitiveWordView" }
        "400":
          description: 参数错误（40001）
        "404":
          description: 词条不存在（40400）
        "409":
          description: 改后的词与表里已有的词重复（40900）

  # ---------- 服务者月度考核（F022；决策见 ADR-0039 第三节 / ADR-0050 第四节 / ADR-0052）----------
  #
  # 三条口径写在这里，免得四个接口各说一遍：
  #
  #   - **规则可改，已算出的分不改**：权重、达标线与分档阈值都入库可配（ADR-0010 的业务可调项
  #     那一层），但历史账期存的是**当时的快照**——改规则只影响之后算出的账期（跨月可对比的前提）；
  #   - **覆盖必须留痕**：超级管理员可以覆盖三项主项（拉新 / 券 / 过程）的得分，**理由必填**，
  #     覆盖前后的值与操作者都落 append-only 的留痕表，服务者侧也看得到（否则无法申诉）；
  #   - **覆盖不隐藏算法原值**：算出来的原始分留在 `calculated_score` 上，
  #     `score` 是当前生效值——两者不同就是被覆盖过。
  /assessments/rules:
    get:
      tags: [assessment]
      summary: 考核规则（三项权重、达标线、分档阈值）
      description: |
        总分的权重（默认 **拉新 40 / 券 40 / 过程 20**，ADR-0039 第三节的交付文档口径）、
        三项各自的达标线，以及基础 / 优选 / 战略三档的分档阈值与 AI 推荐优先级映射。

        达标线为 0 表示**该项还没定要求**：按 ADR-0050 第四节，该维度不参与计分并重算权重
        （明细里注明「未参与」），而不是给它记 0 分。
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AssessmentRuleView" }
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
    put:
      tags: [assessment]
      summary: 修改考核规则（**只归超级管理员**）
      description: |
        整体覆盖。权重之和必须为 **100**（否则 40001）；三档阈值必须齐全且严格递增，
        基础档必须从 **0** 起（否则 40001）——否则会出现「谁都不匹配」的分数段。

        `min_score` 用两位小数字符串（分数不走浮点，ADR-0011 的精度纪律）。

        权限：ADR-0037 第一节的矩阵把考核规则配置划给超级管理员。角色体系尚未落地，
        本切片的门禁是**登录域 + 超管名单**（`app.assessment.super-admin-user-ids`）：
        名单未配置时**任何 admin 域身份都不能改**（fail-closed，见 ADR-0052 的「需要协调」）。
      parameters:
        - $ref: "./common.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssessmentRuleRequest" }
      responses:
        "200":
          description: 修改后的规则
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AssessmentRuleView" }
        "400":
          description: 权重之和不是 100 / 阈值不递增或基础档不为 0 / 分数格式不对（40001）
        "403":
          description: 不是超级管理员（40300）

  /assessments:
    get:
      tags: [assessment]
      summary: 全平台考核列表
      description: |
        按账期、等级、门店名筛选，账期倒序。只有**已经算过的账期**才有行——
        每月 1 日由定时任务算上月（ADR-0039 第三节）。
      parameters:
        - name: period
          in: query
          description: 账期（yyyy-MM）；不传表示全部
          schema: { type: string }
        - name: level
          in: query
          description: 等级：1 基础 / 2 优选 / 3 战略合作；不传表示全部
          schema: { type: integer, minimum: 1, maximum: 3 }
        - name: keyword
          in: query
          description: 按门店名模糊匹配，最长 64 字符
          schema: { type: string, maxLength: 64 }
        - $ref: "./common.yaml#/components/parameters/Page"
        - $ref: "./common.yaml#/components/parameters/PageSize"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "./common.yaml#/components/schemas/PageResult"
                          - type: object
                            properties:
                              list:
                                type: array
                                items: { $ref: "#/components/schemas/AssessmentSummaryView" }
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"

  /assessments/{score_id}:
    get:
      tags: [assessment]
      summary: 考核明细（每项得分、是否参与、数据来源与覆盖留痕）
      description: |
        运营看全平台的任意一条（服务者侧的同形状接口是 `provider.yaml` 的
        `GET /assessments/{period}`，只能看自己的）。`items` 里未参与的项也在，
        `overrides` 是这一期的覆盖留痕（谁、何时、改成多少、为什么）。
      parameters:
        - $ref: "#/components/parameters/ScoreId"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AssessmentView" }
        "404":
          description: 该条考核记录不存在（40400）

  /assessments/{score_id}/overrides:
    post:
      tags: [assessment]
      summary: 覆盖单项分（**必填理由，只归超级管理员**）
      description: |
        ADR-0039 第三节：「允许超级管理员覆盖单项分，但必须留痕：谁、何时、理由、覆盖前后值都留。
        否则算法是黑箱，服务者无法申诉。」

        四条规则：
        - **只能覆盖三项主项**（`INVITE` 拉新 / `COUPON` 券 / `PROCESS` 过程）：
          过程子项是过程分的**构成**而不是考核的单项，覆盖它们等于绕过算法，不给这个出口；
        - **理由必填**，且会随明细下发给服务者（否则「留痕」只对平台可见，申诉仍然无从谈起）；
        - **覆盖后立刻重算总分与等级**（`provider.level` / `provider.monthly_score` 一并写回），
          响应给的就是重算后的全貌；
        - **可以再次覆盖**：每次都在留痕表里追加一条（before / after 都是当时的生效值），
          算出来的原值始终留在 `calculated_score` 上——想把某一项还原，覆盖回原值即可。

        权限：与规则配置同一道超管门禁（ADR-0037 第一节的矩阵）。
      parameters:
        - $ref: "#/components/parameters/ScoreId"
        - $ref: "./common.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssessmentOverrideRequest" }
      responses:
        "200":
          description: 覆盖后的考核全貌（总分与等级已重算）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AssessmentView" }
        "400":
          description: 没填理由 / 项目编码不是三项主项之一 / 分数格式不对（40001）
        "403":
          description: 不是超级管理员（40300）
        "404":
          description: 该条考核记录不存在（40400）

components:
  parameters:
    CategoryId:
      name: category_id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    ItemId:
      name: item_id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    RequestId:
      name: request_id
      in: path
      required: true
      description: 目录外服务提案 id
      schema: { type: integer, format: int64 }
    ApplicationId:
      name: application_id
      in: path
      required: true
      description: 入驻申请 id
      schema: { type: integer, format: int64 }
    ProviderId:
      name: provider_id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    ServiceId:
      name: service_id
      in: path
      required: true
      description: 服务者服务项 id
      schema: { type: integer, format: int64 }
    TemplateId:
      name: template_id
      in: path
      required: true
      description: 券模板 id
      schema: { type: integer, format: int64 }
    GrantId:
      name: grant_id
      in: path
      required: true
      description: 权益授予记录 id
      schema: { type: integer, format: int64 }
    RightsCode:
      name: code
      in: path
      required: true
      description: 权益码（如 ai.unlimited）
      schema: { type: string, maxLength: 64 }
    UserId:
      name: user_id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    Threshold:
      name: threshold
      in: path
      required: true
      description: 邀请阶梯门槛（有效邀请数：1 / 3 / 5 / 10 / 15）
      schema: { type: integer, minimum: 1 }
    BehaviorCode:
      name: behavior_code
      in: path
      required: true
      description: 行为码（SIGN_IN / CHECK_IN / INVITE / REVIEW / PROFILE_COMPLETE / AI_ADVICE / SHARE）
      schema: { type: string, maxLength: 32 }
    TaskId:
      name: task_id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    OptionId:
      name: option_id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    TierId:
      name: tier_id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    PromptId:
      name: prompt_id
      in: path
      required: true
      description: 提示词版本 id
      schema: { type: integer, format: int64 }
    RedFlagId:
      name: red_flag_id
      in: path
      required: true
      description: 红线规则 id
      schema: { type: integer, format: int64 }
    RuleId:
      name: rule_id
      in: path
      required: true
      description: 分级规则 id
      schema: { type: integer, format: int64 }
    TermId:
      name: term_id
      in: path
      required: true
      description: 护栏词条 id
      schema: { type: integer, format: int64 }
    SwitchCode:
      name: switch_code
      in: path
      required: true
      description: 开关编码（代码里的常量，如 force_rule_only / retrieval_enabled / retrieval_strict）
      schema: { type: string, maxLength: 64 }
    ContentType:
      name: content_type
      in: path
      required: true
      description: 内容类型：1 经验卡片 / 2 提问 / 3 回答
      schema: { type: integer, minimum: 1, maximum: 3 }
    ContentId:
      name: content_id
      in: path
      required: true
      description: 内容 id（按 content_type 解释：卡片 id / 提问 id / 回答 id）
      schema: { type: integer, format: int64 }
    WordId:
      name: word_id
      in: path
      required: true
      description: 敏感词条 id
      schema: { type: integer, format: int64 }
    ScoreId:
      name: score_id
      in: path
      required: true
      description: 月度考核记录的 id（一个服务者一个账期一条）
      schema: { type: integer, format: int64 }

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HumanConsultAdminView:
      type: object
      description: 运营看到的工单：多了提交人、宠物与处置信息，便于排班与追溯。
      properties:
        id: { type: integer, format: int64 }
        user_id: { type: integer, format: int64 }
        pet_id: { type: integer, format: int64 }
        consult_id: { type: integer, format: int64 }
        risk_level: { type: integer, description: 0 未知 / 1 绿 / 2 黄 / 3 红（红色优先看） }
        status: { type: integer, description: 0 待处理 / 1 已回复 / 2 已关闭 }
        operator_id: { type: integer, format: int64, description: 处置人；0 表示还没人处理 }
        handled_at: { type: string, nullable: true }
        created_at: { type: string }

    HumanConsultStatusRequest:
      type: object
      required: [status]
      properties:
        status: { type: integer, minimum: 1, maximum: 2, description: 1 已回复 / 2 已关闭（0 是初始态，不能设回） }
        reply_note:
          type: string
          maxLength: 500
          description: 回复内容；`status=1` 时必填，会原样作为站内消息发给用户

    SymptomRuleView:
      type: object
      description: 一条症状映射（F011）。`item_name` / `category_name` 由服务端从目录现取，便于运营核对。
      properties:
        id: { type: integer, format: int64 }
        symptom_keyword: { type: string, description: 症状规范名（与知识侧词表同一套） }
        item_code: { type: string }
        item_name: { type: string, nullable: true, description: 目录项名称；目录项被删时为空 }
        category_name: { type: string, nullable: true }
        sort_order: { type: integer, description: 同一症状下的展示顺序，升序 }
        enabled: { type: integer, description: 1 启用 / 0 停用 }
        updated_at: { type: string }

    SymptomRuleRequest:
      type: object
      required: [symptom_keyword, item_code]
      properties:
        symptom_keyword:
          type: string
          minLength: 1
          maxLength: 64
          description: 症状规范名（如「腹泻」）；必须是知识侧已有的症状词，否则推荐永远命不中
        item_code: { type: string, maxLength: 32, description: 目录项编码（如 HE-012） }
        sort_order: { type: integer, description: 同一症状下的展示顺序；不传按 0 }
        enabled: { type: integer, description: 1 启用（默认）/ 0 停用 }

    ServiceCategoryView:
      type: object
      description: 标准目录分类（一级）
      properties:
        id: { type: integer, format: int64 }
        code: { type: string }
        item_code_prefix: { type: string, description: 该项目编码的前两位（HE / GR / SP …） }
        name: { type: string }
        icon: { type: string }
        description: { type: string }
        sort_order: { type: integer }
        status: { type: integer, description: 1 启用 / 0 停用 }
        item_count: { type: integer, description: 该分类下启用的项目数 }
        updated_at: { type: string }

    ServiceCategoryRequest:
      type: object
      required: [code, item_code_prefix, name]
      properties:
        code: { type: string, description: 2–32 位大写字母开头（如 HOSPITAL）；**创建后不可改** }
        item_code_prefix: { type: string, description: 两位大写字母（如 HE）；**创建后不可改、不可复用** }
        name: { type: string, maxLength: 64 }
        icon: { type: string, maxLength: 64, nullable: true }
        description: { type: string, maxLength: 255, nullable: true }
        sort_order: { type: integer }

    ServiceItemView:
      type: object
      description: 标准目录项（二级，含价格区间）
      properties:
        id: { type: integer, format: int64 }
        code: { type: string, description: 形如 HE-001；**发布后不可改、不可复用** }
        category_code: { type: string }
        category_name: { type: string }
        name: { type: string }
        price_min: { type: string, description: 价格区间下限（元，两位小数字符串） }
        price_max: { type: string, description: 价格区间上限（元，两位小数字符串） }
        price_unit: { type: string }
        duration_minutes: { type: integer, nullable: true }
        applicable_pets: { type: integer, description: 1 犬 / 2 猫 / 3 犬猫 }
        description: { type: string }
        sort_order: { type: integer }
        status: { type: integer, description: 1 启用 / 0 停用 }
        updated_at: { type: string }

    ServiceItemRequest:
      type: object
      required: [code, category_code, name, price_min, price_max]
      properties:
        code: { type: string, description: 形如 HE-001（两位大写字母 + 三位数字）；**创建后不可改** }
        category_code: { type: string, description: 所属分类；**创建后不可改**（编码前缀与分类绑定） }
        name: { type: string, maxLength: 128 }
        price_min: { type: string, description: 区间下限，最多两位小数 }
        price_max: { type: string, description: 区间上限，必须不低于下限 }
        price_unit: { type: string, maxLength: 16, description: 次 / 只 / 天 / 课时 / 件 }
        duration_minutes: { type: integer, minimum: 1, maximum: 1440, nullable: true }
        applicable_pets: { type: integer, minimum: 1, maximum: 3, description: 默认 3（犬猫） }
        description: { type: string, maxLength: 512, nullable: true }
        sort_order: { type: integer }

    ServiceItemStatusRequest:
      type: object
      required: [status]
      properties:
        status: { type: integer, description: 1 启用 / 0 停用（停用只挡新的选品） }

    CatalogItemProposalSummary:
      type: object
      properties:
        id: { type: integer, format: int64 }
        provider_id: { type: integer, format: int64 }
        provider_name: { type: string }
        category_code: { type: string }
        category_name: { type: string, nullable: true }
        name: { type: string }
        suggested_price_min: { type: string, description: 服务者建议的区间下限（仅供参考） }
        suggested_price_max: { type: string }
        suggested_price_unit: { type: string }
        status: { type: integer, description: 0 待审核 / 1 通过 / 2 驳回 }
        reject_reason: { type: string, nullable: true }
        item_code: { type: string, nullable: true }
        submitted_at: { type: string }
        reviewed_at: { type: string, nullable: true }

    CatalogItemProposalView:
      type: object
      properties:
        id: { type: integer, format: int64 }
        provider_id: { type: integer, format: int64 }
        provider_name: { type: string }
        category_code: { type: string }
        category_name: { type: string, nullable: true }
        name: { type: string }
        description: { type: string, nullable: true }
        suggested_price_min: { type: string }
        suggested_price_max: { type: string }
        suggested_price_unit: { type: string }
        status: { type: integer }
        reject_reason: { type: string, nullable: true }
        item_code: { type: string, nullable: true, description: 通过后生成的正式目录项编码 }
        review_remark: { type: string, nullable: true }
        submitted_at: { type: string }
        reviewed_at: { type: string, nullable: true }
        reviewer_id: { type: integer, format: int64, nullable: true }
        review_logs:
          type: array
          items: { $ref: "#/components/schemas/ReviewLogView" }

    CatalogItemProposalApproveRequest:
      type: object
      required: [price_min, price_max]
      properties:
        price_min: { type: string, description: 最终区间下限（必填，不默认采纳建议值） }
        price_max: { type: string, description: 最终区间上限（必填） }
        price_unit: { type: string, description: 不传则沿用提案里的建议单位 }
        name: { type: string, maxLength: 128, description: 不传则沿用提案里的名称 }
        code: { type: string, description: 指定项目编码（须与分类前缀一致且未被占用）；不传则自动排号 }
        remark: { type: string, maxLength: 255, nullable: true }

    ReviewApproveRequest:
      type: object
      properties:
        remark: { type: string, maxLength: 255, nullable: true, description: 审核备注，通过时通常为空 }

    ReviewRejectRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, maxLength: 255, description: 驳回原因；**会原样展示给服务者** }

    ReviewLogView:
      type: object
      properties:
        id: { type: integer, format: int64 }
        target_type: { type: integer, description: 1 入驻申请 / 2 服务上架审核 / 3 目录外提案 / 4 服务者状态变更 }
        action: { type: integer, description: 1 提交 / 2 重提 / 3 通过 / 4 驳回 / 5 上架 / 6 下架 / 7 冻结 / 8 解冻 }
        actor_id: { type: integer, format: int64, description: 操作者 id；0 表示系统写入 }
        actor_domain: { type: string, description: provider / admin；定时任务留空 }
        remark: { type: string, nullable: true }
        created_at: { type: string }

    OnboardingApplicationSummary:
      type: object
      properties:
        id: { type: integer, format: int64 }
        provider_id: { type: integer, format: int64 }
        provider_name: { type: string }
        provider_type: { type: integer }
        applicant_user_id: { type: integer, format: int64 }
        applicant_name: { type: string }
        contact_phone: { type: string, description: 脱敏 }
        status: { type: integer, description: 0 待审核 / 1 通过 / 2 驳回 }
        reject_reason: { type: string, nullable: true }
        submit_count: { type: integer }
        submitted_at: { type: string }
        reviewed_at: { type: string, nullable: true }

    OnboardingApplicationView:
      type: object
      properties:
        id: { type: integer, format: int64 }
        status: { type: integer }
        reject_reason: { type: string, nullable: true }
        review_remark: { type: string, nullable: true }
        submit_count: { type: integer }
        submitted_at: { type: string }
        reviewed_at: { type: string, nullable: true }
        reviewer_id: { type: integer, format: int64, nullable: true }
        applicant_user_id: { type: integer, format: int64 }
        applicant_name: { type: string }
        contact_phone: { type: string, description: 脱敏 }
        provider: { $ref: "#/components/schemas/ProviderProfileView" }
        qualifications:
          type: array
          items: { $ref: "#/components/schemas/ProviderQualificationView" }
        review_logs:
          type: array
          items: { $ref: "#/components/schemas/ReviewLogView" }

    ProviderQualificationView:
      type: object
      properties:
        id: { type: integer, format: int64 }
        type: { type: integer, description: 1 营业执照 / 2 执业许可证 / 3 法人身份证 / 4 训犬师认证 / 5 健康证 / 6 其他 }
        name: { type: string }
        cert_no: { type: string, nullable: true, description: 证件号（脱敏） }
        file_url: { type: string, nullable: true, description: 材料图片 URL；审核时要打开它看材料 }
        valid_from: { type: string, nullable: true }
        valid_until: { type: string, nullable: true, description: 到期日；为空表示长期有效 }
        status: { type: integer, description: 0 待审 / 1 通过 / 2 驳回 }
        review_remark: { type: string, nullable: true }

    ProviderProfileView:
      type: object
      description: 服务者（门店）信息；`phone` 是脱敏值
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        type: { type: integer, description: 1 医院 / 2 洗护 / 3 训犬 / 4 寄养上门 / 5 食品用品 / 6 间接服务 }
        category: { type: integer, description: 1 直接同业 / 2 直接异业 / 3 间接异业 }
        logo: { type: string, nullable: true }
        intro: { type: string, nullable: true }
        address: { type: string }
        lng: { type: string, nullable: true }
        lat: { type: string, nullable: true }
        phone: { type: string, description: 门店联系电话（脱敏） }
        business_hours:
          type: array
          items: { $ref: "#/components/schemas/BusinessHour" }
        status: { type: integer, description: 0 待审核 / 1 正常 / 2 驳回 / 3 冻结 }
        level: { type: integer }
        region_code: { type: string, nullable: true }
        monthly_score: { type: string }
        rating: { type: string }
        approved_at: { type: string, nullable: true }
        created_at: { type: string }
        updated_at: { type: string }

    BusinessHour:
      type: object
      required: [day_of_week, open_time, close_time]
      properties:
        day_of_week: { type: integer, minimum: 1, maximum: 7, description: 1 周一 … 7 周日 }
        open_time: { type: string, description: "HH:mm" }
        close_time: { type: string, description: "HH:mm" }

    ProviderStatusRequest:
      type: object
      required: [status]
      properties:
        status: { type: integer, description: 1 正常（解冻）/ 3 冻结（清退落点） }
        reason: { type: string, maxLength: 255, nullable: true, description: 处置原因，进审核流水 }

    ProviderServiceView:
      type: object
      description: 服务者上架的服务项；名称与区间来自标准目录（现取，不是快照）
      properties:
        id: { type: integer, format: int64 }
        provider_id: { type: integer, format: int64 }
        provider_name: { type: string, nullable: true, description: 审核队列里有值 }
        service_code: { type: string }
        service_name: { type: string, nullable: true }
        category_code: { type: string, nullable: true }
        category_name: { type: string, nullable: true }
        price: { type: string, description: 服务者定价 }
        price_unit: { type: string, nullable: true }
        price_min: { type: string, nullable: true, description: 目录项当前区间下限（据此判断是否还在区间内） }
        price_max: { type: string, nullable: true }
        status: { type: integer, description: 0 待审核 / 1 已上架 / 2 已下架 / 3 已驳回 }
        reject_reason: { type: string, nullable: true }
        submitted_at: { type: string, nullable: true }
        reviewed_at: { type: string, nullable: true }
        updated_at: { type: string }

    # ------------------------------------------------------------------ 券池

    CouponTemplateView:
      type: object
      description: 券模板（平台统一定义的券）。`cost_bearer=2` 的模板就是「平台补贴券」的定义
      properties:
        id: { type: integer, format: int64 }
        code: { type: string, description: 模板编码（形如 CP-001）；**创建后不可改、不可复用** }
        name: { type: string }
        face_value: { type: string, description: 抵扣面额（元，两位小数字符串） }
        min_amount: { type: string, description: 使用门槛：订单总额不低于它才可用（0.00 表示无门槛） }
        valid_days: { type: integer, description: 有效期：自发放之日起 N 天内有效 }
        cost_bearer: { type: integer, description: 1 服务者成本 / 2 平台补贴；只影响核销统计与考核，不产生资金（ADR-0036） }
        scope_type: { type: integer, description: 0 不限 / 1 限服务分类 / 2 限目录项 }
        scope_codes:
          type: array
          description: 适用范围编码（分类编码或目录项编码）；scope_type=0 时为空
          items: { type: string }
        scope_desc: { type: string, description: 适用范围的现成文案，由服务端拼好 }
        issue_limit: { type: integer, nullable: true, description: 平台补贴券的发放上限；为空表示不限（服务者成本券恒为空） }
        issued_count: { type: integer, description: 已发放张数（运营据此看上限还剩多少） }
        status: { type: integer, description: 1 启用 / 0 停用 }
        description: { type: string, nullable: true }
        created_at: { type: string }
        updated_at: { type: string }

    CouponTemplateRequest:
      type: object
      required: [code, name, face_value, valid_days, cost_bearer]
      properties:
        code: { type: string, description: 模板编码（两位大写字母 + 三位数字，如 CP-001）；**创建后不可改** }
        name: { type: string, maxLength: 128 }
        face_value: { type: string, description: 抵扣面额，最多两位小数且大于 0 }
        min_amount: { type: string, description: 使用门槛，可传 0.00（无门槛）；默认 0.00 }
        valid_days: { type: integer, minimum: 1, maximum: 3650, description: 自发放之日起有效天数 }
        cost_bearer: { type: integer, description: 1 服务者成本 / 2 平台补贴；**创建后不可改** }
        scope_type: { type: integer, description: 0 不限 / 1 限服务分类 / 2 限目录项；默认 0 }
        scope_codes:
          type: array
          description: 适用范围编码；scope_type=0 时必须为空，否则必须都能在标准目录里找到
          items: { type: string }
        issue_limit: { type: integer, nullable: true, description: 发放上限；只对平台补贴券有意义 }
        description: { type: string, maxLength: 255, nullable: true }

    CouponTemplateStatusRequest:
      type: object
      required: [status]
      properties:
        status: { type: integer, description: 1 启用 / 0 停用（停用只挡新的发放与新的贡献） }

    CouponPoolOverviewView:
      type: object
      description: 券池总览 + 对账口径（ADR-0037 第三节）
      properties:
        template_count: { type: integer, description: 模板总数 }
        template_active_count: { type: integer, description: 启用中的模板数 }
        provider_cost_template_count: { type: integer, description: 服务者成本模板数 }
        platform_subsidy_template_count: { type: integer, description: 平台补贴模板数 }
        contribution_count: { type: integer, description: 生效中的贡献条数 }
        committed_total: { type: integer, description: 服务者承诺的额度合计 }
        available_total: { type: integer, description: 还可发放合计 }
        issued_total: { type: integer, description: 已发放券实例总数 }
        redeemed_total: { type: integer, description: 已核销 }
        reserved_total: { type: integer, description: 未过期未核销（在用户手里） }
        expired_total: { type: integer, description: 已过期未核销（额度已释放回池） }
        by_source:
          type: array
          description: 按来源拆开（邀请 / 打卡任务 / 积分兑换 / 平台补贴 / 月度阶梯）
          items: { $ref: "#/components/schemas/CouponSourceStatView" }
        reconciliation: { $ref: "#/components/schemas/CouponReconciliationView" }

    CouponSourceStatView:
      type: object
      properties:
        source: { type: integer, description: 1 邀请 / 2 打卡任务 / 3 积分兑换 / 4 平台补贴 / 5 月度阶梯 }
        issued: { type: integer }
        redeemed: { type: integer }
        reserved: { type: integer }
        expired: { type: integer }

    CouponReconciliationView:
      type: object
      description: |
        对账恒等式：**实例数 = 已发放 = 已核销 + 未过期未核销 + 已过期未核销**。
        本项目没有资金可对（ADR-0036），这张就是券的对账；不平即告警。
      properties:
        issued: { type: integer }
        redeemed: { type: integer }
        reserved: { type: integer }
        expired: { type: integer }
        balanced: { type: boolean, description: false 表示不平，要人工查 }
        note: { type: string, description: 口径说明（直接给运营看） }

    CouponView:
      type: object
      description: 券实例（发给某个用户的那一张）
      properties:
        id: { type: integer, format: int64 }
        code: { type: string, description: 券码（排查用，不是安全凭证） }
        user_id: { type: integer, format: int64 }
        template_id: { type: integer, format: int64 }
        template_code: { type: string }
        template_name: { type: string }
        face_value: { type: string, description: 面额快照：模板后来改了面额，已发的券不受影响 }
        min_amount: { type: string }
        source: { type: integer, description: 1 邀请 / 2 打卡任务 / 3 积分兑换 / 4 平台补贴 / 5 月度阶梯 }
        contribution_id: { type: integer, format: int64, nullable: true, description: 占用了哪条服务者贡献；平台补贴券为空 }
        provider_id: { type: integer, format: int64, nullable: true, description: 服务者贡献券的核销门店 }
        provider_name: { type: string, nullable: true, description: 核销门店名称（服务者成本券才有） }
