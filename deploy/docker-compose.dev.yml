# 本地开发只起中间件；后端与前端在宿主机上跑，保留热重载。
# 用法：docker compose -f deploy/docker-compose.dev.yml up -d
#
# 端口说明：MySQL 映射到宿主机 **3307** 而不是默认的 3306——因为这台机器上装了
# 原生的 Windows MySQL 服务，3306 被它占着。用 3307 也顺带把项目的数据和本机
# 其它库隔开，避免"拿生产库开发"这类事故（09-19 的评估报告专门警告过这条）。
#
# 镜像拉取：Docker Desktop 的 ~/.docker/daemon.json 已配好国内镜像源
# （docker.1ms.run → hub.rat.dev → docker.m.daocloud.io，按实测速度排序），
# 直接 `docker pull` 即可，不需要在镜像名前加前缀。
services:
  mysql:
    image: mysql:8.4
    container_name: ph-mysql-dev
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: devroot
      MYSQL_DATABASE: pet_health
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
    ports:
      - "3307:3306"
    volumes:
      - ./data/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-pdevroot"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    # 向量检索依赖 Redis 8 内置的 Query Engine（RediSearch）。
    # 2026-09-27 实测确认：镜像里带 search 81001 / vectorset / bf / ReJSON，
    # Redis 8.10.2；建 FLAT+COSINE 索引并跑 KNN 往返成功。
    # 注意 RediSearch 的中文分词不支持子串检索，关键词检索走 MySQL ngram。
    # 详见 docs/research/63-knowledge-base-rag.md 与 issue #63 的实测评论。
    image: redis:8-alpine
    container_name: ph-redis-dev
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
