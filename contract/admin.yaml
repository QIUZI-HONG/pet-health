  /points/exchange-options:
    get:
      tags: [points]
      summary: 兑换档位
      description: |
        **只兑平台补贴券**（ADR-0038 第四节）：兑换消耗的是平台的钱（成本归平台），
        不消耗服务者的贡献额度——否则等于把兑换成本转嫁给服务者，直接抵消它的出券意愿。
        所以这里的所有档位都必须指向 `cost_bearer = 2` 的券模板。
      responses:
        "200":
          description: 成功（按 sort_order 升序）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
