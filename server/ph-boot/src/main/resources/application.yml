server:
  port: 8080

spring:
  application:
    name: pet-health-server

  # 本地密钥放 server/.env（照 server/.env.example 生成，已被 .gitignore 忽略）；
  # CI 与生产直接给环境变量。**仓库里不存任何密钥值**（AGENTS.md 的硬约束）。
  #
  # 两个路径都要试：`./mvnw -pl ph-boot spring-boot:run` 时进程工作目录是 server/ph-boot，
  # 而在 server/ 下直接跑 jar 时是 server/——少写一个就会变成「明明配了却说没配」。
  config:
    import: optional:file:./.env[.properties],optional:file:../.env[.properties]

  datasource:
    # 端口是 3307 不是 3306：本机装了原生的 Windows MySQL，3306 被它占着。
    # 见 deploy/docker-compose.dev.yml 的说明。
    url: ${MYSQL_URL:jdbc:mysql://127.0.0.1:3307/pet_health?useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=Asia/Shanghai}
    username: ${MYSQL_USER:root}
    # 默认值只用于本地开发，与 deploy/docker-compose.dev.yml 一致；不要用于任何真实环境
    password: ${MYSQL_PASSWORD:devroot}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
    # 契约里是 request_id / access_token / page_size，全局统一 snake_case（ADR-0011）
    property-naming-strategy: SNAKE_CASE

  # DDL 只由迁移脚本产生，框架不许建表也不许改表（ADR-0011）。
  # 回滚脚本在 classpath:db/undo/，人工执行步骤见 server/README.md。
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

mybatis-plus:
  configuration:
    # 表字段 snake_case ↔ Java camelCase
    map-underscore-to-camel-case: true
    # 开发期把 SQL 打出来；上线前按日志量再决定要不要降级
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ---- 日志（ADR-0029）----
# **每一行都要带 traceId**：交付文档 10.6 要「按 request_id 全链路追踪」，而这件事能成立的前提
# 是日志行本身带得上它。Spring Boot 的默认格式**不含 MDC**，所以必须自己写 pattern。
#   %X{traceId:-}  —— 取 MDC 里的 traceId，没有时留空（定时任务、启动日志不该出现占位噪音）
# 有了它，新代码不必再把 traceId 拼进消息里（老代码里那些 `traceId=` 保留也无害）。
logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p %-40.40logger{39} [%X{traceId:-}] %m%n%wEx"

management:
  # 运维端点走**独立端口**（9090）：它们不随业务端口一起暴露，部署时只要不把 9090 映射出去，
  # 指标与健康信息就只在内网可达。原先挂在业务端口上一个过滤器都不拦——实测无凭证
  # `curl /actuator/prometheus` 直接 200，与 ai 服务「health 要内部令牌」的口径也不一致。
  server:
    port: ${MANAGEMENT_PORT:9090}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      # 只回 UP/DOWN，不回组件细节：健康端点在网关后往往可直接访问，细节属于内部信息
      show-details: never
  metrics:
    tags:
      application: pet-health-server

# ---- 会话与口令（ADR-0012）----
app:
  auth:
    # 没有默认值，缺了直接启动失败（JwtService 会给出可读的错）——绝不在仓库里放假密钥，
    # 那等于「部署时忘了配」也不会被发现。
    jwt-secret: ${JWT_SECRET:}
    access-ttl: ${JWT_ACCESS_TTL:2h}
    refresh-ttl: ${JWT_REFRESH_TTL:7d}
    # 同一手机号连续失败多少次后拒绝登录，以及这个计数保留多久
    login-max-failures: ${LOGIN_MAX_FAILURES:10}
    login-lock-window: ${LOGIN_LOCK_WINDOW:15m}

  # ---- 接口限流（ADR-0028）----
  # 规则按顺序取第一个前缀命中的，所以顺序即优先级：严的写前面。
  # 阈值是技术参数（改要重启，不进库）；配错的值按 ADR-0028 的 Rule 归一化处理。
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    rules:
      # 认证接口：注册/登录/换令牌。30/分钟按「共享出口不能误伤」定，
      # 账号维度的防刷另有 login-max-failures 兜着，两者不是一回事
      - path-prefix: /api/v1/app/auth/
        limit: ${RATE_LIMIT_AUTH:30}
        window: 1m
      # 兜底：所有业务接口。这条必须存在——没有规则命中的路径是不限流的
      - path-prefix: /api/v1/
        limit: ${RATE_LIMIT_DEFAULT:600}
        window: 1m

  # ---- 写接口幂等（ADR-0028）----
  # 客户端带 Idempotency-Key 时，同一个键的重复提交只执行一次、重放首次响应。
  # 可选能力：不带这个头的请求行为完全不变。
  idempotency:
    enabled: ${IDEMPOTENCY_ENABLED:true}
    # 键保留多久，同时是「客户端可以在这段时间内安全重试」的承诺
    ttl: ${IDEMPOTENCY_TTL:10m}

  # ---- 敏感字段加密（ADR-0013）----
  # 同样没有默认值：缺了启动即失败。生成方式见 server/.env.example。
  crypto:
    enc-key: ${FIELD_ENC_KEY:}
    hmac-key: ${FIELD_HMAC_KEY:}
    # 轮换期间才配：解密先试当前密钥，失败再试它（ADR-0013）
    enc-key-previous: ${FIELD_ENC_KEY_PREVIOUS:}


# ---- 文件与对象存储（ADR-0020）----
# 本期是本地盘驱动；生产换 cos 驱动要改 driver 并补实现（欠账记在 ADR-0020 与 #122）。
  file:
    driver: ${FILE_STORAGE_DRIVER:local}
    # 落盘的根目录；相对路径按进程工作目录解析（server/ 下跑就是 server/data/files）
    root: ${FILE_STORAGE_ROOT:data/files}
    # 交付文档 13.2：单图 ≤ 10MB、一次最多 9 张
    max-bytes: ${FILE_MAX_BYTES:10485760}
    max-count: ${FILE_MAX_COUNT:9}
    # 上传凭证 30 分钟够慢网络传完 9 张图；读地址 10 分钟，与「详情缓存 1 分钟」同量级
    presign-ttl: ${FILE_PRESIGN_TTL:30m}
    read-ttl: ${FILE_READ_TTL:10m}

  # ---- 考核（ADR-0052）----
  # 能改考核规则与覆盖单项分的账号白名单。**fail-closed**：不配 = 这两个动作没人能做
  # （不是「谁都能做」），因为让「谁能改分」成为运营后台里可自助修改的配置，等于把门禁的
  # 钥匙挂在门上——所以它是技术参数而不是业务配置（ADR-0010 的分层）。
  assessment:
    # 这里必须显式中转一次：Spring 的 relaxed binding 只把 APP_ASSESSMENT_SUPER_ADMIN_USER_IDS
    # 映射到该属性，而 ADR-0052 与 contract/admin.yaml 让运维配的是 **ASSESSMENT_SUPER_ADMIN_USER_IDS**
    # ——少了这一行，照文档配也到不了那个属性，机制会在「测试全绿」的状态下永远 fail-closed。
    super-admin-user-ids: ${ASSESSMENT_SUPER_ADMIN_USER_IDS:}

  # ---- 订单（ADR-0049）----
  # 预约提醒的提前量（小时）。提醒是「快到了」，不是「今天有单」——按天跑会让下午 3 点的单
  # 在凌晨收到提醒，所以窗口按小时算（F026）。去重键按订单，同一条预约只会收到一条。
  order:
    appointment-reminder-hours: ${ORDER_APPOINTMENT_REMINDER_HOURS:2}

  # ---- 两个后台的登录准入（ADR-0035「需要协调」第 3 条）----
  # 能进运营后台的账号 id 名单，逗号分隔。**fail-closed：空名单 = 谁都进不去**（不是谁都能进）
  # ——运营后台看得到全平台数据，默认开放等于把门禁的钥匙挂在门上。服务者后台不在这里判：
  # 它的准入是「有没有启用中的服务者绑定」，那是数据里的事实，不是配置。
  console:
    admin-user-ids: ${CONSOLE_ADMIN_USER_IDS:}

  # ---- 增长与券池（ADR-0037 / 0044）----
  # 券到期前多少天提醒用户去用（F026）。提醒的是「快过期」——已经过期时用户无事可做。
  privilege:
    coupon-expiring-days: ${PRIVILEGE_COUPON_EXPIRING_DAYS:3}

# ---- AI 服务（ADR-0009：模型调用在独立的 ai/ 服务里，本后端只是它的客户端）----
# 完整设计见 docs/design/ai-service.md。这些是**技术参数**，改要重启；
# 业务可调项（提示词/红线词/分级规则/降级开关）在数据库里，运营后台改（ADR-0010）。
ai:
  service:
    base-url: ${AI_SERVICE_BASE_URL:http://127.0.0.1:8000}
    # 必须与 ai/.env 的 INTERNAL_TOKEN 一致
    token: ${AI_SERVICE_TOKEN:dev-internal-token}
    # **20 秒不是拍脑袋**：模型实测中位数 5.3 秒、偶发 20 秒（ADR-0017 有六次样本）。
    # 交付文档写的「10 秒提示重试」+ 原先的 8 秒超时，在推理型模型上等于常态化降级——
    # 那条假设建立在「没有厂商 P95 数据」之上，现在有数据了，所以要重算。
    timeout-ms: ${AI_TIMEOUT_MS:20000}
    # **本服务对 AI 服务可达的地址**：档案照片的签名读地址是相对路径，AI 服务要自己去取图
    # （取回字节再内联给模型，因为模型供应商拉不到我们的内网），所以出站时要补成绝对地址
    file-base-url: ${APP_BASE_URL:http://127.0.0.1:8080}
  quota:
    # 交付文档 F006：免费用户每日 3 次
    free-per-day: ${AI_FREE_QUOTA_PER_DAY:3}
  budget:
    # 日预算**只告警不熔断**（ADR-0026）：超限记 WARN 与运营日志，不切断模型——在知识检索层落地前，
    # 熔断等于把咨询降级成固定话术。默认 50 元是占位值，需按真实用户量校准（#119 的埋点出来后一起做）
    daily-cny: ${AI_DAILY_BUDGET_CNY:50}
    # 单价按真实账单校准（元 / 1000 token）。**留空 = 按 0 算，告警不会响**（启动时有 WARN 提示）——
    # 宁可估成 0 也不瞎编一个价格进日志。输入与输出分开：推理型模型的输出单价通常是输入的几倍
    prompt-cny-per-1k: ${AI_PROMPT_CNY_PER_1K:}
    completion-cny-per-1k: ${AI_COMPLETION_CNY_PER_1K:}

