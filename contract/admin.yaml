      tags: [ai]
      summary: 运行时开关列表
      description: |
        开关的**语义在代码里**（ADR-0010 的判据），库里只存它的当前状态：
        `force_rule_only` 打开后全量走规则通道（不调模型）；`retrieval_enabled` / `retrieval_strict`
        控制知识检索的开关与严格口径。库里读不到时一律按关闭算（ADR-0033 第三节）。
      responses:
        "200":
