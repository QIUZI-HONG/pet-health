          description: 行为码不存在（40400）

  /points/tasks:
    get:
      tags: [points]
      summary: 任务清单（每日 + 每周两档）
      description: |
        任务清单**入库存配置**（ADR-0038 第四节）：每日任务（签到 / 打卡 / 查看 AI 建议 / 分享）
        与每周任务（完成 5 次打卡 / 邀请 1 人）。

        `points` 是该行为的分值（取自行为表），任务本身**不额外发分**——
        同一行为发两次奖励正是 ADR-0038 点名要钉死的那条（权益与积分是两套账，
