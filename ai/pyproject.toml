[project]
name = "pet-health-ai"
version = "0.1.0"
description = "宠物 AI 健康管理平台 · AI 服务（分级 / 检索 / 提示词编排）"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "redis>=5.2",
    "pymysql>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
# live 标记：真打模型，默认不跑（需要 key 与网络）。本地验证用：
#   AI_LIVE_TEST=1 pytest -m live
markers = ["live: 需要真实模型与网络的端到端测试"]
addopts = "-m 'not live' -q"
