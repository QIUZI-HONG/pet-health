# 服务者后台接口契约 —— 路由前缀 /api/v1/provider/**
#
# 消费方：服务者后台（桌面 Web）。公共组件见 common.yaml。
# 命名纪律：代码标识符一律用 provider，禁止出现 merchant（此处为禁止声明本身的文档用词引用）。
# 依据是 CONTEXT.md 的术语表（「服务者 ServiceProvider」条目）。
#
# 状态：**入驻与资质审核（#104）、选品定价与上架（#105）、标准目录读取、券池的服务者侧
# （选券与贡献额度、核销统计，切片 #110）已定义**。
# 交易域已落地（订单列表 / 详情、接单、核销、取消、三道照片墙、报工，切片 #77 / #107 / #109），
# 服务留痕照片的直传入口（`/files/presign`）与报工后的档案回流也在这一轮接上。
# 本轮新增：**月度考核（F022）**——服务者看自己的月度分（列表 + 明细），决策见 ADR-0039 第三节 /
# ADR-0050 第四节 / ADR-0052。
# 仍未定义：派工与技师排班（ADR-0037 的权限矩阵里有「派工」，规则未定）、
# 对账视图（ADR-0002 后没有余额与提现）。券的**核销动作**不在这里：
# 它在订单核销的同一个事务里完成（ADR-0038 第一节「核销时券转已用」），本文件只给券的统计与明细。
#
# 三条贯穿全篇的约定：
#   - **鉴权**：Token 的登录域必须是 provider（ADR-0012）。运营后台的接口在 admin.yaml。
#   - **越权**：别人的门店 / 服务项 / 提案 / 券贡献 / **订单**一律按不存在处理（40400），不返回 40300。
#   - **价格**：金额是字符串（"128.00"），最多两位小数（ADR-0011）。
#     定价越界返回业务码 **90001**（HTTP 200），message 就是「价格须在¥X-¥Y之间」。
#   - **券的钱语义**：券只是到店抵扣凭证，任何地方都不出现资金流 / 结算 / 打款（ADR-0036）。

openapi: 3.1.0

info:
  title: 宠物 AI 健康管理平台 · 服务者后台接口
  version: 0.2.0
  description: |
    路由前缀 `/api/v1/provider/**`。公共组件见 `common.yaml`。

    本端与运营后台是两个独立登录域（[ADR-0012](../docs/adr/0012-auth-and-session.md)）：
    同一个 Token 在两边都不通用。

servers:
  - url: /api/v1/provider

tags:
  - name: onboarding
    description: 入驻申请（提交 / 进度 / 驳回后重提）
  - name: profile
    description: 门店信息、营业时间与资质材料（审核通过后可维护）
  - name: catalog
    description: 标准目录读取与目录外服务提案（决策见 ADR-0034）
  - name: service
    description: 选品定价与上架（切片 #105）
  - name: order
    description: 订单与履约：接单 / 核销 / 三道照片墙 / 报工（切片 #77 / #107 / #109；决策见 ADR-0038 / ADR-0040）
  - name: file
    description: 图片直传凭证（ADR-0020 的预签名直传；`biz_type` 收 `care`（服务留痕）与 `qualification`（资质材料））
  - name: coupon
    description: 券池：选券并承诺可核销额度、看贡献与核销统计（切片 #110，决策见 ADR-0037 / ADR-0044）
  - name: assessment
    description: |
      月度考核：我的月度分（列表 + 明细）。每月 1 日算上月，落月度分表、保留历史（跨月可对比）。
      算法与缺项口径见 ADR-0039 第三节 / ADR-0050 第四节，本切片的实现决策见
      ADR-0052；**规则配置与单项分覆盖在运营后台**（`admin.yaml`，只归超级管理员）。
  - name: invite
    description: |
      门店推广码（营销中心里的「推广码与店内物料」）：一店一码，扫它注册的用户**归因到门店**。

      它是考核「拉新」那一项的取数来源（交付文档 F022 的店内二维码），
      闭合了 ADR-0052「需要协调」第 1 条——在那之前服务者侧没有任何拉新入口，
      考核的拉新项取不到数，只能按「不参与、重算权重、明细注明」处理。

      **只有门店管理员能取码**（技师不行，与券贡献同一道门禁）；取码幂等，重复调用返回同一个码。

security:
  - bearerAuth: []

paths:
  # ---- 登录（ADR-0012 的三个登录域；账号是同一批，准入按域判）----
  # 这三条**不需要登录**（登录当然不能在登录之后）：JwtAuthenticationFilter 的 PUBLIC_PATHS 里。
  # 请求/响应的形状复用 app.yaml 的 LoginRequest / RefreshRequest / LogoutRequest / TokenPair——
  # 后台与 C 端用的是同一批账号（ADR-0035 决定 4：「绑定现有账号 id」），凭据形状是同一个东西，
  # 再定义一份只会让两侧漂移。
  /auth/login:
    post:
      tags: [auth]
      summary: 服务者后台登录
      description: |
        手机号 + 密码，与 C 端同一批账号。**本端不设准入**：BPM-4 的第一步就是「申请入驻」，
        而申请要先能进这个控制台——若要求「已有服务者绑定」才能登录，就永远没人能提交第一份申请。

        进来以后**看得到什么**由各接口已有的绑定校验决定：未绑定 / 审核中 / 已驳回的账号
        读门店类接口 40400、写 40300（ADR-0035 的 Consequences 写明过这条）。
        运营后台不同：它能看到全平台数据且没有「先登录才能申请」的流程，所以那边是名单制
        （`app.console.admin-user-ids`，fail-closed）。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "./app.yaml#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: 登录成功；`data` 里的令牌登录域是 provider
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "./app.yaml#/components/schemas/TokenPair" }
        "401": { description: 手机号或口令不正确（40100） }
        "403": { description: 账号被禁用（40300） }
        "429": { description: 尝试过于频繁（42900） }

  /auth/refresh:
    post:
      tags: [auth]
      summary: 换发令牌（provider 域）
      description: |
        与 C 端同一条规则：Refresh 一次性使用，旧的在换发时作废（ADR-0012）。
        **旧 Refresh 的登录域必须也是 provider**——拿 C 端的 Refresh 打这里换不到 provider 令牌，
        否则「三个登录域互不通用」就只剩一句话。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "./app.yaml#/components/schemas/RefreshRequest" }
      responses:
        "200":
          description: 新的一对令牌
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "./app.yaml#/components/schemas/TokenPair" }
        "401": { description: Refresh 过期、已作废、或登录域不匹配（40101 / 40100） }

  /auth/logout:
    post:
      tags: [auth]
      summary: 退出（吊销 Refresh）
      description: 已签发的 Access 在剩余有效期（≤2 小时）内仍有效，这是不引黑名单的必然代价（ADR-0012）。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "./app.yaml#/components/schemas/LogoutRequest" }
      responses:
        "200": { description: 已退出（重复调用同样返回成功） }

  /onboarding/applications:
    get:
      tags: [onboarding]
      summary: 我的入驻申请列表
      description: |
        只返回当前账号提交过的申请（按提交时间倒序）。**驳回原因在列表里就给出来**——
        服务者最关心的是「卡在哪」，要先点进详情才能看到原因会多一步。
      parameters:
        - name: status
          in: query
          description: 0 待审核 / 1 通过 / 2 驳回；不传表示全部
          schema: { type: integer, minimum: 0, maximum: 2 }
        - $ref: "./common.yaml#/components/parameters/Page"
        - $ref: "./common.yaml#/components/parameters/PageSize"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "./common.yaml#/components/schemas/PageResult"
                          - type: object
                            properties:
                              list:
                                type: array
                                items: { $ref: "#/components/schemas/OnboardingApplicationSummary" }
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
    post:
      tags: [onboarding]
      summary: 提交入驻申请（含资质材料）
      description: |
        申请即建一条**待审核**的服务者记录；审核通过后申请人成为该服务者的管理员。

        三条会被拒绝的业务规则：
        - 当前账号已关联服务者 → 40900；
        - 已有一份待审核的申请 → 40900（可先用 `PUT` 改「已驳回」的那份）；
        - 营业执照 / 身份证已被另一个**有效状态**（待审核或正常）的服务者占用 → 40900。
          被驳回或已冻结的记录不占名额——否则一次误拒就再也开不了店。
      parameters:
        - $ref: "./common.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OnboardingApplicationRequest" }
      responses:
        "200":
          description: 已提交，返回申请详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/OnboardingApplicationView" }
        "400":
          description: 参数错误（40001）
        "409":
          description: 已有申请 / 已关联服务者 / 证件号重复（40900）

  /onboarding/applications/{application_id}:
    get:
      tags: [onboarding]
      summary: 申请详情（含资质材料与审核流水）
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/OnboardingApplicationView" }
        "404":
          description: 申请不存在，或不是当前账号提交的（40400）
    put:
      tags: [onboarding]
      summary: 驳回后修改重提
      description: |
        **同一份申请单**改完回到待审核，不新建服务者记录（`submit_count` 加一，
        于是「被退回过几次」查得到）。

        只有「已驳回」的申请能这样改：待审核时直接改会绕过审核员手里的那一版材料——
        他看到的和最终入库的就不是同一份了。
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
        - $ref: "./common.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OnboardingApplicationRequest" }
      responses:
        "200":
          description: 已重新提交
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/OnboardingApplicationView" }
        "404":
          description: 申请不存在，或不属于当前账号（40400）
        "409":
          description: 申请正在审核中 / 已通过（40900）

  /profile:
    get:
      tags: [profile]
      summary: 我的门店信息
      description: |
        **还没通过审核时返回 40400**：门店这个资源此时还不存在——审核进度与门店快照走
        `/onboarding/applications/{application_id}`（申请详情里带着 `provider`）。

        已通过但被冻结 / 资质过期的服务者读得到（界面要展示状态），写（`PUT`）被 40300 拦住。
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ProviderProfileView" }
        "404":
          description: 当前账号还没有关联的服务者（40400）
    put:
      tags: [profile]
      summary: 维护门店信息（审核通过后）
      description: |
        整体覆盖。**改了不需要重新审核**——交付文档没要求门店信息变更走审核，
        本切片不自行加一道（取舍见 ADR-0035）。
      parameters:
        - $ref: "./common.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProviderProfileRequest" }
      responses:
        "200":
          description: 更新后的门店信息
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ProviderProfileView" }
        "403":
          description: 审核中 / 已被驳回 / 已被冻结（40300）
        "404":
          description: 还没通过审核，门店还不存在（40400）

  /profile/business-hours:
    put:
      tags: [profile]
      summary: 维护营业时间（整体替换）
      description: |
        只列**营业的那几天**：数组里没有的星期几就是休息（用「不出现 = 不营业」而不是
        `closed: true` 标记——后者会出现「既有时段又标了休息」这种自相矛盾的行）。
        空数组表示整周休息，**不是**「不改」。

        跨天的营业时段（22:00–02:00）本期不支持：预约时段校验在下单链路（#77），
        到那时再决定要不要跨天。
      parameters:
        - $ref: "./common.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BusinessHoursRequest" }
      responses:
        "200":
          description: 更新后的门店信息
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ProviderProfileView" }
        "400":
          description: 同一天重复 / 开始时间不早于结束时间（40001）
        "403":
          description: 服务者未通过审核或已被冻结（40300）

  /profile/qualifications:
    put:
      tags: [profile]
      summary: 补交 / 更新资质材料（整体替换）
      description: |
        **补交即可恢复上架**：资质全部过期后系统会自动下架该服务者的全部服务项
        （但不注销服务者，历史订单与客户关系都留着），补交新材料后即可再上架。

        新材料回到「待审核」；材料本身的复核流程（谁看、多久看、驳回后怎么办）
        尚未定，见 ADR-0035 的待澄清——在那之前，上架门禁只看「有没有一份没过期的材料」。
      parameters:
        - $ref: "./common.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProviderQualificationsRequest" }
      responses:
        "200":
          description: 更新后的门店信息
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ProviderProfileView" }
        "400":
          description: 材料为空 / 证件号格式不对（40001）
        "403":
          description: 服务者未通过审核或已被冻结（40300）
        "409":
          description: 营业执照 / 身份证已被另一个有效服务者占用（40900）

  /catalog/categories:
    get:
      tags: [catalog]
      summary: 标准目录分类（只给启用的）
      description: 停用的分类对服务者等于不存在——不能选、不能在其下提案。
      responses:
        "200":
          description: 成功（按 sort_order 升序）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/ServiceCategoryView" }

  /catalog/items:
    get:
      tags: [catalog]
      summary: 标准目录项（含价格区间，只给启用的）
      description: |
        选品页据此渲染：**区间与名称一起给出**，服务者不必先试一次才知道边界在哪。
        目录项编码（`code`）一旦发布不可改、不可复用（订单项与券适用范围挂在它上面）。
      parameters:
        - name: category_code
          in: query
          schema: { type: string, maxLength: 32 }
        - name: keyword
          in: query
          description: 按项目名称模糊匹配，最长 64 字符
          schema: { type: string, maxLength: 64 }
        - $ref: "./common.yaml#/components/parameters/Page"
        - $ref: "./common.yaml#/components/parameters/PageSize"
      responses:
        "200":
          description: 成功（按 sort_order 升序）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "./common.yaml#/components/schemas/PageResult"
                          - type: object
                            properties:
                              list:
                                type: array
                                items: { $ref: "#/components/schemas/ServiceItemView" }
        "400":
          description: 关键字超长 / 页码越界（40001）

  /catalog/item-requests:
    get:
      tags: [catalog]
      summary: 我的目录外服务提案列表
      parameters:
        - name: status
          in: query
          description: 0 待审核 / 1 通过 / 2 驳回；不传表示全部
          schema: { type: integer, minimum: 0, maximum: 2 }
        - $ref: "./common.yaml#/components/parameters/Page"
        - $ref: "./common.yaml#/components/parameters/PageSize"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "./common.yaml#/components/schemas/PageResult"
                          - type: object
                            properties:
                              list:
                                type: array
                                items: { $ref: "#/components/schemas/CatalogItemProposalSummary" }
    post:
      tags: [catalog]
      summary: 提交目录外服务提案
      description: |
        目录是平台的资产（F010），**服务者不能自由建项**：只能提案，运营审核通过后
        平台才建正式目录项（交付文档 F012 / 2.5「目录外服务须经平台审核」）。

        建议区间只是**参考**：最终区间由运营在审核通过时给出——
        让申请方定义规则，等于让区间校验自己批自己。
      parameters:
        - $ref: "./common.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CatalogItemProposalRequest" }
      responses:
        "200":
          description: 已提交，返回提案详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/CatalogItemProposalView" }
        "400":
          description: 分类不存在或已停用 / 区间下限高于上限（40001）
        "403":
          description: 入驻审核未通过或已被冻结（40300）

  /catalog/item-requests/{request_id}:
    get:
      tags: [catalog]
      summary: 提案详情（含审核流水）
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/CatalogItemProposalView" }
        "404":
          description: 提案不存在，或不属于当前服务者（40400）

  /services:
    get:
      tags: [service]
      summary: 我的服务项（含待审核与已驳回）
      description: 服务者要看得见自己的全部动作，所以列表**不默认过滤状态**。
      parameters:
        - name: status
          in: query
          description: 0 待审核 / 1 已上架 / 2 已下架 / 3 已驳回；不传表示全部
          schema: { type: integer, minimum: 0, maximum: 3 }
        - $ref: "./common.yaml#/components/parameters/Page"
        - $ref: "./common.yaml#/components/parameters/PageSize"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "./common.yaml#/components/schemas/PageResult"
                          - type: object
                            properties:
                              list:
                                type: array
                                items: { $ref: "#/components/schemas/ProviderServiceView" }
    post:
      tags: [service]
      summary: 从标准目录勾选服务项并定价
      description: |
        提交后进入**待审核**；运营审核通过即上架。

        两条会被拒绝的规则：
        - **价格必须落在目录项的区间内**，越界返回 90001，`message` 是
          「价格须在¥X-¥Y之间」这句给用户看的话；
        - 该服务项已在列表里 → 40900（**不静默改价**：一次误点的提交不该悄悄改掉线上价格，
          改价有独立接口）。

        未通过入驻审核、被冻结、或资质已全部过期时都不能新增选品（40300）。
      parameters:
        - $ref: "./common.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProviderServiceRequest" }
      responses:
        "200":
          description: 已提交审核
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ProviderServiceView" }
        "400":
          description: 价格格式不对 / 多于两位小数（40001）
        "403":
          description: 未通过入驻审核 / 已冻结 / 资质过期（40300）
        "404":
          description: 目录项不存在或已停用（40400）
        "409":
          description: 该服务项已在你的服务列表里（40900）

  /services/{service_id}:
    put:
      tags: [service]
      summary: 改价（回到待审核）
      description: |
        价格是对外承诺，改了要有人再看一眼：**已上架的服务项改价后立即从前台撤下**，
        直到再审通过。

        服务项不属于当前服务者时返回 40400（与「不存在」同码）。
      parameters:
        - $ref: "#/components/parameters/ServiceId"
        - $ref: "./common.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServicePriceRequest" }
      responses:
        "200":
          description: 已回到待审核
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ProviderServiceView" }
        "403":
          description: 未通过入驻审核 / 已冻结 / 资质过期（40300）
        "404":
          description: 服务项不存在，或不属于当前服务者（40400）

  /services/{service_id}/status:
    put:
      tags: [service]
      summary: 上架 / 下架
      description: |
        上架 **1**、下架 **2**；0（待审核）与 3（已驳回）是审核流程的结果，服务者设不了（40001）。

        上架的前提是**上次审核已通过**（当前状态为「已下架」）：
        - 待审核 → 40300「服务项正在审核中，通过后才能上架」
        - 已驳回 → 40300「服务项已被驳回，请改价后重新提交审核」
        - 已在架 → 40900

        价格没变的「再上架」不需要重审——审核通过之后再走一遍只是把审核员当橡皮图章。
      parameters:
        - $ref: "#/components/parameters/ServiceId"
        - $ref: "./common.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProviderServiceStatusRequest" }
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ProviderServiceView" }
        "400":
          description: 状态不是 1 或 2（40001）
        "403":
          description: 未审核通过就想上架 / 资质过期（40300）
        "404":
          description: 服务项不存在，或不属于当前服务者（40400）
        "409":
          description: 已在架上 / 当前不在架上（40900）

  # ---------- 订单与履约（切片 #77 / #107 / #109；决策见 ADR-0038 / ADR-0040 / ADR-0036 / ADR-0037）----------
  #
  # 这一组的四条口径写在这里，免得每个接口重复一遍：
  #
  #   - **四态 + 取消**（ADR-0038 第一节）：0 待接单 / 1 已预约 / 2 履约中 / 3 已完成 / 4 已取消。
  #     非法迁移一律 **40900**（状态冲突，不是参数错误）；**没有超时自动取消**——
  #     预约时间过了没核销只发提醒，超 24 小时标记异常进看板；
  #   - **核销 ≠ 收款**（ADR-0038 第二节 / ADR-0036）：核销是履约确认，钱在门店直接付给服务者，
  #     平台不经手资金，**没有退款单**；
  #   - **三道照片墙是硬约束**（ADR-0040 第四节）：三个槽位各至少一张才允许报工，由服务端拒绝；
  #   - **谁能调**（ADR-0037 第一节的权限矩阵）：接单 / 核销 / 报工都归「服务者管理员 + 技师」；
  #     运营的干预（接单、取消、清退）走运营后台（admin.yaml），不占这里的接口。
  /orders:
    get:
      tags: [order]
      summary: 本店订单列表（分页 + 筛选 + 核销定位）
      description: |
        只返回**本店**的订单（资源归属校验，别人的一律 40400）。按预约时间 / 下单时间倒序。

        `keyword` 是核销的三个入口之一（ADR-0038 第二节）——门店**不需要扫码枪之类的硬件**，
        输入核销码 / 手机号 / 订单号都能定位订单：
        - **订单号**按包含匹配（用户报单号时常常只报后几位）；
        - **手机号**与 **6 位核销码**按精确匹配（手机号是加密存储 + 等值查询，ADR-0013）。

        **核销码不回给服务者**（列表与详情里都没有 `redeem_code`）：门店凭用户出示的码定位订单，
        不需要知道码本身，这样它更不可能被门店记下来复用。
      parameters:
        - name: status
          in: query
          description: 0 待接单 / 1 已预约 / 2 履约中 / 3 已完成 / 4 已取消；不传表示全部
          schema: { type: integer, minimum: 0, maximum: 4 }
        - name: appointment_date
          in: query
          description: 只看某天要履约的订单（YYYY-MM-DD）；不传表示全部
          schema: { type: string }
        - name: keyword
          in: query
          description: 核销码 / 完整手机号 / 订单号
          schema: { type: string, maxLength: 32 }
        - $ref: "./common.yaml#/components/parameters/Page"
        - $ref: "./common.yaml#/components/parameters/PageSize"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "./common.yaml#/components/schemas/PageResult"
                          - type: object
                            properties:
                              list:
                                type: array
                                items: { $ref: "#/components/schemas/ProviderOrderSummaryView" }
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"

  /orders/{order_id}:
    parameters:
      - $ref: "#/components/parameters/OrderId"
    get:
      tags: [order]
      summary: 订单详情（含照片墙与取消申请）
      description: |
        本店订单的完整视图：预约人与宠物（手机号脱敏）、服务项、金额、所用券、照片墙、
        取消申请，以及状态迁移的时间点（接单 / 核销 / 报工 / 取消）。

        **金额是到店收款的口径**：`estimated_pay_amount`（预估实付）就是用户到店时该收的金额
        （券在门店抵扣），但它**不是平台的收款事实**——平台不经手资金（ADR-0036）。
        界面必须写明「费用在门店直接付给服务者」（ADR-0038 第二节）。
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ProviderOrderView" }
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"

  /orders/{order_id}/accept:
    parameters:
      - $ref: "#/components/parameters/OrderId"
    post:
      tags: [order]
      summary: 接单（待接单 → 已预约）
      description: |
        把订单推进到「已预约」（ADR-0038 第一节）。**只对「待接单」有效**，其他状态一律 40900。

        两条后果要清楚：
        - **接单即承诺**：这个号源被这一单占住，而且**接单之后用户再取消需要门店同意**
          （ADR-0038 第一节的取消规则按阶段分）；
        - 运营的接单干预走运营后台，不占本接口（ADR-0037 第一节的权限矩阵说明）。

        谁能调：服务者管理员 / 技师（ADR-0037 第一节：「接单与派工」）。
      parameters:
        - $ref: "./common.yaml#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: 已接单（返回订单详情）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ProviderOrderView" }
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          description: 订单不在「待接单」（含重复接单）（40900）

  /orders/{order_id}/redeem:
    parameters:
      - $ref: "#/components/parameters/OrderId"
    post:
      tags: [order]
      summary: 核销（履约确认；已预约 → 履约中）
      description: |
        用户到店后确认本次预约已被使用（ADR-0038 第二节）：订单从「已预约」推进到「履约中」，
        本单锁定的券同时转「已核销」。

        **核销 ≠ 收款**（ADR-0036）：核销只是履约确认，费用在门店直接付给服务者；
        信封的 `message` 会带上「本次服务费用请在门店直接付给服务者」这句话，界面必须写明。

        四条不变量：
        - 核销是**原子的条件更新**：并发双击只有一个成功（ADR-0038 第二节）；
        - **订单重复核销 → 40900**（不是幂等成功——第二次核销是状态冲突）；
        - **券的问题按券的码回**（都是 HTTP 200）：本单锁定的券不满足门槛 / 适用范围 / 已过期 →
          业务码 **80001**；券已被核销 → 业务码 **80002**（ADR-0038 第二节给了这两个码真实产出路径）；
        - 订单状态与券的核销在**同一个事务**里：要么都成、要么都不成。

        **核销后不可撤销**：进入「履约中」后既不能取消也不能退回，只能报工完成或由运营干预
        （ADR-0038 第一节：履约中不可取消）。

        谁能调：服务者管理员 / 技师（ADR-0037 第一节：「核销」）。
      parameters:
        - $ref: "./common.yaml#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: 已核销（返回订单详情）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ProviderOrderView" }
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          description: 订单不在「已预约」（含重复核销）（40900）

  /orders/{order_id}/cancel:
    parameters:
      - $ref: "#/components/parameters/OrderId"
    post:
      tags: [order]
      summary: 门店取消订单（含无法履约）
      description: |
        门店侧取消：订单进入「已取消」（ADR-0038 第一节的「已取消」可由用户 / 服务者 / 运营推进），
        号源与锁定的券一并释放。

        `reason` 会展示给用户——**ADR 只对「拒绝用户的取消申请」强制要求理由**（见
        `/orders/{order_id}/cancel/reject`），所以这里是可选的；但用户白跑一趟时，
        他至少该看到为什么。

        阶段限制（ADR-0038 第一节）：**履约中不可取消**（只能报工完成，或由运营干预）→ 40900；
        已完成 / 已取消 → 40900。
        **没有自动取消**：预约时间过了没核销不会自动取消，只给门店发提醒、超 24 小时标记异常
        （自动取消会让用户白跑一趟店）。
        **没有退款单**：钱在门店付，取消不产生任何资金动作（ADR-0036）。

        谁能调：服务者管理员 / 技师。
      parameters:
        - $ref: "./common.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProviderOrderCancelRequest" }
      responses:
        "200":
          description: 已取消（返回订单详情）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ProviderOrderView" }
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          description: 订单已到不可取消的阶段，或已是终态（40900）

  /orders/{order_id}/cancel/approve:
    parameters:
      - $ref: "#/components/parameters/OrderId"
    post:
      tags: [order]
      summary: 同意用户的取消申请
      description: |
        「已预约」阶段用户发起的取消**需要门店同意**（ADR-0038 第一节）——这一条是同意：
        订单转「已取消」，号源与锁定的券释放。

        只有存在**待处理**的取消申请时才有效：没有申请、或已经处理过 → 40900。
        谁能调：服务者管理员 / 技师。
      parameters:
        - $ref: "./common.yaml#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: 已同意（返回订单详情）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ProviderOrderView" }
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          description: 没有待处理的取消申请 / 已处理过（40900）

  /orders/{order_id}/cancel/reject:
    parameters:
      - $ref: "#/components/parameters/OrderId"
    post:
      tags: [order]
      summary: 拒绝用户的取消申请（**必须填理由**）
      description: |
        ADR-0038 第一节点名要求这条：「已预约」阶段用户发起取消需服务者同意，**拒绝要填理由**。
        所以 `reason` **必填**（不填 → 40001），内容会展示给用户。

        拒绝之后订单仍是「已预约」：门店要按约履约。
        只有存在**待处理**的取消申请时才有效：没有申请、或已经处理过 → 40900。
        谁能调：服务者管理员 / 技师。
      parameters:
        - $ref: "./common.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderCancelRejectRequest" }
      responses:
        "200":
          description: 已拒绝（返回订单详情）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ProviderOrderView" }
        "400":
          description: 没填拒绝理由（40001）
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          description: 没有待处理的取消申请 / 已处理过（40900）

  /orders/{order_id}/photo-slots/{slot}:
    parameters:
      - $ref: "#/components/parameters/OrderId"
      - $ref: "#/components/parameters/OrderPhotoSlot"
    put:
      tags: [order]
      summary: 保存一个照片槽位（照片 + 备注）
      description: |
        三道照片墙（ADR-0040 第四节）：**接宠检查 / 服务防护 / 取宠对比**，每槽位可多图 + 备注。
        照片先经 `POST /api/v1/app/files/presign`（`biz_type=care`）拿凭证直传，
        再把 `file_id` 挂到订单上——**字节不经业务接口**（ADR-0020）。

        三条不变量：
        - **整体替换**：`file_ids` 是这一槽位的**全量集合**（传空数组 = 清空该槽位；
          清空之后就不能报工了，`photo_wall.reportable` 会变回 false）；
        - **只在「履约中」可写**（ADR-0040：订单进入履约中后开放）：待接单 / 已预约 / 已完成 /
          已取消 → 40900；
        - **照片归属订单**：`file_id` 不存在、不属于本店与本订单 → 40400。服务留痕照片
          **不进用户的档案照片墙**（ADR-0040 第四节 / ADR-0030）。

        取宠对比（`slot=3`）只做**左右并排展示**，不做自动图像对比——我们没有那个能力，不假装有（ADR-0040）。
        单槽位最多 9 张（docs/conventions.md 的图片规格）。

        **（待澄清：报工之后能否再改照片 / 备注——ADR 未定。本契约按「已完成不可改」的最保守形态写，
        要改只能走运营干预。）**
      parameters:
        - $ref: "./common.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderPhotoSlotRequest" }
      responses:
        "200":
          description: 保存成功（返回更新后的整个照片墙）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/OrderPhotoWallView" }
        "400":
          description: 照片超过 9 张 / 同一个 file_id 传了两次（40001）
        "404":
          description: 订单不属于本店 / file_id 不存在或不属于本订单（40400）
        "409":
          description: 订单不在「履约中」（40900）

  /orders/{order_id}/report:
    parameters:
      - $ref: "#/components/parameters/OrderId"
    post:
      tags: [order]
      summary: 报工提交（履约中 → 已完成）
      description: |
        提交即完成服务：订单从「履约中」推进到「已完成」（ADR-0038 第一节）。

        **三道照片墙是硬约束**（ADR-0040 第四节 / 交付文档 2.5 的验收标准「缺一道则系统拒绝报工」）：
        三个槽位各至少一张照片才允许提交，而且**由服务端拒绝**——前端把按钮禁掉不算数。
        被拒时必须说清**缺哪一道**（不能只说「报工失败」）：客户端从订单详情的
        `photo_wall.missing_slots` 取，`message` 里也会点名。

        谁能调：服务者管理员 / 技师（ADR-0037 第一节：「报工（三道照片墙）」）。

        **（待澄清：报工的时间戳来源——「平均服务时长」要由报工的时间戳算出来（ADR-0039 第二节），
        但 ADR 没说这两个时间戳是服务者手填、还是由核销与报工两个时刻自动记，所以本契约只收 `remark`。
        另：报工后能否修改照片 / 备注，见照片槽位接口的待澄清。）**
      parameters:
        - $ref: "./common.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderReportRequest" }
      responses:
        "200":
          description: 已报工（订单转「已完成」，返回订单详情）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ProviderOrderView" }
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          description: |
            订单不在「履约中」，或**三个槽位没有各至少一张照片**（40900）。
            后者要在 `message` 里点名缺哪一道

  # ---- 文件（服务留痕照片的直传入口）----
  #
  # 为什么服务者需要**自己的**一条 files 路径：`JwtAuthenticationFilter` 按路径前缀判登录域
  # （ADR-0012），`/api/v1/app/files/**` 只认 C 端令牌——服务者令牌打过去等于没登录（40100）。
  # 三道照片墙的 `file_id` 必须由**门店自己的令牌**换出来，否则「谁上传的这张图」就无从谈起。
  # 协议形态与 `app.yaml` 的 `/files/presign` 完全一致（ADR-0020 的预签名直传），
  # 消费方只是换成了服务者后台。
  /files/presign:
    post:
      tags: [file]
      summary: 申请上传凭证（服务留痕照片 / 资质材料图）
      description: |
        服务者侧传图的第一步：一次最多 9 张，返回每个文件的直传地址（含签名与有效期），
        浏览器把字节直接 PUT 到那里（`/api/v1/open/files/{id}/content`），**不经业务接口**。
        上传完成后用返回的 `file_id` 挂到业务上——两种用途各挂一处：

        - `care`（服务留痕）：挂到订单的照片槽位（`PUT /orders/{order_id}/photo-slots/{slot}`）；
        - `qualification`（资质材料）：挂到资质材料上（入驻申请 / `PUT /profile/qualifications`）。

        与 C 端的区别只有一处：这里的 `biz_type` **只收 `care` 与 `qualification`**。
        打卡 / 防疫 / 档案照片 / 咨询图都是用户自己的照片，不该由门店的手上传；
        契约收窄，服务端照此拒绝（其余用途 → 40001）。

        `pet_id` 只有 `care` 要传（照片墙要求「照片是这只宠物的」，而文件域自己判不了这件事
        ——宠物不是文件模块的表，所以由订单侧在挂载时校验，ADR-0040 / ADR-0048）；
        `qualification` 不关联宠物，留空。
        声明的 `mime` 与 `size_bytes` 只用于提前拦截；落库以魔数判定与实际字节数为准（ADR-0020）。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FilePresignRequest" }
      responses:
        "200":
          description: 每个文件一条凭证
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/FilePresignView" }

  /coupon-pool/templates:
    get:
      tags: [coupon]
      summary: 券池里可以贡献的券模板（只有服务者成本的券）
      description: |
        **服务者不能自建券**：券模板由平台创建（[ADR-0037](../docs/adr/0037-roles-console-boundary-coupon-pool.md)），
        服务者只能从池子里挑一个并承诺「我店愿意接多少张」。

        这里**只列 `cost_bearer = 1`（服务者成本）且启用中的模板**：平台补贴券的成本归平台，
        服务者既不需要、也不允许为它承诺额度（否则等于把平台的补贴记在服务者账上）。
        模板的适用范围与面额都随模板一起给出——服务者承诺之前要先看得见自己承诺的是什么。
      parameters:
        - name: keyword
          in: query
          description: 按券名模糊匹配，最长 64 字符
          schema: { type: string, maxLength: 64 }
        - $ref: "./common.yaml#/components/parameters/Page"
        - $ref: "./common.yaml#/components/parameters/PageSize"
      responses:
        "200":
          description: 成功（按更新时间倒序）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "./common.yaml#/components/schemas/PageResult"
                          - type: object
                            properties:
                              list:
                                type: array
                                items: { $ref: "#/components/schemas/CouponTemplateView" }

  /coupon-contributions:
    get:
      tags: [coupon]
      summary: 我的券贡献（含核销统计）
      description: |
        每一行都带着额度账：`total_count`（承诺额度）、`issued_count`（已发放）、
        `redeemed_count`（已核销）、`reserved_count`（占用中：已发放未核销未过期）、
        `expired_count`（已过期未核销）、`available_count`（还可发放）。

        口径（ADR-0037 第三节）：**可发放 = 承诺额度 − 已核销 − 占用中**；
        过期未核销的券**释放额度回池**（`available_count` 因此回升），已核销不释放。
        对账恒等式：`issued_count = redeemed_count + reserved_count + expired_count`。

        `completion_rate`（已核销 ÷ 承诺额度）是考核「券」那一项要用的数据口径
        （[ADR-0039](../docs/adr/0039-invite-review-assessment-analytics.md) 第三节），
        **考核本身不在本切片**——这里只提供数。
      parameters:
        - name: status
          in: query
          description: 1 生效中 / 2 已停止发放；不传表示全部
          schema: { type: integer, minimum: 1, maximum: 2 }
        - $ref: "./common.yaml#/components/parameters/Page"
        - $ref: "./common.yaml#/components/parameters/PageSize"
      responses:
        "200":
          description: 成功（按更新时间倒序）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "./common.yaml#/components/schemas/PageResult"
                          - type: object
                            properties:
                              list:
                                type: array
                                items: { $ref: "#/components/schemas/CouponContributionView" }
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
    post:
      tags: [coupon]
      summary: 从券池选券并承诺可核销额度
      description: |
        **这是承诺不是发放**：承诺的是「我店愿意接多少张」（ADR-0037 第三节），
        券什么时候发给谁是平台的事（任务 / 邀请 / 积分兑换 / 平台补贴定向触发，不做抢券）。

        三条会被拒绝的规则：
        - 模板不存在、已停用、或是平台补贴券 → 40400（**平台补贴券不能贡献**，
          对服务者来说它等于不存在）；
        - 该模板已有贡献记录（含已停止发放的）→ 40900，调整用 `PUT`、重新启用用 `PUT`
          把 `status` 写回 1，**不新建第二条**：一个服务者对一个模板只留一条额度账；
        - `total_count` 不是正整数 → 40001。

        承诺之后可发放额度立刻可用（`available_count = total_count`）。
      parameters:
        - $ref: "./common.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CouponContributionRequest" }
      responses:
        "200":
          description: 已承诺，返回该条贡献的额度账
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/CouponContributionView" }
        "400":
          description: 额度不是正整数（40001）
        "403":
          description: 入驻未通过 / 已冻结（40300）
        "404":
          description: 模板不存在、已停用、或不是服务者成本券（40400）
        "409":
          description: 该模板已有贡献记录（40900）

  /coupon-contributions/{contribution_id}:
    get:
      tags: [coupon]
      summary: 券贡献详情（含额度流水）
      description: |
        比列表多出 `remark` 与 `logs`（额度流水，append-only：承诺 / 调整额度 / 撤回 /
        过期释放，每条带操作者与原因）。**额度是怎么变的必须查得出来**——
        服务者问「我的额度去哪了」时，答案在流水里而不是在结果数里。
      parameters:
        - $ref: "#/components/parameters/ContributionId"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/CouponContributionView" }
        "404":
          description: 贡献不存在，或不属于当前服务者（40400）
    put:
      tags: [coupon]
      summary: 调整承诺额度（或重新启用已停止的那条）
      description: |
        **调不下去的部分不能收回**：`total_count` 必须 ≥ 已核销 + 占用中。
        「占用中」是已经发到用户手里的券——服务者反悔不能让用户的券失效，
        平台已经答应过用户的事不能再改。

        `status` 传 1 可以让「已停止发放」的那条重新生效（配合新的额度），
        传 2 等于撤回（等价于 `DELETE`），不传则只改额度、保持不变。
      parameters:
        - $ref: "#/components/parameters/ContributionId"
        - $ref: "./common.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CouponContributionRequest" }
      responses:
        "200":
          description: 更新后的额度账
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/CouponContributionView" }
        "400":
          description: 额度不是正整数 / 低于已核销加占用中 / status 不是 1 或 2（40001）
        "404":
          description: 贡献不存在，或不属于当前服务者（40400）
    delete:
      tags: [coupon]
      summary: 撤回未发放的额度
      description: |
        **只收回还没发出去的那部分**：`total_count` 夹到「已核销 + 占用中」，即
        可发放额度归零；已经发到用户手里的券照常有效、照常能核销（用户的券不是服务者的
        可撤销承诺）。该条状态转为「已停止发放」，之后可以用 `PUT` 重新启用。

        属于「自带状态」的幂等：重复撤回返回同样的结果（已是 0 就再夹一次 0），
        **不返回 404** —— 撤回的目标是这个服务者自己的那条记录，重复点两下不该报错。
      parameters:
        - $ref: "#/components/parameters/ContributionId"
        - $ref: "./common.yaml#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: 撤回后的额度账（status=2 已停止发放）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/CouponContributionView" }
        "404":
          description: 贡献不存在，或不属于当前服务者（40400）

  /coupon-contributions/{contribution_id}/coupons:
    get:
      tags: [coupon]
      summary: 本店贡献券的发放与核销明细
      description: |
        服务者的「对账视图」（ADR-0036 之后没有余额与提现，结算中心退化为流水与核销明细）：
        哪些券发出去了、哪张已经在本店核销、哪张过期作废。

        **不返回领券人的身份信息**（只有 `user_id`）：服务者需要知道「有多少券核销了」，
        不需要知道「谁领的」——用户身份不在服务者的可见范围内。
      parameters:
        - $ref: "#/components/parameters/ContributionId"
        - name: status
          in: query
          description: 1 待使用 / 2 已锁定 / 3 已核销 / 4 已过期；不传表示全部
          schema: { type: integer, minimum: 1, maximum: 4 }
        - $ref: "./common.yaml#/components/parameters/Page"
        - $ref: "./common.yaml#/components/parameters/PageSize"
      responses:
        "200":
          description: 成功（按发放时间倒序）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "./common.yaml#/components/schemas/PageResult"
                          - type: object
                            properties:
                              list:
                                type: array
                                items: { $ref: "#/components/schemas/CouponView" }
        "404":
          description: 贡献不存在，或不属于当前服务者（40400）

  # ---------- 月度考核（F022；决策见 ADR-0039 第三节 / ADR-0050 第四节 / ADR-0052）----------
  #
  # 三条口径写在这里，免得两个接口各说一遍：
  #
  #   - **总分 = 拉新 40% + 券 40% + 过程 20%**（权重可配，ADR-0010 的业务可调项那一层）；
  #   - **缺项两种口径**（ADR-0050 第四节）：该做而没做 → 记 0 分；平台侧无该维度要求 →
  #     该项不参与、权重按参与项重算，明细里注明「未参与」与原因；
  #   - **服务者只看自己的**：别人的账期一律 40400（与「不存在」同码，docs/conventions.md）。
  #
  # 明细里的 `items` 把三项与过程分的五个子项一起给出，`participated=false` 的那些**照样出现**
  # （它们正是「为什么这个分是这么算出来的」的答案）。
  /assessments:
    get:
      tags: [assessment]
      summary: 我的月度考核列表
      description: |
        每月 1 日算上月（ADR-0039 第三节），按账期倒序。还没算到的账期不会出现在列表里。

        服务者可以按账期查某一期（`period` 形如 `2026-08`），也可以翻全部历史做跨月对比。
      parameters:
        - name: period
          in: query
          description: 只查某一个账期（yyyy-MM）；不传表示全部
          schema: { type: string }
        - $ref: "./common.yaml#/components/parameters/Page"
        - $ref: "./common.yaml#/components/parameters/PageSize"
      responses:
        "200":
          description: 成功（按账期倒序）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "./common.yaml#/components/schemas/PageResult"
                          - type: object
                            properties:
                              list:
                                type: array
                                items: { $ref: "#/components/schemas/AssessmentSummaryView" }
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"

  /assessments/{period}:
    get:
      tags: [assessment]
      summary: 某月考核明细（每项得分、是否参与、数据来源）
      description: |
        一期一条：总分、等级、AI 推荐优先级，加上 `items`（三项 + 过程子项，每项带
        `score` / `participated` / `data_source` / `note`）与 `overrides`（被覆盖过的留痕）。

        **覆盖留痕对服务者可见**（谁、何时、改成多少、为什么）：ADR-0039 第三节说得很直白——
        覆盖必须留痕，否则算法是黑箱、服务者无法申诉。`calculated_score` 是算法算出来的原值，
        `score` 是当前生效值（没被覆盖时两者相同）。

        该账期还没有考核记录 → 40400（与「不是你的账期」同码）。
      parameters:
        - $ref: "#/components/parameters/Period"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AssessmentView" }
        "404":
          description: 该账期没有考核记录，或不属于当前服务者（40400）

  /invite-code:
    get:
      tags: [invite]
      summary: 我的门店推广码与拉新战况
      description: |
        **还没生成过时 `code` 为 null**（不是 404）——那是正常状态，前端据此显示「生成推广码」。
        GET **不写库**：一个会写库的 GET 是最容易被误触的接口形态（预取、重试、浏览器预读都会命中）。

        三个计数是**累计**的：`effective_invites`（有效，考核取数的同一口径）、
        `pending_invites`（还在 24 小时观察窗里）、`invalid_invites`（观察窗内无行为被判掉）。
        三者之和 = 扫过这个码注册的人数。
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ProviderInviteCodeView" }
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
    post:
      tags: [invite]
      summary: 生成门店推广码（幂等）
      description: |
        第一次调用生成码，之后每次调用都返回**同一个码**（一店一码由唯一键兜底，并发取码也只有一个赢家）。

        **只有门店管理员能取**：它是门店的对外物料，技师不能替门店承诺拉新（与券贡献同一道门禁）。
        当前账号还没有绑定门店时 40400。
      responses:
        "200":
          description: 成功（新建或取回已有的码）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ProviderInviteCodeView" }
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "404":
          description: 当前账号还没有绑定的门店，或不是该门店的管理员（40400）

components:
  parameters:
    ApplicationId:
      name: application_id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    RequestId:
      name: request_id
      in: path
      required: true
      description: 提案 id
      schema: { type: integer, format: int64 }
    ServiceId:
      name: service_id
      in: path
      required: true
      description: 服务者服务项 id
      schema: { type: integer, format: int64 }
    ContributionId:
      name: contribution_id
      in: path
      required: true
      description: 券贡献 id（服务者选券并承诺额度后产生的那一条额度账）
      schema: { type: integer, format: int64 }
    OrderId:
      name: order_id
      in: path
      required: true
      description: 订单 id
      schema: { type: integer, format: int64 }
    OrderPhotoSlot:
      name: slot
      in: path
      required: true
      description: 照片槽位：1 接宠检查 / 2 服务防护 / 3 取宠对比（ADR-0040 第四节）
      schema: { type: integer, minimum: 1, maximum: 3 }
    Period:
      name: period
      in: path
      required: true
      description: 考核账期（yyyy-MM，如 2026-08）
      schema: { type: string, maxLength: 7 }

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ServiceCategoryView:
      type: object
      description: 标准目录分类（一级）
      properties:
        id: { type: integer, format: int64 }
        code: { type: string, description: 分类编码（HOSPITAL / GROOMING / …） }
        item_code_prefix: { type: string, description: 该项目编码的前两位（HE / GR / SP …） }
        name: { type: string }
        icon: { type: string, description: 图标标识；配色与形状以视觉稿为准（ADR-0008） }
        description: { type: string }
        sort_order: { type: integer }
        status: { type: integer, description: 1 启用 / 0 停用 }
        item_count: { type: integer, description: 该分类下**启用**的目录项数 }
        updated_at: { type: string, description: "yyyy-MM-dd HH:mm:ss（东八区）" }

    ServiceItemView:
      type: object
      description: 标准目录项（二级，含价格区间）
      properties:
        id: { type: integer, format: int64 }
        code: { type: string, description: 目录项编码（形如 HE-001）；**发布后不可改、不可复用** }
        category_code: { type: string }
        category_name: { type: string }
        name: { type: string }
        price_min: { type: string, description: 价格区间下限（元，两位小数字符串） }
        price_max: { type: string, description: 价格区间上限（元，两位小数字符串） }
        price_unit: { type: string, description: 计价单位（次 / 只 / 天 / 课时 / 件） }
        duration_minutes: { type: integer, nullable: true }
        applicable_pets: { type: integer, description: 1 犬 / 2 猫 / 3 犬猫 }
        description: { type: string }
        sort_order: { type: integer }
        status: { type: integer, description: 1 启用 / 0 停用 }
        updated_at: { type: string, description: "yyyy-MM-dd HH:mm:ss" }

    ProviderInviteCodeView:
      type: object
      description: 门店推广码与拉新战况；`code` 为 null 表示还没生成过（不是错误）
      properties:
        code: { type: string, nullable: true, description: "形如 PVXXXXXXXX（前缀 PV + 8 位，与用户邀请码的 8 位不同长）" }
        status: { type: integer, nullable: true, description: 1 启用 / 0 停用；没有码时为 null }
        created_at: { type: string, nullable: true }
        effective_invites: { type: integer, format: int64, description: 有效邀请数（完成建档 + 观察期内有行为），**累计**；考核的拉新项取的就是这个口径 }
        pending_invites: { type: integer, format: int64, description: 还在 24 小时观察窗里的条数 }
        invalid_invites: { type: integer, format: int64, description: 被判无效（观察窗内无行为）的条数 }

    ProviderProfileView:
      type: object
      description: 服务者（门店）信息；`phone` 是脱敏值（ADR-0013）
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        type: { type: integer, description: 1 医院 / 2 洗护 / 3 训犬 / 4 寄养上门 / 5 食品用品 / 6 间接服务 }
        category: { type: integer, description: 联盟分类维度取值（`provider_alliance_category.id`）。种子三档是 1 直接同业 / 2 直接异业 / 3 间接异业，但**值域由运营维护**，不要在前端写死这三档 }
        category_name: { type: string, nullable: true, description: 联盟分类名。**维度查不到时为 null**——前端不要用本地标签表兜底，那会让「运营改了维度名」在页面上看不见 }
        logo: { type: string, nullable: true }
        intro: { type: string, nullable: true }
        address: { type: string }
        lng: { type: string, nullable: true }
        lat: { type: string, nullable: true }
        phone: { type: string, description: 门店联系电话（脱敏） }
        business_hours:
          type: array
          items: { $ref: "#/components/schemas/BusinessHour" }
        status: { type: integer, description: 0 待审核 / 1 正常 / 2 驳回 / 3 冻结 }
        level: { type: integer, description: 1 基础 / 2 优选 / 3 战略合作。**月度考核（F022）算完会写回这里**（最近一期的等级）；还没算过则是 1 }
        recommend_priority: { type: integer, description: 1 最高 / 2 较高 / 3 普通。**V45 起由考核按等级档位写回**（档位映射在运营后台可改），C 端找店按它排序；还没算过考核则是 3（普通，与 level 默认的「基础」同档） }
        region_code: { type: string, nullable: true, description: "区域编码（运营维护，见 admin.yaml 的 `/providers/{provider_id}/region`）。**它现在是「可筛选」，不是「已被保护」**：排他性的区域保护规则（谁在哪个区独占、独占多久、冲突怎么判）仍未定" }
        monthly_score: { type: string, description: 月度考核分（最近一期的总分，两位小数字符串）；还没算过则是 "0.00" }
        rating: { type: string, description: 评分（门店所有评价的**平均分**，一位小数）。评价由 C 端用户在订单完成后提交（C 端的「评价晒单」接口），**没有评价的店是数据库默认值 5.0**——它不代表「满分好评」，服务者后台展示时要与评价条数一起看（评价条数在 C 端的「某门店的评价列表」接口里） }
        approved_at: { type: string, nullable: true }
        created_at: { type: string }
        updated_at: { type: string }

    ProviderProfileRequest:
      type: object
      required: [name, address, phone]
      properties:
        name: { type: string, maxLength: 256 }
        logo: { type: string, maxLength: 512, nullable: true }
        intro: { type: string, maxLength: 1024, nullable: true }
        address: { type: string, maxLength: 512 }
        lng: { type: string, nullable: true }
        lat: { type: string, nullable: true }
        phone: { type: string, description: 手机号或带区号的固定电话 }

    BusinessHour:
      type: object
      description: 一天营业时段；数组里没有的星期几就是休息
      required: [day_of_week, open_time, close_time]
      properties:
        day_of_week: { type: integer, minimum: 1, maximum: 7, description: 1 周一 … 7 周日 }
        open_time: { type: string, description: "HH:mm" }
        close_time: { type: string, description: "HH:mm（必须晚于 open_time；跨天不支持）" }

    BusinessHoursRequest:
      type: object
      properties:
        hours:
          type: array
          maxItems: 7
          description: 空数组表示整周休息（不是「不改」）
          items: { $ref: "#/components/schemas/BusinessHour" }

    ProviderQualificationView:
      type: object
      description: |
        资质材料（`cert_no` 是脱敏值）。
        **图片是「存 id、读时签发」**：库里只有 `file_id`，`file_url` 是后端当场签发的短时读地址
        （ADR-0020 / ADR-0053）——所以它每次请求都可能不同，**不要缓存它**，也不要把它回传给
        `ProviderQualificationRequest`（那边要的是 `file_id`）。
      properties:
        id: { type: integer, format: int64 }
        type: { type: integer, description: 1 营业执照 / 2 执业许可证 / 3 法人身份证 / 4 训犬师认证 / 5 健康证 / 6 其他 }
        name: { type: string }
        cert_no: { type: string, nullable: true, description: 证件号（脱敏，如 9133**********1234） }
        file_id: { type: integer, format: int64, nullable: true, description: 材料图片的文件 id；「整体替换」时要原样带回来才能保住这张图 }
        file_url: { type: string, nullable: true, description: 材料图片的**签名读地址**（服务端当场签发，有有效期）；为空表示这份材料没传图 }
        valid_from: { type: string, nullable: true, description: yyyy-MM-dd }
        valid_until: { type: string, nullable: true, description: 到期日；为空表示长期有效 }
        status: { type: integer, description: 0 待审 / 1 通过 / 2 驳回 }
        review_remark: { type: string, nullable: true }

    ProviderQualificationRequest:
      type: object
      description: |
        一份资质材料。**`file_id` 必填**（ADR-0053）：材料的图是审核的依据，没有图审核员无从判断，
        所以不带图直接 40001。

        `file_id` 由 `POST /api/v1/provider/files/presign`（`biz_type=qualification`）换出来，
        上传完成后把 ID 填进来；**字节不经业务接口**（ADR-0020）。
      required: [type, file_id]
      properties:
        type: { type: integer, description: 1 营业执照 / 2 执业许可证 / 3 法人身份证 / 4 训犬师认证 / 5 健康证 / 6 其他 }
        name: { type: string, maxLength: 128, description: 材料名称，如「动物诊疗许可证」 }
        cert_no: { type: string, maxLength: 64, nullable: true, description: 证件号明文（服务端加密存密文 + HMAC 查找列） }
        file_id:
          type: integer
          format: int64
          description: 材料图片的文件 id（`biz_type=qualification` 上传所得）。**必填**——没有图不能提交
        valid_from: { type: string, nullable: true, description: yyyy-MM-dd }
        valid_until: { type: string, nullable: true, description: yyyy-MM-dd；为空表示长期有效 }

    ProviderQualificationsRequest:
      type: object
      required: [qualifications]
      properties:
        qualifications:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: "#/components/schemas/ProviderQualificationRequest" }

    OnboardingApplicationRequest:
      type: object
      description: 提交 / 重提入驻申请（整体覆盖）
      required: [name, type, address, contact_phone, applicant_name, qualifications]
      properties:
        name: { type: string, maxLength: 256 }
        type: { type: integer, minimum: 1, maximum: 6, description: 1 医院 / 2 洗护 / 3 训犬 / 4 寄养上门 / 5 食品用品 / 6 间接服务 }
        category: { type: integer, minimum: 1, description: "联盟分类维度取值（`provider_alliance_category.id`）。**必须是一档启用中的维度**，由服务端查表校验（不在此处限制范围，运营新增维度后无需改契约）；不传则归到顺序最小的启用维度" }
        logo: { type: string, maxLength: 512, nullable: true }
        intro: { type: string, maxLength: 1024, nullable: true }
        address: { type: string, maxLength: 512 }
        lng: { type: string, nullable: true, description: 经度；与 lat 要么都给要么都不给 }
        lat: { type: string, nullable: true, description: 纬度 }
        contact_phone: { type: string, description: 联系电话（手机号或带区号固定电话） }
        applicant_name: { type: string, maxLength: 64 }
        qualifications:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: "#/components/schemas/ProviderQualificationRequest" }

    OnboardingApplicationSummary:
      type: object
      properties:
        id: { type: integer, format: int64 }
        provider_id: { type: integer, format: int64 }
        provider_name: { type: string }
        provider_type: { type: integer }
        applicant_user_id: { type: integer, format: int64 }
        applicant_name: { type: string }
        contact_phone: { type: string, description: 脱敏 }
        status: { type: integer, description: 0 待审核 / 1 通过 / 2 驳回 }
        reject_reason: { type: string, nullable: true }
        submit_count: { type: integer, description: 提交次数（驳回后每次重提 +1） }
        submitted_at: { type: string }
        reviewed_at: { type: string, nullable: true }

    OnboardingApplicationView:
      type: object
      description: 申请详情：比列表行多出门店全貌、资质材料与审核流水
      properties:
        id: { type: integer, format: int64 }
        status: { type: integer, description: 0 待审核 / 1 通过 / 2 驳回 }
        reject_reason: { type: string, nullable: true }
        review_remark: { type: string, nullable: true }
        submit_count: { type: integer }
        submitted_at: { type: string }
        reviewed_at: { type: string, nullable: true }
        reviewer_id: { type: integer, format: int64, nullable: true }
        applicant_user_id: { type: integer, format: int64 }
        applicant_name: { type: string }
        contact_phone: { type: string, description: 脱敏 }
        provider: { $ref: "#/components/schemas/ProviderProfileView" }
        qualifications:
          type: array
          items: { $ref: "#/components/schemas/ProviderQualificationView" }
        review_logs:
          type: array
          description: 审核流水（append-only，含每一次重提）
          items: { $ref: "#/components/schemas/ReviewLogView" }

    ReviewLogView:
      type: object
      properties:
        id: { type: integer, format: int64 }
        target_type: { type: integer, description: 1 入驻申请 / 2 服务上架审核 / 3 目录外提案 / 4 服务者状态变更 }
        action: { type: integer, description: 1 提交 / 2 重提 / 3 通过 / 4 驳回 / 5 上架 / 6 下架 / 7 冻结 / 8 解冻 }
        actor_id: { type: integer, format: int64, description: 操作者 id；0 表示系统写入 }
        actor_domain: { type: string, description: provider / admin；定时任务留空 }
        remark: { type: string, nullable: true, description: 驳回原因或审核意见 }
        created_at: { type: string }

    ProviderServiceView:
      type: object
      description: 服务者上架的服务项；名称与区间来自标准目录（现取，不是快照）
      properties:
        id: { type: integer, format: int64 }
        provider_id: { type: integer, format: int64 }
        provider_name: { type: string, nullable: true, description: 只在运营审核队列里有值 }
        service_code: { type: string }
        service_name: { type: string, nullable: true, description: 目录项名称；目录项被删时为空 }
        category_code: { type: string, nullable: true }
        category_name: { type: string, nullable: true }
        price: { type: string, description: 服务者定价（元，两位小数字符串） }
        price_unit: { type: string, nullable: true }
        price_min: { type: string, nullable: true, description: 目录项当前区间下限 }
        price_max: { type: string, nullable: true, description: 目录项当前区间上限 }
        status: { type: integer, description: 0 待审核 / 1 已上架 / 2 已下架 / 3 已驳回 }
        reject_reason: { type: string, nullable: true }
        submitted_at: { type: string, nullable: true }
        reviewed_at: { type: string, nullable: true }
        updated_at: { type: string }

    ProviderServiceRequest:
      type: object
      required: [service_code, price]
      properties:
        service_code: { type: string, description: 目录项编码（形如 HE-001） }
        price: { type: string, description: 定价，最多两位小数且必须大于 0（免费体验用券表达） }

    ServicePriceRequest:
      type: object
      required: [price]
      properties:
        price: { type: string }

    ProviderServiceStatusRequest:
      type: object
      required: [status]
      properties:
        status: { type: integer, description: 1 上架 / 2 下架 }

    CatalogItemProposalRequest:
      type: object
      required: [category_code, name, price_min, price_max]
      properties:
        category_code: { type: string, maxLength: 32 }
        name: { type: string, maxLength: 128 }
        description: { type: string, maxLength: 512, nullable: true }
        price_min: { type: string, description: 建议区间下限（运营可改） }
        price_max: { type: string, description: 建议区间上限（运营可改） }
        price_unit: { type: string, description: 计价单位，默认「次」 }

    CatalogItemProposalSummary:
      type: object
      properties:
        id: { type: integer, format: int64 }
        provider_id: { type: integer, format: int64 }
        provider_name: { type: string }
        category_code: { type: string }
        category_name: { type: string, nullable: true }
        name: { type: string }
        suggested_price_min: { type: string }
        suggested_price_max: { type: string }
        suggested_price_unit: { type: string }
        status: { type: integer, description: 0 待审核 / 1 通过 / 2 驳回 }
        reject_reason: { type: string, nullable: true }
        item_code: { type: string, nullable: true, description: 通过后生成的正式目录项编码 }
        submitted_at: { type: string }
        reviewed_at: { type: string, nullable: true }

    CatalogItemProposalView:
      type: object
      properties:
        id: { type: integer, format: int64 }
        provider_id: { type: integer, format: int64 }
        provider_name: { type: string }
        category_code: { type: string }
        category_name: { type: string, nullable: true }
        name: { type: string }
        description: { type: string, nullable: true }
        suggested_price_min: { type: string }
        suggested_price_max: { type: string }
        suggested_price_unit: { type: string }
        status: { type: integer }
        reject_reason: { type: string, nullable: true }
        item_code: { type: string, nullable: true }
        review_remark: { type: string, nullable: true }
        submitted_at: { type: string }
        reviewed_at: { type: string, nullable: true }
        reviewer_id: { type: integer, format: int64, nullable: true }
        review_logs:
          type: array
          items: { $ref: "#/components/schemas/ReviewLogView" }

    CouponTemplateView:
      type: object
      description: 券模板（平台定义的那一种券）；服务者侧只出现服务者成本券
      properties:
        id: { type: integer, format: int64 }
        code: { type: string, description: 模板编码（形如 CP-001）；**创建后不可改** }
        name: { type: string, description: 券名，如「基础体检立减 30 元」 }
        face_value: { type: string, description: 抵扣面额（元，两位小数字符串） }
        min_amount: { type: string, description: 使用门槛：订单总额不低于它才可用（0.00 表示无门槛） }
        valid_days: { type: integer, description: 有效期：自发放之日起 N 天内有效（到期未用即失效） }
        cost_bearer: { type: integer, description: 1 服务者成本 / 2 平台补贴；**只影响核销统计与考核，不产生资金**（ADR-0036） }
        scope_type: { type: integer, description: 0 不限 / 1 限服务分类 / 2 限目录项 }
        scope_codes:
          type: array
          description: 适用范围编码（分类编码或目录项编码）；scope_type=0 时为空
          items: { type: string }
        scope_desc: { type: string, description: 适用范围的现成文案（如「限分类：医院、洗护美容」），由服务端拼好 }
        issue_limit: { type: integer, nullable: true, description: 平台补贴券的发放上限；为空表示不限（服务者成本券恒为空） }
        issued_count: { type: integer, description: 该模板**全平台**已发放张数（券池里的热度，不是本店的数） }
        status: { type: integer, description: 1 启用 / 0 停用 }
        description: { type: string, nullable: true }
        created_at: { type: string }
        updated_at: { type: string }

    CouponContributionView:
      type: object
      description: |
        服务者的券贡献：从券池选一个模板并承诺可核销额度。**列表与详情共用同一形状**，
        `logs` 只在详情里有值（列表不点开就看不到流水）。
      properties:
        id: { type: integer, format: int64 }
        provider_id: { type: integer, format: int64 }
        provider_name: { type: string, nullable: true, description: 只在运营侧有值 }
        template_id: { type: integer, format: int64 }
        template_code: { type: string }
        template_name: { type: string }
        face_value: { type: string }
        min_amount: { type: string }
        scope_desc: { type: string }
        total_count: { type: integer, description: 承诺的可核销额度 }
        issued_count: { type: integer, description: 已发放（= 已核销 + 占用中 + 已过期未核销） }
        redeemed_count: { type: integer, description: 已核销 }
        reserved_count: { type: integer, description: 占用中：已发放、未核销、未过期 }
        expired_count: { type: integer, description: 已过期未核销（额度已释放回池） }
        available_count: { type: integer, description: 还可发放 = 承诺额度 − 已核销 − 占用中 }
        completion_rate: { type: string, description: 完成率 = 已核销 ÷ 承诺额度（两位小数字符串）；考核「券」那一项的数据口径 }
        status: { type: integer, description: 1 生效中 / 2 已停止发放 }
        remark: { type: string, nullable: true }
        logs:
          type: array
          nullable: true
          description: 额度流水（只在详情里返回）
          items: { $ref: "#/components/schemas/CouponContributionLogView" }
        created_at: { type: string }
        updated_at: { type: string }

    CouponContributionRequest:
      type: object
      required: [template_id, total_count]
      properties:
        template_id: { type: integer, format: int64, description: 券模板 id（须是启用中的服务者成本券） }
        total_count: { type: integer, description: 承诺的可核销额度（正整数；调整时不得低于已核销加占用中） }
        status: { type: integer, description: 1 生效中 / 2 已停止发放；不传则保持不变（`POST` 时按 1 处理） }
        remark: { type: string, maxLength: 255, nullable: true, description: 承诺或调整的说明，进额度流水 }

    CouponContributionLogView:
      type: object
      description: 额度流水（append-only）
      properties:
        id: { type: integer, format: int64 }
        action: { type: integer, description: 1 承诺 / 2 调整额度 / 3 撤回 / 4 过期释放 }
        total_count: { type: integer, description: 本次动作后的承诺额度 }
        remark: { type: string, nullable: true }
        operator_id: { type: integer, format: int64, description: 操作者 id；0 表示系统写入（如过期释放） }
        created_at: { type: string }

    CouponView:
      type: object
      description: 券实例（发给某个用户的那一张）；**服务者侧不返回领券人身份，只有 user_id**
      properties:
        id: { type: integer, format: int64 }
        code: { type: string, description: 券码（运营与客服排查用，不是安全凭证） }
        user_id: { type: integer, format: int64 }
        provider_id: { type: integer, format: int64, nullable: true, description: 服务者贡献券的核销门店；平台补贴券为空（按模板适用范围核销） }
        provider_name: { type: string, nullable: true, description: 核销门店名称；**只在运营侧有值**（服务者看自己的券不需要自己的名字） }
        template_id: { type: integer, format: int64 }
        template_code: { type: string }
        template_name: { type: string }
        face_value: { type: string, description: 面额快照：模板后来改了面额，已发的券不受影响 }
        min_amount: { type: string }
        source: { type: integer, description: 1 邀请 / 2 打卡任务 / 3 积分兑换 / 4 平台补贴 / 5 月度阶梯 }
        contribution_id: { type: integer, format: int64, nullable: true, description: 占用了哪条服务者贡献；平台补贴券为空 }
        status: { type: integer, description: 1 待使用 / 2 已锁定（下单占用）/ 3 已核销 / 4 已过期 }
        valid_from: { type: string }
        valid_until: { type: string }
        issued_at: { type: string }
        redeemed_at: { type: string, nullable: true }
        created_at: { type: string }
        applies:
          type: boolean
          nullable: true
          description: |
            **本侧恒为 null**：可用性判定是给 C 端下单页用的（见 `contract/app.yaml` 的 `CouponView`），
            运营 / 服务者侧的券列表不判、也不该判——服务者看的是自己券的核销状态，不是「能不能用」。
        recommended: { type: boolean, nullable: true, description: "**本侧恒为 null**：它只服务 C 端下单页的默认选券" }

    # ------------------------------------------------------------------ 订单与履约（切片 #77 / #107 / #109）
    #
    # 金额一律是**字符串两位小数**（ADR-0011）。订单上只有「总额 − 券面额 = 预估实付」
    # 这一组展示用计算值：**没有收款、没有结算、没有退款**（ADR-0036）。

    ProviderOrderSummaryView:
      type: object
      description: 服务者侧的订单列表行。**不含核销码**（门店凭用户出示的码，或按手机号 / 订单号定位订单）
      properties:
        id: { type: integer, format: int64 }
        order_no: { type: string, description: 订单号（**（待澄清：订单号的格式与生成规则）**），也是搜索关键字之一 }
        status: { type: integer, description: 0 待接单 / 1 已预约 / 2 履约中 / 3 已完成 / 4 已取消（ADR-0038 第一节） }
        user_id: { type: integer, format: int64 }
        user_nickname: { type: string, description: 预约人昵称（脱敏姓名，如「张*三」） }
        user_phone: { type: string, description: 预约人手机号，**脱敏展示**（`138****8888`，ADR-0013 / docs/conventions.md 的脱敏口径）。**（待澄清：门店联系用户要不要完整号码——核销按手机号搜索用的是完整号的等值查询，展示却脱敏，两者的张力 ADR 没裁决）** }
        pet_id: { type: integer, format: int64 }
        pet_name: { type: string }
        pet_species: { type: integer, description: "1 犬 / 2 猫（与 PetView.species 同码）：门店要按它准备工位与耗材" }
        service_id: { type: integer, format: int64 }
        service_name: { type: string }
        appointment_date: { type: string, description: 预约日期（YYYY-MM-DD） }
        start_time: { type: string, description: 预约时段开始（HH:mm） }
        end_time: { type: string, description: 预约时段结束（HH:mm） }
        total_amount: { type: string, description: 服务总额（元，两位小数字符串） }
        coupon_discount: { type: string, description: 券面额抵扣（元）；没用券时是 "0.00" }
        estimated_pay_amount: { type: string, description: 预估实付 = 总额 − 券面额。**到店按它收款**（券在门店抵扣），但它不是平台的收款事实（ADR-0036） }
        coupon_id: { type: integer, format: int64, nullable: true, description: 本单锁定的券实例 id；不用券时为空。服务者成本券**只能在本店核销**（ADR-0037 第三节） }
        cancel_request_status: { type: integer, nullable: true, description: 1 待门店处理 / 2 已同意 / 3 已拒绝；为空表示没有取消申请——**1 是要门店行动的**（ADR-0038 第一节） }
        created_at: { type: string }

    ProviderOrderView:
      type: object
      description: |
        服务者侧的订单详情。比列表多出券实例、照片墙、取消申请与状态迁移的时间点。
        **核销码不在里面**：门店不需要知道码本身。
      properties:
        id: { type: integer, format: int64 }
        order_no: { type: string, description: 订单号（**（待澄清：订单号的格式与生成规则）**） }
        status: { type: integer, description: 0 待接单 / 1 已预约 / 2 履约中 / 3 已完成 / 4 已取消 }
        user_id: { type: integer, format: int64 }
        user_nickname: { type: string, description: 预约人昵称（脱敏） }
        user_phone: { type: string, description: 预约人手机号（脱敏 `138****8888`） }
        pet_id: { type: integer, format: int64 }
        pet_name: { type: string }
        pet_species: { type: integer, description: "1 犬 / 2 猫（与 PetView.species 同码）" }
        service_id: { type: integer, format: int64 }
        service_name: { type: string }
        appointment_date: { type: string }
        start_time: { type: string }
        end_time: { type: string }
        total_amount: { type: string }
        coupon_discount: { type: string }
        estimated_pay_amount: { type: string, description: 预估实付：**到店按它收款**，不是平台的收款事实（ADR-0036） }
        coupon:
          description: 本单锁定的券；不用券时为 null。**锁定 ≠ 消耗**：核销时券才转「已核销」，取消订单时释放回「待使用」（ADR-0038 第一节）
          nullable: true
          allOf:
            - $ref: "#/components/schemas/CouponView"
        remark: { type: string, nullable: true, description: 用户下单时给门店的备注（如宠物的特殊注意事项） }
        accepted_at: { type: string, nullable: true, description: 接单时间 }
        redeemed_at: { type: string, nullable: true, description: 核销时间（履约确认，**与收款无关**） }
        reported_at: { type: string, nullable: true, description: 报工完成时间 }
        report_remark: { type: string, nullable: true, description: 报工时留下的说明 }
        photo_wall: { $ref: "#/components/schemas/OrderPhotoWallView" }
        cancel_request_status: { type: integer, nullable: true, description: 1 待门店处理 / 2 已同意 / 3 已拒绝；为空表示没有取消申请 }
        cancel_requested_at: { type: string, nullable: true, description: 用户发起取消申请的时间 }
        cancel_reason: { type: string, nullable: true, description: 取消 / 申请取消的理由 }
        cancel_rejected_reason: { type: string, nullable: true, description: 门店拒绝取消的理由（拒绝必填，ADR-0038 第一节） }
        cancelled_at: { type: string, nullable: true, description: 进入「已取消」的时间 }
        cancelled_by: { type: integer, nullable: true, description: 1 用户 / 2 服务者 / 3 运营 }
        created_at: { type: string }

    # 照片墙的两个 schema 与 app.yaml 的同名 schema 各写一遍（契约文件之间不互相 $ref，
    # 只有 common.yaml 是共享的），形状必须一致——两份对的是同一个后端 DTO。
    OrderPhotoWallView:
      type: object
      description: |
        三道照片墙（ADR-0040 第四节）：接宠检查 / 服务防护 / 取宠对比，**三者缺一不可**。
        订单进入「履约中」后开放；**三个槽位各至少一张照片才允许报工**——这条硬约束在服务端
        （交付文档 2.5 的验收标准「缺一道则系统拒绝报工」，前端禁用按钮不算数）。
        照片 `biz_type=care`、**归属订单**，不进用户的档案照片墙（ADR-0040 / ADR-0030）。
      properties:
        slots:
          type: array
          description: 固定三个槽位（未上传的槽位也在，`satisfied=false`）
          items: { $ref: "#/components/schemas/OrderPhotoSlotView" }
        reportable: { type: boolean, description: 是否已满足报工条件（三个槽位各至少一张）。**服务端算出来的**，前端不要自己判 }
        missing_slots:
          type: array
          description: 还缺哪几个槽位（1 接宠检查 / 2 服务防护 / 3 取宠对比）。报工被拒时界面要能说清「缺哪一道」，不能只说「报工失败」
          items: { type: integer }

    OrderPhotoSlotView:
      type: object
      properties:
        slot: { type: integer, description: 1 接宠检查 / 2 服务防护 / 3 取宠对比, enum: [1, 2, 3] }
        slot_name: { type: string, description: 槽位名（接宠检查 / 服务防护 / 取宠对比），由服务端给出 }
        photos:
          type: array
          description: 该槽位的照片（**判断依据是服务端的计数，不是前端数数组长度**）
          items: { $ref: "#/components/schemas/FileView" }
        remark: { type: string, nullable: true, description: 该槽位的备注 }
        satisfied: { type: boolean, description: 该槽位是否已至少有一张照片 }
        updated_at: { type: string, nullable: true }

    FileView:
      type: object
      description: |
        文件元数据（与 app.yaml 的同名 schema 各写一遍，形状一致）。
        照片先直传再挂业务（ADR-0020）；`url` 是签名读地址，有有效期。
      required: [id, biz_type, role, mime, size_bytes]
      properties:
        id: { type: integer, format: int64 }
        pet_id: { type: integer, format: int64, nullable: true }
        biz_type: { type: string }
        role: { type: string, enum: [original, closeup, thumb] }
        mime: { type: string, enum: [image/jpeg, image/png] }
        size_bytes: { type: integer, format: int64 }
        width: { type: integer, nullable: true }
        height: { type: integer, nullable: true }
        url: { type: string, description: 原图的签名读地址（相对地址，有有效期） }
        thumb_url: { type: string, description: 缩略图签名读地址；缩略图生成失败时回落到原图地址 }

    # 服务者侧的 presign 两张（与 app.yaml 的同名 schema 形状一致，只有 `biz_type` 收窄）。
    # 契约文件之间不互相 $ref（只有 common.yaml 是共享的），所以这里各写一遍；两份对的是同一个
    # 后端 DTO（`com.pethealth.api.app.FilePresignRequest` / `FilePresignView`），字段逐项一致。
    FilePresignRequest:
      type: object
      required: [biz_type, items]
      properties:
        biz_type:
          type: string
          description: |
            业务用途。服务者侧收两种：
            - `care`：订单服务留痕照片（三道照片墙，ADR-0040），要带 `pet_id`；
            - `qualification`：门店资质材料图（营业执照 / 执业许可证等，ADR-0053），**不带 `pet_id`**。

            其余的用途（打卡 / 防疫 / 档案照片 / 咨询图）都是用户自己的照片，不该由门店的手上传，
            契约收窄、服务端照此拒绝（非上述两者 → 40001）。
          enum: [care, qualification]
        pet_id:
          type: integer
          format: int64
          description: 订单里的宠物 id。**只有 `care` 要传**（照片墙要求照片是这只宠物的，校验在订单侧）；`qualification` 留空
        items:
          type: array
          minItems: 1
          maxItems: 9
          items:
            type: object
            required: [mime]
            properties:
              mime:
                type: string
                description: 客户端声明的类型，**只用于提前拦截**；落库以魔数判定为准
                enum: [image/jpeg, image/png]
              size_bytes:
                type: integer
                format: int64
                description: 客户端声明的体积，同上
              role:
                type: string
                description: 原图 original / 局部特写 closeup（不传即 original）
                enum: [original, closeup]

    FilePresignView:
      type: object
      required: [file_id, upload_url, expires_at, max_bytes]
      properties:
        file_id: { type: integer, format: int64 }
        upload_url:
          type: string
          description: 直传地址（相对地址，含签名与有效期）。PUT 到这个地址送字节
          example: "/api/v1/open/files/12/content?token=up.1790600000.9f2c..."
        expires_at: { type: string, example: "2026-09-28 21:30:00" }
        max_bytes: { type: integer, format: int64, description: 单文件上限（字节）。前端可在选择阶段先拦一道 }
        role: { type: string }

    OrderPhotoSlotRequest:
      type: object
      description: |
        一个槽位的全量内容。**整体替换**：`file_ids` 是这一槽位照片的全量集合
        （传 `[]` = 清空该槽位，之后就报不了工了）。
      properties:
        file_ids:
          type: array
          maxItems: 9
          description: 该槽位的照片（`file_id` 来自文件域的上传凭证，`biz_type=care`，ADR-0020）。空数组表示清空
          items: { type: integer, format: int64 }
        remark: { type: string, maxLength: 255, nullable: true, description: 该槽位的备注（如「皮肤有红点，已拍照留痕」） }

    OrderReportRequest:
      type: object
      description: 报工提交。**（待澄清：服务时段的时间戳从哪来——见报工接口的说明。）**
      properties:
        remark: { type: string, maxLength: 255, nullable: true, description: 给用户看的说明（会展现在订单详情里） }

    ServiceReport:
      type: object
      description: |
        一次到店服务的事实（`ProviderReportArchiveApi.ServiceReport`）——**不是 HTTP 请求体**：
        报工成功后 ph-order 经这个 ph-api 接口把这次服务交给 ph-record 写进健康档案
        （F004 的「服务者报工」那一源，ADR-0030 第四条），ph-record 自己不去读订单表（ADR-0006）。
        在这里立条目是为了让「schema 名 ↔ DTO 类名」保持一一对应（与 admin.yaml 的 `ConsultStats`
        同一条口径：跨模块接口的形状也在契约里声明）。
      properties:
        pet_id: { type: integer, format: int64, description: 被服务的宠物 }
        user_id: { type: integer, format: int64, description: 这条档案记录的主人（下单人 = 宠物主人） }
        service_name: { type: string, description: 服务项名（订单下单时的快照，如「基础洗护（小型犬）」） }
        remark: { type: string, nullable: true, description: 门店报工时的说明（可空） }

    ProviderOrderCancelRequest:
      type: object
      required: [reason]
      description: |
        **与用户侧的 `OrderCancelRequest` 是两个不同的对象**（同名会让两份契约互相矛盾：
        用户取消不必给理由，服务者取消必须给——见 ADR-0049 §七）。

        门店取消订单。**`reason` 必填**——服务者单方取消对用户是实打实的伤害（可能白跑一趟），
        所以理由与扣分都要留痕（ADR-0049 §七：允许取消、必填理由、计入考核过程分的「服务者取消率」）。
        不填 → 40001。
      properties:
        reason: { type: string, maxLength: 255, description: 取消理由（会展示给用户、进审计与考核） }

    OrderCancelRejectRequest:
      type: object
      required: [reason]
      description: 拒绝用户的取消申请。**ADR-0038 第一节点名要求：拒绝要填理由**——所以 `reason` 必填。
      properties:
        reason: { type: string, maxLength: 255, description: 拒绝的理由（展示给用户）。不填 → 40001 }

    # ------------------------------------------------------------------ 月度考核（F022）
    #
    # 这三张 schema 与 admin.yaml 的同名 schema **共用同一份后端 DTO**
    # （`com.pethealth.api.provider.AssessmentDtos`）：同一个对象在两端只是可见范围不同，
    # 各写一份形状会让「运营看到的明细」与「服务者看到的明细」慢慢分叉。
    # 契约文件之间不互相 $ref（只有 common.yaml 是共享的），所以这里各写一遍、字段逐项一致。

    AssessmentSummaryView:
      type: object
      description: 一个账期的考核结果（列表行）。明细见 `AssessmentView`
      properties:
        id: { type: integer, format: int64 }
        provider_id: { type: integer, format: int64, description: 服务者 id；**只在运营侧有值**（服务者看自己的列表不需要它） }
        provider_name: { type: string, nullable: true, description: 门店名称；**只在运营侧有值** }
        period: { type: string, description: 考核账期（yyyy-MM）；每月 1 日算上月（ADR-0039 第三节） }
        total_score: { type: string, description: 总分（0.00–100.00 的两位小数字符串）。**分数是字符串不是浮点**（ADR-0011 的精度纪律） }
        level: { type: integer, description: 1 基础 / 2 优选 / 3 战略合作（分档阈值在运营后台配置） }
        level_name: { type: string, description: 等级中文名（基础 / 优选 / 战略合作），由服务端给出 }
        recommend_priority: { type: integer, description: "AI 推荐优先级：1 最高 / 2 较高 / 3 普通。由月度考核按等级档位映射写回，**C 端找店与按项目找店都按它排序**（下一次算分起生效）" }
        participated_weight: { type: integer, description: 参与计分的权重合计（100 = 三项全参与；缺项按 ADR-0050 第四节重算后会小于 100） }
        overridden: { type: boolean, description: 本期是否有单项分被超级管理员覆盖（留痕在明细的 `overrides` 里） }
        calculated_at: { type: string, description: 计算时间（yyyy-MM-dd HH:mm:ss，东八区） }

    AssessmentItemView:
      type: object
      description: |
        一项考核明细。**三项主项**的 `item_code` 是 INVITE（拉新）/ COUPON（券）/ PROCESS（过程）；
        过程分的五个子项挂在 PROCESS 下（`parent_code` = PROCESS）：
        PROCESS_RESPONSE（接单响应）/ PROCESS_REDEEM_RATE（核销率）/ PROCESS_REPORT_RATE（报工完整率）/
        PROCESS_REVIEW（评价分）/ PROCESS_CANCEL_RATE（服务者取消率）。

        **未参与（`participated=false`）的项照样下发**：它们是「这个分为什么是这么算出来的」的答案，
        藏起来就只剩一个说不清的总分（ADR-0050 第四节点名要「明细里注明未参与」）。
      properties:
        item_code: { type: string, description: 项目编码（见上面的枚举） }
        item_name: { type: string, description: 中文名，由服务端给出 }
        parent_code: { type: string, nullable: true, description: 父项：过程子项为 PROCESS；三项主项为空 }
        weight: { type: integer, description: 该项在主项层级的权重（百分比）；过程子项为空（子项之间等权，ADR-0039 第二节） }
        participated: { type: boolean, description: 是否参与计分。false = 平台侧无该维度要求（ADR-0050 第四节），权重按参与项重算 }
        score: { type: string, nullable: true, description: 当前生效得分（0.00–100.00 的两位小数字符串）；未参与时为空 }
        calculated_score: { type: string, nullable: true, description: 算法算出来的原始得分；没被覆盖时与 `score` 相同（被覆盖后仍保留在它上面） }
        raw_value: { type: string, nullable: true, description: 原始指标值（人话，如「有效邀请 3 人」「完成率 0.60 × 核销 8 张」）；未参与时为空 }
        target_value: { type: string, nullable: true, description: 该项当时的达标线快照（规则改了不影响已算出的历史） }
        data_source: { type: string, description: 数据来源（如「ph-order 订单统计」）；未参与时这里写清是哪条事实缺了 }
        note: { type: string, nullable: true, description: 说明：未参与的原因 / 覆盖说明 / 已实现的降级说明 }
        overridden: { type: boolean, description: 该项是否被超级管理员覆盖过 }

    AssessmentOverrideView:
      type: object
      description: 单项分覆盖的留痕（append-only）。**谁、何时、改成多少、为什么都留**
      properties:
        id: { type: integer, format: int64 }
        item_code: { type: string }
        item_name: { type: string }
        before_score: { type: string, description: 覆盖前的生效值（两位小数字符串；覆盖前未参与时为空） }
        after_score: { type: string, description: 覆盖后的生效值 }
        reason: { type: string, description: 覆盖理由（必填，服务者可见——否则算法是黑箱、无法申诉） }
        operator_id: { type: integer, format: int64, description: 操作者（超级管理员）的账号 id }
        created_at: { type: string }

    AssessmentView:
      type: object
      description: |
        一个账期的考核全貌。服务者侧看自己的，运营侧看全平台的（`provider_id` / `provider_name`
        **只在运营侧有值**——与 `CouponContributionView.provider_name` 同一口径）。
      properties:
        id: { type: integer, format: int64 }
        provider_id: { type: integer, format: int64 }
        provider_name: { type: string, nullable: true }
        period: { type: string }
        total_score: { type: string }
        level: { type: integer }
        level_name: { type: string }
        recommend_priority: { type: integer }
        participated_weight: { type: integer }
        overridden: { type: boolean }
        calculated_at: { type: string }
        items:
          type: array
          description: 三项主项 + 过程子项（未参与的也在）
          items: { $ref: "#/components/schemas/AssessmentItemView" }
        overrides:
          type: array
          description: 覆盖留痕（按时间正序）；没被覆盖过时为空数组
          items: { $ref: "#/components/schemas/AssessmentOverrideView" }
